<script>
/* ===== src/00_core.js ===== */
/* ===== 00_core.js — 수치표(BAL)·시드 난수·해시·이벤트 버스·저장·공통 유틸 ===== */
// TODO(통합): 시드는 13_main 의 Main.newSeed() 만 시계·브라우저 난수로 만든다. Core 는 시계·브라우저 난수를 쓰지 않는다.
// TODO(통합): BAL 과 DIST 는 깊이 동결(Object.freeze)되어 있다. 밸런스 조정은 이 파일의 값을 고쳐서만 한다.
//            실행 중 `Core.BAL.X = …` 는 strict 모드에서 TypeError 가 나므로(의도된 것) sim 의 수치 실험도 파일 편집으로.
// TODO(통합): 02~08 은 Core.save/load/clear 를 부르지 않는다(localStorage 는 Run.save/Main 만). Core 안의 참조는 check.js 예외.
// TODO(통합): bus.emit 안에서 구독자가 던진 예외는 console.error 로만 나간다. 통합 QA 때 콘솔을 보고 잡는다.
var Core = (function () { 'use strict';

  var VERSION = '1.0.0';               // 저장 호환 판별
  var SAVE_KEY = 'jingbi_save_v1';
  var SETTINGS_KEY = 'jingbi_settings_v1';
  var DIST = { FAR: 0, NEAR: 1, CLOSE: 2 };   // 원거리 중거리 근접

  /* ------------------------------------------------------------------
   * BAL — 규칙 수치표. 값의 정본은 DESIGN.md, 키 이름은 CONTRACT §2.1.
   * §2.1 에 없는 키는 끝에 모아 두고 출처 절을 주석으로 적었다.
   * ------------------------------------------------------------------ */
  var BAL = {
    // DESIGN §4.1 전투 기본 · §8.2 교착 금지(턴 상한 30, −10%/턴, 강제 종료 100) · CONTRACT §13 동시 적 수 6
    ENERGY: 3, DRAW: 5, HAND_MAX: 10, DECK_MIN: 12, TURN_CAP: 30, TURN_CAP_PENALTY: 0.10, TURN_HARD: 100, ENEMY_MAX: 6,
    // DESIGN §4.9 「부장이 대신 섰다」: 병력 20 으로 생환, 둘이면 5초 뒤 자동
    RESCUE_HP: 20, RESCUE_AUTO_MS: 5000,
    // DESIGN §4.1 병력 · §4.6 시작 의심(이순신 1)
    LEADER_HP: { yi: 80, gwon: 84 }, SUSP_START: { yi: 1, gwon: 0 },
    // DESIGN §4.6 의심 0~10, 문턱 4/7/10, 어명 상한 3, 옥사 뒤 7, 부장 없으면 최대 병력 −10
    SUSP_MAX: 10, SUSP_THRESH: [4, 7, 10], EDICT_CAP: 3, PRISON_RESET: 7, PRISON_NO_DEPUTY_MAXHP: -10,
    // DESIGN §4.7 군량: 시작 50, 일반 10~20, 정예 35, 결전 60, 거르기 +5 · CONTRACT §6.4 정예 기물 없을 때 30
    RATION_START: 50, RATION_FIGHT: [10, 20], RATION_ELITE: 35, RATION_BOSS: 60, RATION_SKIP: 5, RATION_NO_RELIC: 30,
    // DESIGN §4.7 장시: 카드 30/50/50/60, 기물 80·120, 환향 40(어명 90), 오방낭 10%, 진열 카드 5·기물 2
    SHOP: { card: { common: 30, rare: 50, special: 50, leader: 60 }, relic: [80, 120], remove: 40, removeEdict: 90,
            discount: 0.10, cards: 5, relics: 2,
            removePerVisit: 1 },                       // DESIGN §4.7 「방문당 퇴출 1회」
    // DESIGN §4.7 군영: 쉬다 30%, 둔전 +40
    CAMP: { restPct: 0.30, farm: 40 },
    // DESIGN §4.7 조정: 장계 −2, 청병 군량 20 · 명군 3장 중 1
    COURT: { report: -2, requestCost: 20, requestPick: 3,
             requestMinAct: 3 },                       // DESIGN §4.7 「청병(3막 이후)」
    // DESIGN §4.7 보상: 일반 70% 희귀 25% 특수 5%, 주장 고유 15%, 3장
    REWARD: { common: 0.70, rare: 0.25, special: 0.05, leaderChance: 0.15, cards: 3,
              bossMinRarity: 'rare' },                 // DESIGN §4.7 「결전: 희귀 이상 보장」
    // DESIGN §4.8 장계 분배: 공 10, 기본 주장 4·임금 6, 주장 4점당 강화(최대 2), 5점 의심 +1·10점 +2,
    //   임금 3점당 의심 −1(최대 −3)·군량 +5, 명군 5점당 −1(최대 −2)
    MERIT: { total: 10, default: { leader: 4, king: 6, ming: 0 }, leaderPer: 4, leaderMaxUp: 2, leaderSusp5: 1, leaderSusp10: 2,
             kingPer: 3, kingMaxDown: 3, kingRation: 5, mingPer: 5, mingMaxDiscount: 2,
             mingMinAct: 3 },                          // DESIGN §4.8 「명군(3막 이후 열림)」
    // DESIGN §4.2 거리 배율표. 인덱스 = 거리(0원거리 1중거리 2근접). 적 melee 의 원거리는 0 = 불가(접근으로 바뀜). charge 는 이동 후 항상 1.5
    MULT: { shot: [1.5, 1, 0.5], melee: [0.7, 1, 1.2], charge: [1.5, 1.5, 1.5], fire: [1, 1, 1], none: [1, 1, 1],
            e_gun: [0.5, 1, 0.8], e_melee: [0, 1, 1.5], e_bow: [1, 1, 1] },
    // DESIGN §4.10 지역 ×1.4 · §4.5 동요 −25%·허점 +50% · CONTRACT §13 위축 −50% · 숨어라 −70%/−80%(강화)
    HOME_BONUS: 1.4, SHAKEN_PCT: 0.25, EXPOSED_PCT: 0.50, FLINCH_PCT: 0.50, HIDE_PCT: 0.70, HIDE_PLUS_PCT: 0.80,
    // DESIGN §4.6 진격하라 +50% · §5.7 독전 +60% · §5.9 원균 대행 +20%
    EDICT_ATK_PCT: 0.50, DOKJEON_PCT: 0.60, WON_GYUN_PCT: 0.20,
    // DESIGN §6.4 이순신 필사즉생(병력 40% 이하 +40%) · 권율 지구 3 · 권율 부장 2
    YI: { hpPct: 40, atkPct: 0.40 }, GWON_KEEP: 3, GWON_DEPUTY_KEEP: 2,
    // DESIGN §6.2 막 배율: 체력 ×(1 + 0.12×(막−1)), 피해 +[0,0,1,1,2,2,3][막−1]
    ACT_SCALE: { hpPer: 0.08, dmgAdd: [0, 0, 1, 1, 2, 2, 3] },        // 밸런스: 0.12 → 0.08 (시뮬 1차)
    // DESIGN §4.1 수성 성벽 10 · 공성 적 성벽 15 · §6.3 왜성 gun +20% · 고개 진형 +5/2턴 · 강 기세 +3
    SIEGE_WALL: 10, ASSAULT_ENEMY_WALL: 15, WAESEONG_GUN_PCT: 0.20, RIDGE_BLOCK: 5, RIDGE_HOLD: 2, RIVER_MOMENTUM: 3,
    // DESIGN §4.12 조류: 3턴 교대, 역류 전진 2칸·push −1, 순류 군령 +1·push +1
    TIDE: { period: 3, ebbStep: 2, ebbPush: -1, flowEnergy: 1, flowPush: 1 },
    // DESIGN §5.8 B6 명량: 도도 160(칠천량 없으면 180), 증원 3턴(없으면 2턴), 상한 8, 기적 수군 +4
    MYEONGNYANG: { todoHp: 130, todoHpNoChilcheon: 140, reinforceEvery: 3, reinforceEveryNoChilcheon: 3, cap: 8, miracleNavyBonus: 4 },   // 밸런스: 160/180 → 130/150
    // DESIGN §5.8 B7 노량: 1단계 120, 2단계 150, 증원 2턴, 상한 6, push 1칸 상한
    NORYANG: { p1: 100, p2: 120, reinforceEvery: 2, cap: 6, pushMax: 1 },   // 밸런스: 120/150 → 100/120
    // DESIGN §4.13 뽑기 훅 턴당 3회 · §4.2 조총 관통 50%
    DRAW_HOOK_CAP: 3, GUN_PIERCE: 0.5,
    // DESIGN §8.3 점수
    SCORE: { node: 10, elite: 30, boss: 100, hpMul: 2, suspMul: 15, smallDeck: { max: 25, bonus: 100 },
             branch: { joryeong: 150, jinju1: 100, jinju2: 200, notDismissed: 200, noChilcheon: 150, miracle: 300, yiAlive: 250 } },
    // DESIGN §5.9 어전회의: ≥7 파직, 군량 30, 狀 제거 최대 2, 파직 뒤 의심 3
    COUNCIL: { dismissAt: 7, rationCost: 30, maxRemove: 2, afterDismiss: 3,
               defenseDelta: -1 },                     // DESIGN §5.9 변호 수단 하나당 의심 −1
    // DESIGN §7.1 연출 ≤0.25초 · 큐 최대 대기 0.5초 · §7.5 길게 누르기 400ms · 누름 영역 44px
    FX_MS: 250, FX_WAIT_MAX_MS: 500, LONG_PRESS_MS: 400, TAP_MIN: 44,

    // ---- §2.1 에 없는 규칙 수치 (출처 절) ----
    DEPUTY_SLOTS: 2,                                   // DESIGN §6.4 「부장 (자리 2)」. special 은 3번째 자리(별도)
    WIN_SUSP: { elite: 1, boss: 1 },                   // DESIGN §4.6 「결전 승리 +1 · 정예 승리 +1」
    FAMED_ACT_SUSP: 1,                                 // DESIGN §4.6 「막 시작 시 공 큰 장수가 주장·부장이면 +1」
    WON_GYUN_SUSP: 1,                                  // DESIGN §5.9 원균 대행 「의심 +1」 (CONTRACT §6.7)
    SIM: { maxPrompts: 3000, maxBattleTurns: 300 },    // CONTRACT §8 · DESIGN §10.6 교착 판정 안전장치
    ACT_HEAL_PCT: 0.5                                  // 밸런스(CONTRACT §13): 새 막에 들어서면 잃은 병력의 절반을 수습한다
  };

  /* ------------------------------------------------------------------ 유틸 */
  function deepFreeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
      Object.freeze(o);
      Object.keys(o).forEach(function (k) { deepFreeze(o[k]); });
    }
    return o;
  }
  deepFreeze(BAL);
  deepFreeze(DIST);

  function assert(cond, msg) {
    if (!cond) throw new Error('Core.assert: ' + (msg || '조건 실패'));
  }
  function clamp(v, a, b) {
    if (a > b) { var t = a; a = b; b = t; }
    return v < a ? a : (v > b ? b : v);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clone(o) {
    if (o === undefined) return undefined;
    return JSON.parse(JSON.stringify(o));
  }
  // 숫자 표기: 천 단위 쉼표, 음수는 「−」(U+2212). signed 가 참이면 양수에 「+」.
  function fmtNum(n, signed) {
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    var neg = n < 0, a = Math.abs(n);
    var s = (Math.floor(a) === a) ? String(a) : String(Math.round(a * 10) / 10);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    s = parts.join('.');
    if (neg) return '−' + s;
    if (signed && n > 0) return '+' + s;
    return s;
  }

  /* ------------------------------------------------------------------ 해시 (FNV-1a 32bit) */
  function hash(str) {
    var s = (typeof str === 'string') ? str : String(str);
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  /* ------------------------------------------------------------------ 시드 난수 (mulberry32) */
  // 상태는 {s:uint32} 하나. JSON 왕복 가능. 같은 시드 → 같은 수열.
  function rngNew(seed) {
    var s;
    if (typeof seed === 'number' && isFinite(seed)) s = Math.floor(seed) >>> 0;
    else s = hash(seed === undefined || seed === null ? '' : String(seed));
    return { s: s };
  }
  function rand(r) {
    r.s = (r.s + 0x6D2B79F5) >>> 0;
    var t = r.s | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randInt(r, a, b) {
    a = Math.floor(a); b = Math.floor(b);
    if (b < a) { var t = a; a = b; b = t; }
    return a + Math.floor(rand(r) * (b - a + 1));
  }
  function pick(r, arr) {
    if (!arr || !arr.length) return null;
    return arr[Math.floor(rand(r) * arr.length)];
  }
  function shuffle(r, arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rand(r) * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  // items: [{w, v}]. 가중치 합이 0 이하이거나 비어 있으면 null (rng 는 전진하지 않는다).
  function weighted(r, items) {
    if (!items || !items.length) return null;
    var total = 0, i, w;
    for (i = 0; i < items.length; i++) { w = Number(items[i].w) || 0; if (w > 0) total += w; }
    if (total <= 0) return null;
    var x = rand(r) * total, last = null;
    for (i = 0; i < items.length; i++) {
      w = Number(items[i].w) || 0;
      if (w <= 0) continue;
      last = items[i].v;
      x -= w;
      if (x < 0) return items[i].v;
    }
    return last;   // 부동소수 끝자리 보정
  }

  /* ------------------------------------------------------------------ 이벤트 버스 */
  // 동기. 구독자 예외는 잡아서 console.error 로만 내보낸다(상태 전이를 막지 않는다).
  var errSink = null;   // selfTest 가 잠시 바꿔 끼운다
  function reportError(type, e) {
    if (errSink) { errSink(type, e); return; }
    if (typeof console !== 'undefined' && console && console.error) {
      console.error('[Core.bus] "' + type + '" 구독자 예외: ' + ((e && e.stack) || e));
    }
  }
  var subs = {};
  var bus = {
    on: function (type, fn) {
      assert(typeof fn === 'function', 'bus.on: fn 이 함수가 아님 (' + type + ')');
      (subs[type] || (subs[type] = [])).push(fn);
      return function () { bus.off(type, fn); };
    },
    off: function (type, fn) {
      var list = subs[type];
      if (!list) return;
      var i = list.indexOf(fn);
      if (i >= 0) list.splice(i, 1);
      if (!list.length) delete subs[type];
    },
    emit: function (type, payload) {
      var list = subs[type];
      if (!list || !list.length) return 0;
      var copy = list.slice(), n = 0;
      for (var i = 0; i < copy.length; i++) {
        try { copy[i](payload, type); n++; }
        catch (e) { reportError(type, e); }
      }
      return n;
    },
    count: function (type) { return subs[type] ? subs[type].length : 0; },
    clear: function (type) {
      if (type === undefined) subs = {};
      else delete subs[type];
    }
  };

  /* ------------------------------------------------------------------ 저장 (localStorage) */
  function getStorage() {
    try {
      if (typeof localStorage !== 'undefined' && localStorage &&
          typeof localStorage.getItem === 'function') return localStorage;
    } catch (e) { /* 접근 자체가 막힌 환경 */ }
    return null;
  }
  function save(key, obj) {
    var st = getStorage();
    if (!st) return false;
    try { st.setItem(key, JSON.stringify(obj)); return true; }
    catch (e) { return false; }
  }
  function load(key) {
    var st = getStorage();
    if (!st) return null;
    try {
      var raw = st.getItem(key);
      if (raw === null || raw === undefined || raw === '') return null;
      var v = JSON.parse(raw);
      return (v === undefined) ? null : v;
    } catch (e) { return null; }
  }
  function clear(key) {
    var st = getStorage();
    if (!st) return false;
    try { st.removeItem(key); return true; }
    catch (e) { return false; }
  }

  /* ------------------------------------------------------------------ uid */
  // state.uidCounter 를 1 올려 'u'+n 을 돌려준다. 전투(st)·판(G) 모두 이 방식.
  function nextUid(state) {
    assert(state && typeof state === 'object', 'nextUid: state 가 객체가 아님');
    var n = (typeof state.uidCounter === 'number' && isFinite(state.uidCounter)) ? state.uidCounter : 0;
    n = Math.floor(n) + 1;
    state.uidCounter = n;
    return 'u' + n;
  }

  /* ------------------------------------------------------------------ selfTest */
  function selfTest() {
    var errors = [];
    function check(cond, msg) { if (!cond) errors.push(msg); }
    var i, a, b;

    try {
      // 1. 같은 시드 → 같은 난수열, 범위 [0,1)
      var r1 = rngNew(42), r2 = rngNew(42), same = true, inRange = true;
      for (i = 0; i < 200; i++) {
        a = rand(r1); b = rand(r2);
        if (a !== b) same = false;
        if (!(a >= 0 && a < 1)) inRange = false;
      }
      check(same, 'rand: 같은 시드가 다른 수열을 냈다');
      check(inRange, 'rand: [0,1) 범위를 벗어났다');
      check(rand(rngNew(42)) !== rand(rngNew(43)), 'rand: 다른 시드가 같은 첫 값');
      check(rngNew('징비').s === rngNew('징비').s && rngNew('징비').s === hash('징비'), 'rngNew: 문자열 시드가 hash 와 다름');
      check(rngNew(4294967296 + 5).s === 5, 'rngNew: uint32 접기 실패');
      // JSON 왕복 뒤에도 같은 수열
      var r3 = rngNew('왕복'); rand(r3); rand(r3);
      var r4 = clone(r3);
      check(rand(r3) === rand(r4) && rand(r3) === rand(r4), 'rng: JSON 왕복 뒤 수열이 다름');

      // 2. randInt·pick·shuffle·weighted
      var r5 = rngNew(7), ok = true, seen = {};
      for (i = 0; i < 500; i++) { var v = randInt(r5, 3, 6); seen[v] = true; if (v < 3 || v > 6 || v !== Math.floor(v)) ok = false; }
      check(ok && seen[3] && seen[4] && seen[5] && seen[6], 'randInt: 3..6 포함 범위 실패');
      check(randInt(rngNew(1), 5, 5) === 5, 'randInt: a===b');
      check(randInt(rngNew(1), 6, 3) === randInt(rngNew(1), 3, 6), 'randInt: 뒤집힌 인자');
      check(pick(rngNew(1), []) === null && pick(rngNew(1), null) === null, 'pick: 빈 배열이 null 이 아님');
      check(pick(rngNew(1), ['x']) === 'x', 'pick: 한 원소');
      var base = []; for (i = 0; i < 20; i++) base.push(i);
      var s1 = shuffle(rngNew(99), base.slice()), s2 = shuffle(rngNew(99), base.slice());
      check(JSON.stringify(s1) === JSON.stringify(s2), 'shuffle: 같은 시드가 다른 순열');
      check(JSON.stringify(s1.slice().sort(function (x, y) { return x - y; })) === JSON.stringify(base), 'shuffle: 순열이 아님');
      check(JSON.stringify(s1) !== JSON.stringify(base), 'shuffle: 섞이지 않음');
      var arrRef = [1, 2, 3]; check(shuffle(rngNew(1), arrRef) === arrRef, 'shuffle: 제자리 반환이 아님');
      var r6 = rngNew(5), onlyB = true;
      for (i = 0; i < 100; i++) if (weighted(r6, [{ w: 0, v: 'a' }, { w: 5, v: 'b' }]) !== 'b') onlyB = false;
      check(onlyB, 'weighted: 가중치 0 이 뽑혔다');
      var cnt = { 1: 0, 2: 0 }, r7 = rngNew(11);
      for (i = 0; i < 300; i++) cnt[weighted(r7, [{ w: 1, v: 1 }, { w: 1, v: 2 }])]++;
      check(cnt[1] > 60 && cnt[2] > 60, 'weighted: 균등 가중치 분포 이상 ' + JSON.stringify(cnt));
      check(weighted(rngNew(1), []) === null && weighted(rngNew(1), [{ w: 0, v: 1 }]) === null, 'weighted: 빈/0 가중치가 null 이 아님');

      // 3. hash (FNV-1a 32bit 표준 벡터)
      check(hash('') === 2166136261, 'hash: FNV-1a 빈 문자열');
      check(hash('a') === 0xe40c292c, 'hash: FNV-1a "a"');
      check(hash('foobar') === 0xbf9cf968, 'hash: FNV-1a "foobar"');
      check(hash('징비') === hash('징비') && hash('징비') !== hash('징비록'), 'hash: 한글 안정성');
      check(hash(12345) === hash('12345'), 'hash: 숫자를 문자열로 취급');

      // 4. bus: 순서·구독 해제·예외 격리
      var calls = [], sinkN = 0;
      var un1 = bus.on('_t', function () { throw new Error('boom'); });
      var un2 = bus.on('_t', function (p) { calls.push(p); });
      errSink = function () { sinkN++; };
      var n = bus.emit('_t', 7);
      errSink = null;
      check(calls.length === 1 && calls[0] === 7, 'bus: 앞 구독자의 예외가 뒤 구독자를 막았다');
      check(sinkN === 1 && n === 1, 'bus: 예외 보고/정상 호출 수가 다름');
      un1();
      bus.emit('_t', 8);
      check(calls.length === 2 && calls[1] === 8 && bus.count('_t') === 1, 'bus: 구독 해제 함수 실패');
      un2();
      check(bus.emit('_t', 9) === 0 && calls.length === 2 && bus.count('_t') === 0, 'bus: off 뒤에도 호출됨');
      bus.off('_없음', function () {});   // 없는 구독 해제는 무해
      var selfUn = bus.on('_u', function () { selfUn(); });   // 발화 중 자기 해제
      bus.on('_u', function (p) { calls.push(p); });
      bus.emit('_u', 10);
      check(calls.length === 3 && calls[2] === 10 && bus.count('_u') === 1, 'bus: 발화 중 해제가 뒤 구독자를 건너뛰었다');
      bus.clear('_u');
      check(bus.count('_u') === 0, 'bus: clear(type) 실패');

      // 5. save 왕복 (localStorage 없으면 건너뜀)
      if (getStorage()) {
        var key = 'jingbi_selftest_v1', obj = { ver: VERSION, deck: [{ uid: 'u1', id: 'bowstring', up: false }], n: -3, t: null };
        check(save(key, obj) === true, 'save: 저장 실패');
        var back = load(key);
        check(JSON.stringify(back) === JSON.stringify(obj), 'save/load: 왕복 불일치');
        clear(key);
        check(load(key) === null, 'clear: 지운 뒤 null 이 아님');
        check(load('jingbi_없는키_v1') === null, 'load: 없는 키가 null 이 아님');
      }

      // 6. nextUid · clone · clamp · lerp · fmtNum · deepFreeze
      var st = { uidCounter: 0 };
      check(nextUid(st) === 'u1' && nextUid(st) === 'u2' && st.uidCounter === 2, 'nextUid: 순번');
      var st2 = {}; check(nextUid(st2) === 'u1' && st2.uidCounter === 1, 'nextUid: 카운터 없는 상태');
      var src = { a: [1, { b: 2 }], c: null };
      var cp = clone(src);
      check(JSON.stringify(cp) === JSON.stringify(src) && cp !== src && cp.a !== src.a, 'clone: 깊은 복사 실패');
      check(clamp(5, 0, 3) === 3 && clamp(-1, 0, 3) === 0 && clamp(2, 0, 3) === 2 && clamp(5, 3, 0) === 3, 'clamp');
      check(lerp(0, 10, 0.5) === 5 && lerp(2, 2, 0.3) === 2, 'lerp');
      check(fmtNum(1250) === '1,250' && fmtNum(-3) === '−3' && fmtNum(5, true) === '+5' && fmtNum(0, true) === '0' &&
            fmtNum(1234567) === '1,234,567' && fmtNum(NaN) === '—' && fmtNum(0.25) === '0.3', 'fmtNum: ' +
            [fmtNum(1250), fmtNum(-3), fmtNum(5, true), fmtNum(0, true), fmtNum(0.25)].join('|'));
      var threw = false;
      try { BAL.ENERGY = 99; } catch (e) { threw = true; }
      check(threw && BAL.ENERGY === 3 && Object.isFrozen(BAL.MULT.shot), 'BAL: 동결되지 않음');
      threw = false;
      try { assert(false, 'x'); } catch (e) { threw = /x/.test(e.message); }
      check(threw, 'assert: 던지지 않음');

      // 7. BAL 형태 검사
      check(BAL.SUSP_THRESH.length === 3 && BAL.SUSP_THRESH[2] === BAL.SUSP_MAX, 'BAL.SUSP_THRESH');
      var mk = Object.keys(BAL.MULT), mulOk = true;
      for (i = 0; i < mk.length; i++) if (BAL.MULT[mk[i]].length !== 3) mulOk = false;
      check(mulOk && mk.length === 8, 'BAL.MULT: 행마다 원거리·중거리·근접 3칸이어야 한다');
      var d = BAL.MERIT.default;
      check(d.leader + d.king + d.ming === BAL.MERIT.total, 'BAL.MERIT.default 합이 total 과 다름');
      check(BAL.ACT_SCALE.dmgAdd.length === 7, 'BAL.ACT_SCALE.dmgAdd 는 7막');
      check(BAL.REWARD.common + BAL.REWARD.rare + BAL.REWARD.special === 1, 'BAL.REWARD 확률 합');
      check(BAL.LEADER_HP.yi === 80 && BAL.LEADER_HP.gwon === 84 && BAL.SUSP_START.yi === 1, 'BAL.LEADER_HP/SUSP_START');
      check(BAL.RATION_FIGHT[0] <= BAL.RATION_FIGHT[1] && BAL.SHOP.relic[0] <= BAL.SHOP.relic[1], 'BAL 범위 배열 순서');
      check(JSON.stringify(clone(BAL)) === JSON.stringify(BAL), 'BAL: JSON 왕복');
      check(DIST.FAR === 0 && DIST.NEAR === 1 && DIST.CLOSE === 2, 'DIST');
    } catch (e) {
      errors.push('selfTest 예외: ' + ((e && e.stack) || e));
    } finally {
      errSink = null;
    }
    return { ok: errors.length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ api */
  var api = {
    VERSION: VERSION, SAVE_KEY: SAVE_KEY, SETTINGS_KEY: SETTINGS_KEY, DIST: DIST, BAL: BAL,
    rngNew: rngNew, rand: rand, randInt: randInt, pick: pick, shuffle: shuffle, weighted: weighted,
    hash: hash, clamp: clamp, lerp: lerp, clone: clone, assert: assert, deepFreeze: deepFreeze,
    bus: bus,
    save: save, load: load, clear: clear,
    nextUid: nextUid, fmtNum: fmtNum,
    selfTest: selfTest
  };
  return api;
})();

var TXT = (function(){ 'use strict';

  function hasJong(w){

  // '1592.4.15' → '1592년 4월 15일', '1592.4.17~19' → '1592년 4월 17~19일', '1592.6' → '1592년 6월',
  // '1592.4.30~5.3' → '1592년 4월 30일~5월 3일', '1597.12.22~1.4' → '1597년 12월 22일~1598년 1월 4일', '1592.9~1593.1' → '1592년 9월~1593년 1월'

    if (a.length < 2 || isNaN(a[0]) || isNaN(a[1])) return str;

    if (b.length === 1) { if (d == null) { m2 = b[0]; if (m2 < m) y2 = y + 1; } else { d2 = b[0]; } }

/* ---------- 자가 검사 ---------- */
var IDS = ('bowstring spear_wall retreat_horn war_drum report hwando throw_stone pyeonjeon seungja hide shield_wall iron_wall pike_square volley scout regroup ' +
  'cavalry_charge arrow_rain archer_ambush samsu whip resolve ash_bag cannon_volley jincheonroe discipline pajin cheonja crane_wing turtle_ship retreat_fire ' +
  'panok_turn daejanggun lure fire_arrow rowers twelve_ships flagship rolling_fire manifesto militia red_robe uiryeong_rising jeongam_ambush geumsan_drum ' +
  'monk_soldiers mountain_raid people_stones monk_rally bamboo_spear ambush_fire scorched_earth counter_spy parley nanjung_diary scarecrow scout_boat memorial ' +
  'beacon castle_well desperate_call baesujin mountain_fort hwacha hyeonja repair_parapet ongseong counter_mound gate_sally boiling_water pyongyang_bombard ' +
  'nambyeong_cannon li_cavalry folangji langseon request_troops chen_lin_bombard deng_zilong ming_navy_square pilsa_jeuksaeng not_one_ship sinsang_pilbeol ' +
  'danghangpo_lure hwacha_volley sema die_standing level_ground jeolla_right wall_rally bukgwan_cavalry seven_hundred ichi_bow yeonan_fort edict_advance ' +
  'edict_blame edict_arrest edict_envy jochong dokjeon').split(' ');
var OPS_COMMON = ['suspicion', 'ration', 'hp', 'addCard', 'removeCard', 'upgrade', 'relic', 'flag', 'leave', 'cond', 'fx', 'score'];
var OPS_BATTLE = ['dmg', 'block', 'push', 'pull', 'draw', 'energy', 'status', 'stun', 'buff', 'exhaustHand', 'discard', 'exhaust', 'retrieve', 'mark', 'delay', 'stripBlock'];
var OPS_RUN_ONLY = ['battle', 'recruit', 'ending', 'offer', 'upgrade', 'relic', 'score'];   // 카드 ops 에서는 금지(판 전용·전투에서 throw 되는 것)
var COND_KEYS = ['dist', 'distNot', 'hpPct', 'naval', 'siege', 'assault', 'field', 'turn', 'turnLte', 'hasWall', 'tide', 'wave', 'cardTag', 'cardType', 'cardPool',
  'cardId', 'cardMarked', 'enemyId', 'enemyTag', 'handCount', 'cardsPlayedThisTurn', 'deckTagCount', 'hasCard', 'hasRelic', 'hasDeputy', 'noDeputy', 'flag',
  'leader', 'lane', 'act', 'actGte', 'ration', 'suspicion', 'slotsFree', 'oncePerBattle', 'oncePerTurn'];
var STATUS_IDS = ['shaken', 'exposed', 'hunger', 'momentum', 'ambush', 'ironwall', 'stun', 'flinch', 'loaded'];
var BUFF_IDS = ['nextAtk', 'atkAdd', 'shotAdd', 'atkPct', 'shotPct', 'evadeFirst', 'hide', 'noAtk', 'noMelee', 'noPushBattle', 'wallPersist', 'chargeAtClose', 'noAdvance', 'passivesOff', 'minHp1'];
var MULT_TAGS = ['shot', 'melee', 'charge', 'fire', 'none'];
var EXTRA_TAGS = ['pierce', 'navy', 'uibyeong', 'ming', 'siege'];
var POOLS = ['base', 'common', 'navy', 'uibyeong', 'tactic', 'siege', 'ming', 'leader', 'deputy', 'edict', 'event', 'token'];
var TYPES = ['atk', 'def', 'tac', 'rep', 'edict'];
var RARITIES = ['common', 'rare', 'special', null];
var HOMES = ['경상', '전라', '충청', '경기', '강원', '황해', '평안', '함경'];
var OWNERS = ['yi', 'gwon', 'yi_eokgi', 'kim_simin', 'jeong_munbu', 'jo_heon', 'hwang_jin', 'yi_jeongam'];
var PLUS_KEYS = ['cost', 'costIf', 'ops', 'onDraw', 'desc', 'ration', 'exhaust', 'retain'];
var CARD_KEYS = ['id', 'name', 'hanja', 'pool', 'type', 'cost', 'costIf', 'rarity', 'tags', 'home', 'ration', 'exhaust', 'retain', 'owner', 'ops', 'onDraw', 'desc', 'plus', 'memo'];

// ops 트리를 걷는다. visit(op, path, inCardOps). 중첩: cond.then/else · delay.ops · exhaustHand.perCard
function walkOps(ops, path, inCardOps, visit){
  if (!Array.isArray(ops)) { visit(null, path + ' (배열 아님)', inCardOps); return; }
  for (var i = 0; i < ops.length; i++) {
    var o = ops[i], p = path + '[' + i + ']';
    visit(o, p, inCardOps);
    if (!o || typeof o !== 'object') continue;
    if (o.op === 'cond') { if (o.then) walkOps(o.then, p + '.then', inCardOps, visit); if (o.else) walkOps(o.else, p + '.else', inCardOps, visit); }
    if (o.op === 'delay') walkOps(o.ops || [], p + '.ops', false, visit);
    if (o.op === 'exhaustHand') walkOps(o.perCard || [], p + '.perCard', false, visit);
  }
}
function hasDmg(ops){ var f = false; walkOps(ops, '', true, function(o){ if (o && o.op === 'dmg') f = true; }); return f; }
function hasPierce(ops){ var f = false; walkOps(ops, '', true, function(o){ if (o && o.op === 'dmg' && o.pierce === true) f = true; }); return f; }
function sameJson(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

function selfTest(){
  var errors = [];
  function err(s){ errors.push(s); }
  if (list.length !== 99) err('카드 수 ' + list.length + ' (99 아님)');
  if (list.length === IDS.length) { for (var k = 0; k < IDS.length; k++) if (list[k].id !== IDS[k]) { err('ID 순서 불일치 #' + (k + 1) + ': ' + list[k].id + ' ≠ ' + IDS[k]); break; } }
  else err('ID 목록 길이 ' + IDS.length + ' ≠ list ' + list.length);
  var seen = {};
  list.forEach(function(c, idx){
    var tag = '#' + (idx + 1) + ' ' + c.id;
    if (seen[c.id]) err(tag + ' ID 중복'); seen[c.id] = true;
    if (!/^[a-z][a-z0-9_]*$/.test(c.id)) err(tag + ' ID 형식');
    Object.keys(c).forEach(function(key){ if (CARD_KEYS.indexOf(key) < 0) err(tag + ' 모르는 필드 ' + key); });
    ['id', 'name', 'pool', 'type', 'cost', 'tags', 'ops', 'desc', 'plus', 'memo'].forEach(function(key){ if (c[key] === undefined) err(tag + ' 필수 필드 없음 ' + key); });
    if (!('rarity' in c)) err(tag + ' rarity 없음');
    if (POOLS.indexOf(c.pool) < 0) err(tag + ' pool ' + c.pool);
    if (TYPES.indexOf(c.type) < 0) err(tag + ' type ' + c.type);
    if (!(c.cost === 0 || c.cost === 1 || c.cost === 2 || c.cost === 3)) err(tag + ' cost ' + c.cost);
    if (RARITIES.indexOf(c.rarity) < 0) err(tag + ' rarity ' + c.rarity);
    var mustNull = ['token', 'edict', 'event', 'deputy'].indexOf(c.pool) >= 0;
    if (mustNull && c.rarity !== null) err(tag + ' 토큰·어명·사건·부장 카드는 rarity null');
    if (!mustNull && c.rarity === null) err(tag + ' 풀 카드는 rarity 필요');
    if ((c.type === 'edict') !== (c.pool === 'edict')) err(tag + ' type edict ↔ pool edict');
    if (typeof c.desc !== 'string' || !c.desc) err(tag + ' desc 비어 있음');
    if (typeof c.memo !== 'string' || !c.memo) err(tag + ' memo 비어 있음');
    if (c.hanja !== undefined && typeof c.hanja !== 'string') err(tag + ' hanja');
    // 태그
    if (!Array.isArray(c.tags)) { err(tag + ' tags 배열 아님'); return; }
    c.tags.forEach(function(t, i){ if (MULT_TAGS.indexOf(t) < 0 && EXTRA_TAGS.indexOf(t) < 0) err(tag + ' 모르는 태그 ' + t); if (i > 0 && MULT_TAGS.indexOf(t) >= 0) err(tag + ' 배율 태그는 첫 자리만: ' + t); });
    var atk = hasDmg(c.ops);
    if (atk && MULT_TAGS.indexOf(c.tags[0]) < 0) err(tag + ' 공격 카드의 첫 태그가 배율 태그가 아님');
    if (!atk && c.tags.length && MULT_TAGS.indexOf(c.tags[0]) >= 0) err(tag + ' 공격 아닌 카드에 배율 태그');
    if (atk && c.type !== 'atk') err(tag + ' dmg 가 있으면 type atk');
    if (c.pool === 'navy' && c.tags.indexOf('navy') < 0) err(tag + ' 수군 풀은 navy 태그');
    if ((c.pool === 'ming' || (c.pool === 'token' && c.id !== 'militia')) && c.tags.indexOf('ming') < 0) err(tag + ' 명군 풀·명 수군 토큰은 ming 태그');
    if (c.pool === 'siege' && c.tags.indexOf('siege') < 0) err(tag + ' 수성 풀은 siege 태그');
    if ((c.pool === 'uibyeong' || c.id === 'militia' || c.home) && c.tags.indexOf('uibyeong') < 0) err(tag + ' 의병 풀·의병 토큰·home 카드는 uibyeong 태그');
    var pierce = hasPierce(c.ops);
    if (pierce !== (c.tags.indexOf('pierce') >= 0)) err(tag + ' pierce 태그 ↔ dmg pierce 불일치');
    if (c.home !== undefined && HOMES.indexOf(c.home) < 0) err(tag + ' home ' + c.home);
    if (c.ration !== undefined && (c.pool !== 'ming' || !(c.ration >= 1))) err(tag + ' ration 은 명군 풀만, 1 이상');
    if (c.owner !== undefined && OWNERS.indexOf(c.owner) < 0) err(tag + ' owner ' + c.owner);
    if ((c.pool === 'leader' || c.pool === 'deputy') && !c.owner) err(tag + ' 주장·부장 고유 카드는 owner 필요');
    if (c.pool === 'leader' && c.owner !== 'yi' && c.owner !== 'gwon') err(tag + ' 주장 카드 owner');
    if (c.exhaust !== undefined && c.exhaust !== true) err(tag + ' exhaust 는 true 만');
    if (c.retain !== undefined && c.retain !== true) err(tag + ' retain 은 true 만');
    if (c.costIf !== undefined && (!c.costIf.if || typeof c.costIf.cost !== 'number')) err(tag + ' costIf 형식');
    // ops
    checkOps(c.ops, tag + ' ops', true);
    if (c.onDraw !== undefined) { checkOps(c.onDraw, tag + ' onDraw', false); if (c.pool !== 'edict') err(tag + ' onDraw 는 어명만'); }
    // plus
    if (c.plus === null || typeof c.plus !== 'object' || Array.isArray(c.plus)) err(tag + ' plus 는 객체');
    else {
      Object.keys(c.plus).forEach(function(key){ if (PLUS_KEYS.indexOf(key) < 0) err(tag + ' plus 모르는 필드 ' + key); });
      if (c.plus.ops !== undefined) { checkOps(c.plus.ops, tag + ' plus.ops', true); if (sameJson(c.plus.ops, c.ops)) err(tag + ' plus.ops 가 기본판과 같음'); if (hasPierce(c.plus.ops) !== pierce) err(tag + ' plus 관통 여부 다름'); if (hasDmg(c.plus.ops) !== atk) err(tag + ' plus 공격 여부 다름'); }
      if (c.plus.onDraw !== undefined) checkOps(c.plus.onDraw, tag + ' plus.onDraw', false);
      if (c.plus.cost !== undefined && (c.plus.cost < 0 || c.plus.cost > 3 || c.plus.cost === c.cost)) err(tag + ' plus.cost');
      if (c.plus.exhaust !== undefined && c.plus.exhaust !== false) err(tag + ' plus.exhaust 는 false 만');
      if (c.plus.exhaust === false && c.exhaust !== true) err(tag + ' plus.exhaust:false 인데 기본판이 소모가 아님');
      if (c.plus.ops !== undefined && c.plus.desc === undefined) err(tag + ' plus.ops 가 있으면 plus.desc 도');
      var noUp = ['chen_lin_bombard', 'deng_zilong', 'ming_navy_square', 'edict_advance', 'edict_blame', 'edict_arrest', 'edict_envy', 'dokjeon'];
      if ((Object.keys(c.plus).length === 0) !== (noUp.indexOf(c.id) >= 0)) err(tag + ' 강화판 유무가 DESIGN 과 다름');
    }
  });
  function checkOps(ops, where, cardOps){
    walkOps(ops, where, cardOps, function(o, p, inCard){
      if (!o || typeof o !== 'object' || Array.isArray(o)) { err(p + ' op 객체 아님'); return; }
      if (typeof o.op !== 'string') { err(p + ' op 이름 없음'); return; }
      var known = OPS_COMMON.indexOf(o.op) >= 0 || OPS_BATTLE.indexOf(o.op) >= 0;
      if (!known) err(p + ' 모르는 op ' + o.op);
      if (OPS_RUN_ONLY.indexOf(o.op) >= 0) err(p + ' 카드에서 쓸 수 없는 op ' + o.op);
      if (o.choose === true && !inCard) err(p + ' choose:true 는 카드 ops 안에서만');
      if (o.op === 'cond') { if (!o.if || typeof o.if !== 'object') err(p + ' cond.if 없음'); else Object.keys(o.if).forEach(function(k){ if (COND_KEYS.indexOf(k) < 0) err(p + ' 모르는 cond 키 ' + k); }); if (!Array.isArray(o.then)) err(p + ' cond.then 배열 아님'); }
      if (o.op === 'dmg') { if (typeof o.n !== 'number') err(p + ' dmg.n'); if (MULT_TAGS.indexOf(o.tag) < 0) err(p + ' dmg.tag ' + o.tag); if (o.times !== undefined && !(o.times >= 1)) err(p + ' dmg.times'); }
      if (o.op === 'status') { if (STATUS_IDS.indexOf(o.id) < 0) err(p + ' status id ' + o.id); if (['self', 'target', 'all'].indexOf(o.who) < 0) err(p + ' status who ' + o.who); if (typeof o.n !== 'number') err(p + ' status.n'); }
      if (o.op === 'buff') { if (BUFF_IDS.indexOf(o.id) < 0) err(p + ' buff id ' + o.id); }
      if (o.op === 'block' && typeof o.n !== 'number') err(p + ' block.n');
      if ((o.op === 'push' || o.op === 'pull') && !(o.n >= 1 && o.n <= 2)) err(p + ' push/pull n 은 1~2');
      if (o.op === 'addCard') { if (o.id && !byId[o.id]) err(p + ' addCard 없는 id ' + o.id); if (o.pool && POOLS.indexOf(o.pool) < 0) err(p + ' addCard pool'); if (!o.id && !o.pool) err(p + ' addCard id/pool 없음'); }
      if (o.op === 'leave' && OWNERS.indexOf(o.id) < 0) err(p + ' leave id ' + o.id);
      if (o.op === 'retrieve' && (o.from !== 'discard' || o.choose !== true)) err(p + ' retrieve 형식');
      if (o.op === 'mark' && typeof o.set !== 'boolean') err(p + ' mark.set');
      if (o.op === 'delay' && !Array.isArray(o.ops)) err(p + ' delay.ops');
      if (o.op === 'exhaustHand' && !Array.isArray(o.perCard)) err(p + ' exhaustHand.perCard');
      Object.keys(o).forEach(function(k){ var v = o[k]; if (v === undefined || typeof v === 'function') err(p + ' 필드 ' + k + ' 가 undefined/함수'); });
    });
  }
  // 풀별 장수 (DESIGN §9: 기본 7·공용 20·수군 12·의병 11+토큰 1·책략 11·수성 8·명군 6·명 수군 토큰 3·주장 8·부장 6·어명 4·사건 2)
  var want = {base:7, common:20, navy:12, uibyeong:11, token:4, tactic:11, siege:8, ming:6, leader:8, deputy:6, edict:4, event:2};
  Object.keys(want).forEach(function(p){ var n = pool(p).length; if (n !== want[p]) err('풀 ' + p + ' 장수 ' + n + ' ≠ ' + want[p]); });
  // 시작 덱
  ['yi', 'gwon'].forEach(function(l){
    var d = startDeck(l);
    if (d.length !== 12) err('시작 덱 ' + l + ' ' + d.length + '장');
    d.forEach(function(id){ if (!byId[id]) err('시작 덱 ' + l + ' 없는 id ' + id); });
    var pushes = 0; d.forEach(function(id){ var c = byId[id]; if (c) walkOps(c.ops, '', true, function(o){ if (o && o.op === 'push') pushes++; }); });
    if (pushes !== 4) err('시작 덱 ' + l + ' 밀어내기 카드 ' + pushes + '장 (4 아님)');
  });
  // JSON 왕복
  try { if (!sameJson(JSON.parse(JSON.stringify(list)), list)) err('JSON 왕복 불일치'); } catch (e) { err('JSON 왕복 예외 ' + e.message); }
  // get / 참조
  try { get('__none__'); err('get 이 없는 id 에 throw 하지 않음'); } catch (e) { if (!/없는 id/.test(e.message)) err('get 오류 문구 ' + e.message); }
  if (pool('navy').length && pool('navy').some(function(c){ return c.tags.indexOf('navy') < 0; })) err('navy 풀 태그 누락');
  return { ok: errors.length === 0, errors: errors };
}

return { list: list, byId: byId, get: get, startDeck: startDeck, pool: pool, selfTest: selfTest };
})();

  var list = [

  /* ================================================================
   * 4. 색인·조회
   * ================================================================ */
  function index(arr, label) {
    var by = {};
    for (var i = 0; i < arr.length; i++) { by[arr[i].id] = arr[i]; }
    return { list: arr, byId: by, get: function (id) { if (!by[id]) { throw new Error(label + ': 없는 id ' + id); } return by[id]; } };
  }
  var tplIdx = index(list, 'ENEMIES');

   * 5. 막 배율·인스턴스
   * ================================================================ */
  // tags 에 'boss' 가 있으면 hp 고정. 그 밖은 floor(hp × (1 + hpPer × (act−1))) — 정수 연산으로 부동소수 오차를 없앤다.
  function scale(tpl, act) {
    var S = B.ACT_SCALE;
    var a = Math.max(1, Math.floor(Number(act) || 1));
    var per100 = Math.round(S.hpPer * 100);
    var isBoss = has(tpl.tags, 'boss');
    var hp = isBoss ? tpl.hp : Math.floor(tpl.hp * (100 + per100 * (a - 1)) / 100);
    var dmgAdd = S.dmgAdd[Math.min(a, S.dmgAdd.length) - 1];
    return { hp: hp, dmgAdd: dmgAdd };
  }

  // enemyInst — 모든 키를 지금 채운다. uid 는 Combat 이 Core.nextUid 로 준다.
  function makeInst(id, act, overrides) {
    var tpl = tplIdx.get(id);
    var ov = overrides || {};
    var base = (ov.hp != null) ? Object.assign({}, tpl, { hp: ov.hp }) : tpl;
    var sc = scale(base, act);
    var intents = Core.clone(tpl.intents);
    var off = (ov.offset != null) ? Math.floor(ov.offset) : 0;
    off = ((off % intents.length) + intents.length) % intents.length;
    return {
      uid: null, id: id, name: ov.name || tpl.name, hp: sc.hp, maxHp: sc.hp, block: 0, status: {},
      intents: intents, intentIdx: off, advance: tpl.advance, step: tpl.step, tags: tpl.tags.slice(),
      resist: tpl.resist || 0, passive: tpl.passive ? Core.clone(tpl.passive) : null, boss: has(tpl.tags, 'boss'),
      dmgAdd: sc.dmgAdd, buildCount: 0, dead: false, fled: false, wave: (ov.wave != null) ? ov.wave : 1
    };
  }

  function normWave(w, i) {
    return {
      enemies: Core.clone(w.enemies), intro: w.intro || null,
      resetDist: (w.resetDist != null) ? w.resetDist : null, extraDraw: w.extraDraw || 0,
      trigger: w.trigger || 'allDead', keepOthers: !!w.keepOthers,
      mods: w.mods ? Core.clone(w.mods) : null,
      reinforce: w.reinforce ? normReinforce(w.reinforce) : null,
      onStart: w.onStart ? Core.clone(w.onStart) : [], idx: i
    };
  }
  function normReinforce(r) {
    return { every: r.every, enemies: r.enemies.slice(), cap: r.cap, startTurn: (r.startTurn != null) ? r.startTurn : null };
  }

  // 편성 → 전투 요청 조각. 깊은 복사. rng 는 지금 쓰지 않는다(시그니처 고정).
  // overrides: { enemies?:[spec], mods?:{}, hp?:{id:n}, names?:{id:name} }
  function build(encId, act, rng, overrides) {
    var enc = encIdx.get(encId);
    var ov = overrides || {};
    var waves = enc.waves ? enc.waves.map(normWave) : null;
    var spec = ov.enemies ? ov.enemies : (waves ? waves[0].enemies : enc.enemies);
    var insts = [];
    for (var i = 0; i < spec.length; i++) {
      var s = spec[i];
      var o = { offset: s.offset || 0, name: s.name || null, hp: (s.hp != null) ? s.hp : null, wave: 1 };
      if (ov.hp && ov.hp[s.id] != null) { o.hp = ov.hp[s.id]; }
      if (ov.names && ov.names[s.id]) { o.name = ov.names[s.id]; }
      insts.push(makeInst(s.id, act, o));
    }
    var mods = enc.mods ? Core.clone(enc.mods) : {};
    if (ov.mods) { Object.assign(mods, Core.clone(ov.mods)); }
    return {
      id: enc.id, name: enc.name, type: enc.type, elite: !!enc.elite, boss: !!enc.boss,
      enemies: insts, waves: waves,
      reinforce: enc.reinforce ? normReinforce(enc.reinforce) : null,
      handlers: enc.handlers ? Core.clone(enc.handlers) : [],
      mods: mods,
      reward: enc.reward ? Core.clone(enc.reward) : null,
      intro: enc.intro ? Core.clone(enc.intro) : null

  }

  function selfTest() {

    // 적 틀

      if (!/^[a-z0-9_]+$/.test(t.id)) { err('적 id 규칙 위반: ' + t.id); }
      if (!t.name || !(t.hp > 0) || !has(ADV, t.advance) || !(t.step === 1 || t.step === 2)) { err('적 필수 필드: ' + t.id); }
      if (!Array.isArray(t.tags) || !Array.isArray(t.intents) || !t.intents.length) { err('적 tags/intents: ' + t.id); continue; }
      for (j = 0; j < t.intents.length; j++) {
        var it = t.intents[j];
        if (!it || !has(KINDS, it.kind)) { err('의도 kind: ' + t.id + '[' + j + '] ' + (it && it.kind)); continue; }
        if (it.kind === 'atk' && (!(it.n >= 0) || !has(ATK_TAGS, it.tag))) { err('atk 의도 n/tag: ' + t.id + '[' + j + ']'); }
        if (it.kind === 'atk' && it.alt && (!it.alt.if || !(it.alt.n >= 0) || !has(ATK_TAGS, it.alt.tag))) { err('alt 의도: ' + t.id + '[' + j + ']'); }
        if (has(['pull', 'block', 'rally', 'raid', 'incite'], it.kind) && !(it.n > 0)) { err('의도 n: ' + t.id + '[' + j + ']'); }
        if (it.kind === 'reinforce' && (!tplIdx.byId[it.id] || !(it.n > 0) || !(it.cap > 0))) { err('reinforce 의도 id/n/cap: ' + t.id + '[' + j + ']'); }
        if (it.kind === 'ops' && !Array.isArray(it.ops)) { err('ops 의도 ops 배열: ' + t.id + '[' + j + ']'); }
        if (typeof it.text !== 'string' || !it.text) { err('의도 text: ' + t.id + '[' + j + ']'); }
      }
      if (t.passive && typeof t.passive.shotPctAtFar !== 'number') { err('passive 키: ' + t.id); }
    }

    if (list.length !== tplCount) { err('적 틀 수 ' + list.length + ' ≠ ' + tplCount); }

    // 편성
    seen = {};
    function checkSpec(spec, where) {
      if (!Array.isArray(spec)) { err('enemies 배열 아님: ' + where); return; }
      if (spec.length > B.ENEMY_MAX) { err('동시 적 수 초과: ' + where); }
      for (var q = 0; q < spec.length; q++) {
        var s = spec[q], tp = tplIdx.byId[s.id];
        if (!tp) { err('편성의 적 id 없음: ' + where + ' ' + s.id); continue; }
        if (s.offset != null && (s.offset < 0 || s.offset >= tp.intents.length)) { err('offset 범위: ' + where + ' ' + s.id); }
        if (s.hp != null && !(s.hp > 0)) { err('hp 덮어쓰기 값: ' + where + ' ' + s.id); }
      }
    }
    function checkReinforce(r, where) {
      if (!(r.every > 0) || !(r.cap > 0) || !Array.isArray(r.enemies) || !r.enemies.length) { err('reinforce every/cap/enemies: ' + where); return; }
      for (var q = 0; q < r.enemies.length; q++) { if (!tplIdx.byId[r.enemies[q]]) { err('reinforce 적 id 없음: ' + where + ' ' + r.enemies[q]); } }
    }
    for (i = 0; i < encounters.length; i++) {
      enc = encounters[i];
      if (!enc.id || seen[enc.id]) { err('편성 id 중복/없음: ' + enc.id); } seen[enc.id] = true;
      if (!/^[a-z0-9_]+$/.test(enc.id)) { err('편성 id 규칙 위반: ' + enc.id); }
      if (!enc.name || !has(TYPES, enc.type)) { err('편성 name/type: ' + enc.id); }
      if (enc.waves) {
        if (enc.enemies.length) { err('waves 있는 편성은 enemies 를 비운다: ' + enc.id); }
        if (!Array.isArray(enc.waves) || !enc.waves.length) { err('waves 비어 있음: ' + enc.id); }
        for (j = 0; j < (enc.waves || []).length; j++) {
          w = enc.waves[j];
          checkSpec(w.enemies, enc.id + '.waves[' + j + ']');
          if (w.trigger && w.trigger !== 'allDead') {
            if (!w.trigger.enemyDead) { err('wave trigger 모양: ' + enc.id + '[' + j + ']'); }
            else {
              var found = false;
              for (k = 0; k < w.enemies.length; k++) { if (w.enemies[k].id === w.trigger.enemyDead) { found = true; } }
              if (!found) { err('wave trigger.enemyDead 가 그 파도에 없음: ' + enc.id + '[' + j + ']'); }
            }
          }
          if (w.resetDist != null && !(w.resetDist >= 0 && w.resetDist <= 2)) { err('wave resetDist: ' + enc.id + '[' + j + ']'); }
          if (w.reinforce) { checkReinforce(w.reinforce, enc.id + '.waves[' + j + ']'); }
          if (w.onStart && !Array.isArray(w.onStart)) { err('wave onStart 배열: ' + enc.id + '[' + j + ']'); }
        }
      } else {
        checkSpec(enc.enemies, enc.id);
        if (!enc.enemies.length) { err('편성에 적이 없음: ' + enc.id); }
      }
      if (enc.reinforce) { checkReinforce(enc.reinforce, enc.id); }
      if (enc.handlers) {
        for (j = 0; j < enc.handlers.length; j++) {
          if (!enc.handlers[j].hook || !Array.isArray(enc.handlers[j].ops)) { err('handler hook/ops: ' + enc.id + '[' + j + ']'); }
        }
      }
      if (enc.boss && enc.reward === undefined) { err('결전 reward 키 없음: ' + enc.id); }
      if (enc.boss && !enc.intro) { err('결전 intro 없음: ' + enc.id); }
      if (enc.mods && enc.mods.startHand) {
        for (j = 0; j < enc.mods.startHand.length; j++) { if (!enc.mods.startHand[j].id) { err('startHand id: ' + enc.id); } }

      if (!Array.isArray(p.normal) || !Array.isArray(p.elite)) { err('풀 모양: ' + pk); continue; }

      for (j = 0; j < p.normal.length; j++) { if (encIdx.byId[p.normal[j]] && encIdx.byId[p.normal[j]].elite) { err('풀 일반이 elite: ' + pk + ' ' + p.normal[j]); } }

    // 계약서 §3.3 ID 전부 존재

      'konishi', 'wakizaka', 'hosokawa', 'ukita_w1', 'ukita_w2', 'ukita_w3', 'kuroda', 'todo', 'kurushima', 'shimazu_p1', 'shimazu_p2'];
    for (i = 0; i < mustEnemies.length; i++) { if (!tplIdx.byId[mustEnemies[i]]) { err('계약 적 id 없음: ' + mustEnemies[i]); } }
    var mustEnc = ['boss_konishi', 'boss_wakizaka', 'boss_jinju1', 'boss_haengju', 'boss_jiksan', 'boss_myeongnyang', 'boss_noryang',
      'tut_busan', 'tut_gijang', 'tut_sangju', 'dongnae_hold', 'ichi_hold', 'jeongam', 'cheongju_elite', 'geumsan_elite', 'yeonan', 'gyeongju',

    for (i = 0; i < mustEnc.length; i++) { if (!encIdx.byId[mustEnc[i]]) { err('계약 편성 id 없음: ' + mustEnc[i]); } }

    // 배율·인스턴스·build 왕복
    try {
      var sc = scale(tplIdx.get('ashigaru_spear'), 3);
      var want3 = Math.floor(16 * (100 + Math.round(B.ACT_SCALE.hpPer * 100) * 2) / 100);
      if (sc.hp !== want3 || sc.dmgAdd !== B.ACT_SCALE.dmgAdd[2]) { err('scale(창 아시가루, 3막) 기대 {' + want3 + '} 실제 ' + JSON.stringify(sc)); }
      if (scale(tplIdx.get('konishi'), 7).hp !== tplIdx.get('konishi').hp) { err('보스 체력이 고정이 아님'); }
      var want7 = Math.floor(40 * (100 + Math.round(B.ACT_SCALE.hpPer * 100) * 6) / 100);
      if (scale(tplIdx.get('wa_captain'), 7).hp !== want7) { err('정예 체력 배율(7막 왜장 ' + want7 + ') 실제 ' + scale(tplIdx.get('wa_captain'), 7).hp); }
      var inst = makeInst('ashigaru_gun', 1, { offset: 1 });
      if (inst.intentIdx !== 1 || inst.hp !== 13 || inst.uid !== null || inst.dmgAdd !== 0) { err('makeInst 기본값'); }
      if (JSON.stringify(JSON.parse(JSON.stringify(inst))) !== JSON.stringify(inst)) { err('inst JSON 왕복'); }
      for (i = 0; i < encounters.length; i++) {
        for (var act = 1; act <= 7; act++) {
          var r = build(encounters[i].id, act, null, null);
          if (JSON.stringify(JSON.parse(JSON.stringify(r))) !== JSON.stringify(r)) { err('build JSON 왕복: ' + encounters[i].id); }
          if (!r.enemies.length) { err('build enemies 비어 있음: ' + encounters[i].id); }
          for (j = 0; j < r.enemies.length; j++) {
            if (r.enemies[j].intents === tplIdx.byId[r.enemies[j].id].intents) { err('intents 가 깊은 복사가 아님: ' + encounters[i].id); }
          }
        }
      }
      var ny = build('boss_noryang', 7, null, null);
      if (!ny.waves || ny.waves.length !== 2 || ny.enemies.length !== 3 || ny.waves[1].mods.pushMax !== 1 || !ny.waves[1].mods.rescueDisabled) { err('노량 파도 모양'); }
      var hj = build('boss_haengju', 3, null, null);
      if (!hj.waves || hj.waves.length !== 3 || hj.waves[2].onStart.length !== 2) { err('행주 파도 모양'); }
      var mn = build('boss_myeongnyang', 6, null, null);
      if (!mn.mods.tide || !mn.reinforce || mn.reinforce.cap !== B.MYEONGNYANG.cap) { err('명량 mods/reinforce'); }
      var jk = build('boss_jiksan', 5, null, { mods: { enemyHpPct: -0.15 } });
      if (jk.mods.startHand.length !== 3 || jk.mods.enemyHpPct !== -0.15) { err('직산 startHand/overrides.mods'); }
      var sn = build('sacheon', 7, null, { names: { wa_captain: '시험' } });
      if (sn.enemies[0].name !== '시험') { err('overrides.names'); }
    } catch (ex) { err('예외: ' + (ex && ex.message)); }

    // JSON 왕복(데이터 전체)
    try {
      var blob = { list: list, encounters: encounters, pools: pools };
      if (JSON.stringify(JSON.parse(JSON.stringify(blob))) !== JSON.stringify(blob)) { err('데이터 JSON 왕복 불일치'); }
    } catch (ex2) { err('데이터 직렬화 예외: ' + (ex2 && ex2.message)); }

    return { ok: errors.length === 0, errors: errors };
  }

  return {
    list: tplIdx.list, byId: tplIdx.byId, get: tplIdx.get,
    encounters: encIdx,
    pools: pools,
    KINDS: KINDS,
    scale: scale, makeInst: makeInst, build: build,
    selfTest: selfTest
  };
})();

    { id:'myeongnyang_chain', name:'명량의 쇠사슬', hanja:'鳴梁', src:'boss',
      handlers:[ { hook:'onEnemySpawn', cond:{ naval:true, enemyId:[ 'sekibune', 'kobaya' ] }, ops:[ { op:'status', who:'spawned', id:'shaken', n:1 } ] } ],
      desc:'해전에서 왜군 중선·소선이 나타나면 그 배에 동요 1.',
      memo:'명량 1597.9.16. 울돌목에 쇠사슬을 걸었다는 이야기가 전해 온다.' },
    { id:'tongjeyeong_flag', name:'통제영의 깃발', hanja:'統制營', src:'event',
      mods:[ { mod:'dmgBonus', n:1, if:{ cardTag:'navy' } } ],
      desc:'수군 카드 피해 +1.',
      memo:'5막 부산 앞바다. 수군이 아직 바다에 있다는 표시.' }
  ];

  /* ------------------------------------------------------------ 정규화·색인 */
  function fillRelic(r) {
    return { id:r.id, name:r.name, hanja:r.hanja || null, src:r.src,
      handlers:r.handlers || [], upHandlers:r.upHandlers || null, mods:r.mods || [],
      onAcquire:r.onAcquire || null, runMods:r.runMods || null, curse:!!r.curse,
      desc:r.desc, memo:r.memo };
  }
  function index(list) {
    var byId = {};
    for (var i = 0; i < list.length; i++) byId[list[i].id] = list[i];
    return { list:list, byId:byId, get:function(id){
      if (!Object.prototype.hasOwnProperty.call(byId, id)) throw new Error('GENERALS: 없는 id ' + id);
      return byId[id];
    } };
  }
  var leaders = index(LEADERS);
  var deputies = index(DEPUTIES);
  var relics = index(RELICS.map(fillRelic));

  /* ------------------------------------------------------------ 자가 검사 */
  var HOOKS = ['onBattleStart','onTurnStart','onTurnEnd','onCardPlayed','onCardDrawn','onDamageDealt','onDamageTaken',
    'onDistanceChange','onEnemyDeath','onEnemySpawn','onWaveStart','onHpZero','onBattleEnd','onActStart','onAcquire'];
  var MODS = ['dmgBonus','atkPct','costDelta','blockKeep'];
  var OPS_COMMON = ['suspicion','ration','hp','addCard','removeCard','upgrade','relic','flag','leave','cond','fx','score'];
  var OPS_BATTLE = ['dmg','block','push','pull','draw','energy','status','stun','buff','exhaustHand','discard','exhaust','retrieve','mark','delay','stripBlock'];
  var OPS_RUN = ['battle','recruit','ending','offer'];
  var RUN_ONLY_IN_COMMON = ['upgrade','relic','score'];   // 공통 표에 있으나 전투에서는 throw
  var COND_KEYS = ['dist','distNot','hpPct','naval','siege','assault','field','turn','turnLte','hasWall','tide','wave',
    'cardTag','cardType','cardPool','cardId','cardMarked','enemyId','enemyTag','handCount','cardsPlayedThisTurn','deckTagCount',
    'hasCard','hasRelic','hasDeputy','noDeputy','flag','leader','lane','act','actGte','ration','suspicion','slotsFree','oncePerBattle','oncePerTurn'];
  var STATUS_IDS = ['shaken','exposed','hunger','momentum','ambush','ironwall','stun','flinch','loaded'];
  var BUFF_IDS = ['nextAtk','atkAdd','shotAdd','atkPct','shotPct','evadeFirst','hide','noAtk','noMelee','noPushBattle','wallPersist','chargeAtClose','noAdvance','passivesOff','minHp1'];
  var WHO = ['self','target','all','spawned','actor','enemy'];
  var ENEMY_IDS = ['ashigaru_spear','ashigaru_gun','wa_archer','mounted_samurai','samurai','wa_captain','siege_laborer','bamboo_bundle','nobushi',
    'sekibune','kobaya','atakebune','enemy_flagship','wajo_garrison','rebel_monghak','wa_scout',
    'konishi','wakizaka','hosokawa','ukita_w1','ukita_w2','ukita_w3','kuroda','todo','kurushima','shimazu_p1','shimazu_p2'];
  // 계약 §3.2 카드 ID 99 (CARDS 가 로드되어 있으면 CARDS.byId 를 우선 쓰고 이 목록과도 대조한다)
  var CARD_IDS = ('bowstring spear_wall retreat_horn war_drum report hwando throw_stone pyeonjeon seungja hide shield_wall iron_wall pike_square volley scout regroup ' +
    'cavalry_charge arrow_rain archer_ambush samsu whip resolve ash_bag cannon_volley jincheonroe discipline pajin cheonja crane_wing turtle_ship retreat_fire ' +
    'panok_turn daejanggun lure fire_arrow rowers twelve_ships flagship rolling_fire manifesto militia red_robe uiryeong_rising jeongam_ambush geumsan_drum ' +
    'monk_soldiers mountain_raid people_stones monk_rally bamboo_spear ambush_fire scorched_earth counter_spy parley nanjung_diary scarecrow scout_boat memorial ' +
    'beacon castle_well desperate_call baesujin mountain_fort hwacha hyeonja repair_parapet ongseong counter_mound gate_sally boiling_water pyongyang_bombard ' +
    'nambyeong_cannon li_cavalry folangji langseon request_troops chen_lin_bombard deng_zilong ming_navy_square pilsa_jeuksaeng not_one_ship sinsang_pilbeol ' +
    'danghangpo_lure hwacha_volley sema die_standing level_ground jeolla_right wall_rally bukgwan_cavalry seven_hundred ichi_bow yeonan_fort edict_advance ' +
    'edict_blame edict_arrest edict_envy jochong dokjeon').split(' ');

  function has(arr, v) { return arr.indexOf(v) >= 0; }
  function isStr(s) { return typeof s === 'string' && s.length > 0; }
  function isNum(n) { return typeof n === 'number' && isFinite(n); }

  function selfTest() {
    var errors = [];
    var cardOk = function(id) {
      if (typeof CARDS !== 'undefined' && CARDS && CARDS.byId) return Object.prototype.hasOwnProperty.call(CARDS.byId, id) && has(CARD_IDS, id);
      return has(CARD_IDS, id);
    };
    var enemyOk = function(id) {
      if (typeof ENEMIES !== 'undefined' && ENEMIES && ENEMIES.byId) return Object.prototype.hasOwnProperty.call(ENEMIES.byId, id);
      return has(ENEMY_IDS, id);
    };
    function err(where, msg) { errors.push(where + ': ' + msg); }
    function checkCond(where, c) {
      if (c === null || c === undefined) return;
      if (typeof c !== 'object' || Array.isArray(c)) { err(where, 'cond 가 객체가 아님'); return; }
      Object.keys(c).forEach(function(k){
        if (!has(COND_KEYS, k)) err(where, '모르는 cond 키 ' + k);
        if (k === 'enemyId') [].concat(c[k]).forEach(function(e){ if (!enemyOk(e)) err(where, '없는 적 id ' + e); });
        if (k === 'hasCard' || k === 'cardId') [].concat(c[k]).forEach(function(e){ if (!cardOk(e)) err(where, '없는 카드 id ' + e); });
      });
    }
    function checkOps(where, ops, ctxKind) {   // ctxKind: 'battle' | 'run'
      if (!Array.isArray(ops)) { err(where, 'ops 가 배열이 아님'); return; }
      ops.forEach(function(o, i){
        var w = where + '.ops[' + i + ']';
        if (!o || typeof o !== 'object' || !isStr(o.op)) { err(w, 'op 객체 아님'); return; }
        var known = has(OPS_COMMON, o.op) || has(OPS_BATTLE, o.op) || has(OPS_RUN, o.op);
        if (!known) err(w, '모르는 op ' + o.op);
        if (ctxKind === 'battle' && (has(OPS_RUN, o.op) || has(RUN_ONLY_IN_COMMON, o.op))) err(w, '전투 맥락에 판 전용 op ' + o.op);
        if (ctxKind === 'run' && has(OPS_BATTLE, o.op)) err(w, '판 맥락에 전투 전용 op ' + o.op);
        if (o.choose === true) err(w, '훅 ops 안의 choose:true 는 금지');
        if (o.op === 'status' && !has(STATUS_IDS, o.id)) err(w, '모르는 status id ' + o.id);
        if (o.op === 'status' && o.who !== undefined && !has(WHO, o.who)) err(w, '모르는 who ' + o.who);
        if (o.op === 'buff' && !has(BUFF_IDS, o.id)) err(w, '모르는 buff id ' + o.id);
        if (o.op === 'addCard' && o.id !== undefined && !cardOk(o.id)) err(w, '없는 카드 id ' + o.id);
        if (o.op === 'dmg' && !isStr(o.tag)) err(w, 'dmg 에 tag 없음');
        if (o.op === 'cond') { checkCond(w + '.if', o.if); checkOps(w + '.then', o.then, ctxKind); if (o.else) checkOps(w + '.else', o.else, ctxKind); }
        if (o.op === 'delay' || o.op === 'exhaustHand') checkOps(w + '.inner', o.ops || o.perCard, ctxKind);
      });
    }
    function checkHandlers(where, hs) {
      if (!Array.isArray(hs)) { err(where, 'handlers 가 배열이 아님'); return; }
      hs.forEach(function(h, i){
        var w = where + '.handlers[' + i + ']';
        if (!has(HOOKS, h.hook)) err(w, '모르는 훅 ' + h.hook);
        if (h.src !== undefined) err(w, 'src 는 Combat 이 붙인다');
        checkCond(w + '.cond', h.cond);
        checkOps(w, h.ops, 'battle');
      });
    }
    function checkMods(where, ms) {
      if (!Array.isArray(ms)) { err(where, 'mods 가 배열이 아님'); return; }
      ms.forEach(function(m, i){
        var w = where + '.mods[' + i + ']';
        if (!has(MODS, m.mod)) err(w, '모르는 mod ' + m.mod);
        if (!isNum(m.n)) err(w, 'n 이 숫자가 아님');
        if (m.once !== undefined && m.once !== 'battle' && m.once !== 'turn') err(w, 'once 값 이상 ' + m.once);
        checkCond(w + '.if', m.if);
      });
    }
    function checkIds(where, list, n) {
      if (list.length !== n) err(where, '개수 ' + list.length + ' (기대 ' + n + ')');
      var seen = {};
      list.forEach(function(o){
        if (!isStr(o.id) || !/^[a-z][a-z0-9_]*$/.test(o.id)) err(where, '잘못된 id ' + o.id);
        if (seen[o.id]) err(where, '중복 id ' + o.id); seen[o.id] = true;
        ['name','desc','memo'].forEach(function(k){ if (!isStr(o[k])) err(where + '.' + o.id, k + ' 비어 있음'); });
      });
    }
    // 주장
    checkIds('leaders', LEADERS, 2);
    LEADERS.forEach(function(L){
      var w = 'leaders.' + L.id;
      if (L.id !== 'yi' && L.id !== 'gwon') err(w, '주장 id 는 yi|gwon');
      if (!isNum(L.hp) || L.hp <= 0) err(w, 'hp 이상');
      if (!isNum(L.suspStart)) err(w, 'suspStart 이상');
      if (typeof L.famed !== 'boolean') err(w, 'famed 는 bool');
      if (!isStr(L.hanja) || !isStr(L.passiveDesc) || !isStr(L.deckColor)) err(w, 'hanja/passiveDesc/deckColor 비어 있음');
      if (!Array.isArray(L.cards) || L.cards.length !== 4) err(w, '고유 카드는 4장');
      else L.cards.forEach(function(c){ if (!cardOk(c)) err(w, '없는 카드 id ' + c); });
      checkHandlers(w + '.passive', L.passive.handlers); checkMods(w + '.passive', L.passive.mods);
    });
    // 부장
    checkIds('deputies', DEPUTIES, 8);
    var DEP_IDS = ['gwon','yi','yi_eokgi','kim_simin','jeong_munbu','jo_heon','hwang_jin','yi_jeongam'];
    DEP_IDS.forEach(function(id){ if (!deputies.byId[id]) err('deputies', '부장 ' + id + ' 없음'); });
    DEPUTIES.forEach(function(D){
      var w = 'deputies.' + D.id;
      if (!isStr(D.hanja) || !isStr(D.passiveDesc) || !isStr(D.recruit)) err(w, 'hanja/passiveDesc/recruit 비어 있음');
      if (typeof D.famed !== 'boolean') err(w, 'famed 는 bool');
      if (!cardOk(D.card)) err(w, '없는 고유 카드 ' + D.card);
      else if (typeof CARDS !== 'undefined' && CARDS && CARDS.byId && CARDS.byId[D.card] && CARDS.byId[D.card].owner !== undefined && CARDS.byId[D.card].owner !== null
               && CARDS.byId[D.card].owner !== D.id) err(w, '고유 카드 owner 불일치 ' + CARDS.byId[D.card].owner);
      checkHandlers(w + '.passive', D.passive.handlers); checkMods(w + '.passive', D.passive.mods);
    });
    // 기물
    var RELIC_IDS = ['turtle_blueprint','jincheonroe_relic','hwacha_relic','nanjung_relic','jingbirok','tonga','hangwae_gun','obangnang','seoae_brush',
      'chains','joryeong_stone','hansan_drum','jinju_drum','haengju_ash','jiksan_spear','myeongnyang_chain','tongjeyeong_flag'];
    checkIds('relics', relics.list, 17);
    RELIC_IDS.forEach(function(id){ if (!relics.byId[id]) err('relics', '기물 ' + id + ' 없음'); });
    relics.list.forEach(function(R){
      var w = 'relics.' + R.id;
      if (!has(['elite','boss','shop','event'], R.src)) err(w, 'src 이상 ' + R.src);
      checkHandlers(w, R.handlers); checkMods(w, R.mods);
      if (R.upHandlers !== null) checkHandlers(w + '.up', R.upHandlers);
      if (R.onAcquire !== null) checkOps(w + '.onAcquire', R.onAcquire, 'run');
      if (R.runMods !== null) {
        Object.keys(R.runMods).forEach(function(k){ if (!has(['shopDiscount','eventRationBonus','actStartOps'], k)) err(w, '모르는 runMods 키 ' + k); });
        if (R.runMods.actStartOps) checkOps(w + '.runMods.actStartOps', R.runMods.actStartOps, 'run');
      }
      var active = R.handlers.length + R.mods.length + (R.onAcquire ? 1 : 0) + (R.runMods ? 1 : 0);
      if (active === 0) err(w, '효과가 하나도 없음');
    });
    if (relics.byId.hansan_drum && (!relics.byId.hansan_drum.upHandlers || relics.byId.hansan_drum.upHandlers[0].ops[0].n !== 2)) err('relics.hansan_drum', '강화판 push 2 아님');
    if (relics.byId.jinju_drum && (!relics.byId.jinju_drum.upHandlers || relics.byId.jinju_drum.upHandlers[0].ops[0].n !== 2)) err('relics.jinju_drum', '강화판 동요 2 아님');
    // get() 예외·JSON 왕복
    try { relics.get('no_such_relic'); err('relics.get', '없는 id 에 throw 하지 않음'); } catch (e) { /* 기대 */ }
    function walk(where, v) {   // undefined·함수 값 금지(계약 §0.3)
      if (v === undefined || typeof v === 'function') { err(where, 'undefined 또는 함수 값'); return; }
      if (v && typeof v === 'object') Object.keys(v).forEach(function(k){ walk(where + '.' + k, v[k]); });
    }
    [['leaders', leaders.list], ['deputies', deputies.list], ['relics', relics.list]].forEach(function(p){
      walk(p[0], p[1]);
      var s = JSON.stringify(p[1]);
      if (JSON.stringify(JSON.parse(s)) !== s) err(p[0], 'JSON 왕복 불일치');
    });
    return { ok: errors.length === 0, errors: errors };
  }

  return { leaders:leaders, deputies:deputies, relics:relics, selfTest:selfTest };
})();

      { text:'조령으로 간다 (김여물)', preview:'결전 지형 고개: 원거리에서 시작, 적이 한동안 오르지 못하고 턴마다 진형을 얻는다. 이기면 기물 ‘조령의 돌’', ops:[{op:'flag', key:'b1', value:'ridge'}] },
      { text:'탄금대에 선다 (신립)', preview:'결전 지형 강: 밀어내기 무효, 기세를 얻고 돌격이 싸진다. ‘배수진’ 카드. 이기면 군량 +20', ops:[{op:'flag', key:'b1', value:'river'}, {op:'addCard', id:'baesujin'}] },
      { text:'충주성에 든다', preview:'결전이 수성(아군 성벽)으로. 이기면 군량 −20', ops:[{op:'flag', key:'b1', value:'fort'}] }
    ],
    memo:'탄금대 1592.4.28 전날. 김여물은 조령을 막자 했고, 신립은 강을 등지고 싸웠다.' },

  { id:'E4', key:'king_leaves', act:1, title:'임금이 도성을 떠나다',
    text:[
      '4월 그믐 밤, 비가 내렸다. 임금의 가마가 서쪽 문을 나서 북으로 향했다. 궁궐 뒤에서 불길이 올랐다.',
      '닷새 뒤 왜군이 한성에 들어왔다. 길에는 버려진 짐과 흩어진 문서뿐이었다.',
      '그대의 군사는 어디로 갈 것인가. 임금을 따라 북으로 갈지, 남아 싸울지, 불을 끌지.'
    ],
    choices:[
      { text:'임금을 따라간다', preview:'의심 −2, 병력 −6', ops:[{op:'suspicion', n:-2}, {op:'hp', n:-6}] },
      { text:'도성에 남아 싸운다', preview:'기물 ‘징비록’, 의심 +1', ops:[{op:'relic', id:'jingbirok'}, {op:'suspicion', n:1}] },
      { text:'경복궁의 불을 끈다', preview:'군량 +25', ops:[{op:'ration', n:25}] }
    ],
    memo:'선조가 도성을 떠난 날 1592.4.30, 한성 함락 5.3.' },

  { id:'E5', key:'turtle_launch', act:2, title:'거북선 진수',
    text:[
      '사천 앞바다. 나대용이 만든 배가 처음으로 돛을 올렸다. 등에는 쇠못이 꽂혔고 머리에서는 연기가 났다.',
      '“적이 올라타지 못하고, 우리는 사방으로 쏜다.” 노꾼들이 노를 저어 왜선 사이로 들어갔다.',
      '이 배를 어찌 쓸 것인가. 한 척을 끌고 다닐지, 설계도를 간직할지, 아니면 판옥선 두 척을 더 지을지.'
    ],
    variants:[
      { if:{leader:'gwon', noDeputy:'yi'}, patch:{
        text:[
          '사천 앞바다. 나대용이 만든 배가 처음으로 돛을 올렸다. 등에는 쇠못이 꽂혔고 머리에서는 연기가 났다.',
          '뱃머리에는 전라좌수사 이순신이 서 있었다. “적이 올라타지 못하고, 우리는 사방으로 쏜다.”',
          '이 배를 어찌 쓸 것인가. 좌수사를 진중에 맞아들일 수도 있다.'
        ],
        choices:[
          { text:'거북선을 받고 좌수사를 청한다', preview:'‘거북선’ 카드. 이순신을 부장으로 영입(원하면)', ops:[{op:'addCard', id:'turtle_ship'}, {op:'recruit', id:'yi', optional:true}] },
          { text:'설계도를 간직한다', preview:'기물 ‘거북선 설계도’(해전 시작 시 손에 ‘거북선’)', ops:[{op:'relic', id:'turtle_blueprint'}] },
          { text:'판옥선 두 척', preview:'최대 병력 +8, 병력 +8', ops:[{op:'hp', n:8, max:8}] }
        ] } }
    ],
    choices:[
      { text:'거북선을 받는다', preview:'‘거북선’ 카드', ops:[{op:'addCard', id:'turtle_ship'}] },
      { text:'설계도를 간직한다', preview:'기물 ‘거북선 설계도’(해전 시작 시 손에 ‘거북선’)', ops:[{op:'relic', id:'turtle_blueprint'}] },
      { text:'판옥선 두 척', preview:'최대 병력 +8, 병력 +8', ops:[{op:'hp', n:8, max:8}] }
    ],
    memo:'사천 1592.5.29, 거북선 첫 출전. 나대용이 만들었다.' },  // 변형: 권율이 주장이고 이순신이 없으면 ①에서 영입

  { id:'E6', key:'red_general', act:2, title:'홍의장군',
    text:[
      '의령. 붉은 옷을 입은 사내가 제 집 재산을 풀어 사람을 모았다. 곽재우였다.',
      '“관군은 흩어졌고 수령은 달아났다. 이 땅은 우리가 지킨다.” 낫과 죽창을 든 이들이 강가에 모였다.',
      '의병은 제 고을에서 강하다. 격문을 돌려 사람을 더 모을지, 곽재우의 계책을 빌릴지, 양식을 받을지.'
    ],
    choices:[
      { text:'격문을 돌린다', preview:'‘격문’ 2장', ops:[{op:'addCard', id:'manifesto', n:2}] },
      { text:'홍의장군의 계책', preview:'‘홍의장군’ 1장, ‘의령의 봉기’ 1장', ops:[{op:'addCard', id:'red_robe'}, {op:'addCard', id:'uiryeong_rising'}] },
      { text:'의병의 양식을 받는다', preview:'군량 +30', ops:[{op:'ration', n:30}] }
    ],
    memo:'곽재우가 의령에서 의병을 일으켰다 1592.4.22. 홍의장군.' },

  { id:'E7', key:'ichi_pass', act:2, title:'이치의 고개',
    text:[
      '전라도 이치. 한산도에서 포성이 울리던 바로 그날, 뭍에서는 왜군이 전라도로 넘어오는 고개를 두드렸다.',
      '권율이 고개 위에 목책을 세우고, 동복현감 황진이 앞에서 활을 쏘았다. 황진은 화살에 맞고도 물러서지 않았다.',
      '이 고개를 넘기면 전라도의 곡창이 열린다. 누구를 진중에 청하고, 누가 고개에 설 것인가.'
    ],
    choices:[
      { text:'권율을 청한다', if:{leader:'yi'}, hidden:true, preview:'부장 권율 영입', ops:[{op:'recruit', id:'gwon'}] },
      { text:'황진을 청한다', if:{leader:'gwon'}, hidden:true, preview:'부장 황진 영입', ops:[{op:'recruit', id:'hwang_jin'}] },
      { text:'황진을 청한다', preview:'부장 황진 영입', ops:[{op:'recruit', id:'hwang_jin'}] },
      { text:'고개를 지킨다', preview:'즉시 전투(고개, 창병 둘과 조총병) → 이기면 ‘이치의 활’ 카드', ops:[{op:'battle', enc:'ichi_hold', onWin:[{op:'addCard', id:'ichi_bow'}]}] }
    ],
    memo:'이치 1592.7.8. 권율과 황진이 고개를 지켰다.' },  // ①은 주장에 따라 둘 중 하나만 보인다(계약 §3.5)

  { id:'E8', key:'geumsan_twice', act:2, title:'금산, 두 번',
    text:[
      '7월 10일, 금산. 고경명이 의병 수천을 이끌고 성 아래로 갔다. 관군이 먼저 무너지자 의병도 흩어졌고, 고경명은 돌아오지 않았다.',
      '8월 18일, 다시 금산. 조헌과 승려 장수 영규가 칠백을 이끌고 같은 성 아래에 섰다. “물러서는 자는 없다.” 하루가 지나자 칠백 가운데 한 사람도 남지 않았다.',
      '그대의 군사는 어느 금산에 설 것인가.'
    ],
    choices:[
      { text:'고경명과 함께 싸운다', preview:'정예 전투(왜장과 창병 둘, 평지) → 이기면 ‘금산의 북’과 기물', ops:[{op:'battle', enc:'geumsan_elite', onWin:[{op:'addCard', id:'geumsan_drum'}]}] },
      { text:'조헌·영규를 청한다', preview:'부장 조헌·영규 영입', ops:[{op:'recruit', id:'jo_heon'}] },
      { text:'물러난다', preview:'병력 +5', ops:[{op:'hp', n:5}] }
    ],
    memo:'금산 1차 1592.7.10 고경명, 2차 8.18 조헌·영규와 칠백 의병.' },

  { id:'E9', key:'jincheonroe', act:2, title:'비격진천뢰',
    text:[
      '경주성 아래. 왜군이 성을 차지한 지 석 달이다. 이장손이 만든 둥근 쇠탄을 큰 포로 성 안에 쏘아 넣으면 한참 뒤에 터진다 했다.',
      '“굴러 들어온 쇠공을 왜적이 둘러서서 구경하다가, 터지는 소리에 수십이 넘어졌다”는 말이 돌았다.',
      '포를 먼저 쏠지, 변이중의 화차를 먼저 끌고 갈지, 아니면 성이 비기를 기다릴지.'
    ],
    choices:[
      { text:'이장손의 포를 쏜다', preview:'전투(경주 공성) 시작 시 적 전체에 16 피해 → 이기면 기물 ‘비격진천뢰’', ops:[{op:'battle', enc:'gyeongju', handlers:[{hook:'onBattleStart', ops:[{op:'dmg', n:16, tag:'fire', all:true}]}], onWin:[{op:'relic', id:'jincheonroe_relic'}]}] },
      { text:'화차를 먼저', preview:'‘화차’ 카드. 전투(경주 공성)는 그대로', ops:[{op:'addCard', id:'hwacha'}, {op:'battle', enc:'gyeongju'}] },
      { text:'둘 다 천천히', preview:'전투 생략, 군량 +15', ops:[{op:'ration', n:15}] }
    ],
    memo:'경주 탈환 1592.9.8. 이장손의 비격진천뢰, 변이중의 화차' },

  { id:'E10', key:'busanpo_jeongun', act:2, title:'부산포, 정운',
    text:[
      '9월 1일, 부산포. 왜선 수백 척이 포구에 매여 있었다. 함대가 포구 깊숙이 들어가 포를 쏘았다.',
      '녹도만호 정운이 앞장서 왜선 사이로 들어갔다가 조총 탄환에 맞아 쓰러졌다. 북소리가 잠시 멎었다.',
      '끝까지 칠 것인가, 물러날 것인가. 아니면 만호의 시신부터 거둘 것인가.'
    ],
    choices:[
      { text:'끝까지 친다', preview:'기물 ‘한산의 북’ 강화(해전 첫 턴 밀어내기 2), 병력 −10', ops:[{op:'relic', id:'hansan_drum', up:true}, {op:'hp', n:-10}] },
      { text:'물러난다', preview:'군량 +20', ops:[{op:'ration', n:20}] },
      { text:'녹도만호의 시신을 거둔다', preview:'의심 −1', ops:[{op:'suspicion', n:-1}] }
    ],
    memo:'부산포 1592.9.1. 녹도만호 정운이 전사했다.' },  // 2막 바닷길 결산 사건

  { id:'E11', key:'kim_simin_wound', act:2, title:'김시민의 상처',
    text:[
      '진주성. 엿새의 싸움이 끝났다. 왜군은 물러갔으나 진주목사 김시민은 이마에 조총 탄환을 맞고 쓰러졌다.',
      '의원이 말했다. “약이 있으면 살릴지도 모릅니다. 그러나 약은 먼 데 있고 값이 비쌉니다.”',
      '남은 군량을 털어 의원을 보낼지, 성을 황진에게 맡길지, 그대로 둘지.'
    ],
    variants:[
      { if:{noDeputy:'kim_simin'}, patch:{
        text:[
          '진주성. 엿새의 싸움이 끝났다. 왜군은 물러갔으나 진주목사 김시민은 이마에 조총 탄환을 맞고 쓰러졌다.',
          '김시민은 그대의 진중에 없다. 그러나 의원을 보내 살려내면 그가 그대의 북을 칠 것이다.',
          '남은 군량을 털어 의원을 보낼지, 성을 황진에게 맡길지, 그대로 둘지.'
        ],
        choices:[
          { text:'의원을 보낸다', if:{ration:{gte:25}}, reason:'군량 25가 없다.', preview:'군량 −25 → 김시민 영입(자리가 찼으면 교체)', ops:[{op:'ration', n:-25}, {op:'recruit', id:'kim_simin'}] },
          { text:'황진에게 맡긴다', preview:'황진 영입(자리가 찼으면 교체)', ops:[{op:'leave', id:'kim_simin'}, {op:'recruit', id:'hwang_jin'}] },
          { text:'그대로 둔다', preview:'기물 ‘진주의 북’ 강화(수성 첫 턴 적 전체 동요 2)', ops:[{op:'leave', id:'kim_simin'}, {op:'relic', id:'jinju_drum', up:true}] }
        ] } }
    ],
    choices:[
      { text:'의원을 보낸다', if:{ration:{gte:25}}, reason:'군량 25가 없다.', preview:'군량 −25, 김시민 유지', ops:[{op:'ration', n:-25}, {op:'recruit', id:'kim_simin'}] },
      { text:'황진에게 맡긴다', preview:'김시민 이탈, 황진 영입(자리가 찼으면 교체)', ops:[{op:'leave', id:'kim_simin'}, {op:'recruit', id:'hwang_jin'}] },
      { text:'그대로 둔다', preview:'김시민 이탈, 기물 ‘진주의 북’ 강화(수성 첫 턴 적 전체 동요 2)', ops:[{op:'leave', id:'kim_simin'}, {op:'relic', id:'jinju_drum', up:true}] }
    ],
    memo:'진주 1차 1592.10.5~10. 김시민은 총상을 입고 며칠 뒤 숨졌다.' },  // 2막 뭍길 결산 사건. recruit는 이미 있으면 무시, leave는 없으면 무시

  { id:'E12', key:'cheongbyeong', act:3, title:'명나라에 원군을 청하다',
    text:[
      '의주. 압록강 건너 요동에서 명의 군사가 온다는 말이 몇 달째 오갔다. 이덕형이 여러 번 강을 건너 원군을 청했다.',
      '“명군은 세다. 그러나 밥을 두 배로 먹고, 공은 저희가 가져간다.” 조정의 늙은 신하가 혀를 찼다.',
      '명의 대포와 기병을 얼마나 받을 것인가. 군량은 그만큼 줄 것이다.'
    ],
    choices:[
      { text:'한 부대만 청한다', preview:'명군 카드 2장 가운데 1장 선택', ops:[{op:'offer', pool:'ming', n:2, pick:1}] },
      { text:'군량을 내고 크게 청한다', if:{ration:{gte:30}}, reason:'군량 30이 없다.', preview:'군량 −30, 명군 카드 3장 가운데 2장 선택', ops:[{op:'ration', n:-30}, {op:'offer', pool:'ming', n:3, pick:2}] },
      { text:'요청을 미룬다', preview:'의심 +1, ‘원군 요청’ 카드 2장', ops:[{op:'suspicion', n:1}, {op:'addCard', id:'request_troops', n:2}] }
    ],
    memo:'이덕형이 명에 원군을 청했다. 의주 1592.12.' },  // 3막 열1 조정 사건

  { id:'E13', key:'byeokjegwan', act:3, title:'벽제관',
    text:[
      '벽제관. 평양을 되찾은 이여송이 기세를 몰아 한성으로 내달렸다. 고개 아래에서 고바야카와의 복병이 일어났다.',
      '명의 기병은 진창에 빠졌고 왜의 조총이 쏟아졌다. 이여송은 말을 잃고 물러났다.',
      '그대의 군사는 어디 있었는가. 말릴 것인가, 함께 싸울 것인가, 지켜볼 것인가.'
    ],
    choices:[
      { text:'이여송을 말린다', preview:'군량 +15', ops:[{op:'ration', n:15}] },
      { text:'함께 싸운다', preview:'정예 전투 ‘고바야카와 복병’ → 기물', ops:[{op:'battle', enc:'byeokje_elite'}] },
      { text:'지켜본다', preview:'다음 막까지 명군 카드 군량 비용 +1', ops:[{op:'flag', key:'mingCostDelta', value:1}, {op:'flag', key:'mingCostDeltaUntilAct', value:4}] }
    ],
    memo:'벽제관 1593.1.27. 이여송이 고바야카와의 복병에 꺾였다.' },

  { id:'E14', key:'combs', act:3, title:'참빗과 얼레빗',
    text:[
      '한강 나루. 명군이 지나간 고을마다 백성이 말했다. “왜군은 얼레빗이요 명군은 참빗이다.” 얼레빗은 성기게 긁고 참빗은 촘촘히 긁는다는 뜻이다.',
      '명의 장수가 군량을 내놓으라 했다. 내주면 우리 군사가 굶고, 안 내주면 저들이 백성을 턴다.',
      '군량을 내줄지, 따질지, 백성을 먼저 피신시킬지.'
    ],
    choices:[
      { text:'군량을 내준다', if:{ration:{gte:15}}, reason:'내줄 군량이 없다.', preview:'군량 −15', ops:[{op:'ration', n:-15}] },
      { text:'따진다', preview:'이번 막 명군 카드 군량 비용 +1, 의심 −1', ops:[{op:'flag', key:'mingCostDelta', value:1}, {op:'flag', key:'mingCostDeltaUntilAct', value:3}, {op:'suspicion', n:-1}] },
      { text:'백성을 피신시킨다', preview:'병력 −4, ‘백성의 돌’ 2장', ops:[{op:'hp', n:-4}, {op:'addCard', id:'people_stones', n:2}] }
    ],
    memo:'참빗과 얼레빗 이야기. 명군이 백성을 괴롭혔다. 한강 나루 1593.2.' },

  { id:'E15', key:'hanseong_recovered', act:3, title:'한성 수복',
    text:[
      '왜군이 한성을 비웠다. 사흘 뒤 조선군이 성문을 열고 들어갔다. 길에는 주린 백성과 뼈만 남은 시신이 있었다.',
      '왜군은 남으로 물러가는 중이다. 뒤를 쫓으면 칠 수 있으나, 성 안의 백성은 당장 먹을 것이 없다.',
      '추격할 것인가, 백성을 먹일 것인가, 임금께 장계를 올릴 것인가.'
    ],
    choices:[
      { text:'추격한다', preview:'정예 전투(기마 무사와 창병 둘) → 기물', ops:[{op:'battle', enc:'hanseong_pursuit'}] },
      { text:'백성을 먹인다', if:{ration:{gte:20}}, reason:'나눌 군량이 없다.', preview:'군량 −20, 최대 병력 +6', ops:[{op:'ration', n:-20}, {op:'hp', max:6}] },
      { text:'장계를 올린다', preview:'의심 −2', ops:[{op:'suspicion', n:-2}] }
    ],
    memo:'한성 수복 1593.4.18~20.' },  // 3막 결전 뒤 마디

  { id:'E16', key:'hullyeondogam', act:4, title:'훈련도감',
    text:[
      '한성. 임금이 훈련도감을 세우라 했다. 총을 쏘는 포수, 활을 쏘는 사수, 칼을 쓰는 살수를 함께 기르는 삼수병의 법이다.',
      '“조총은 배워야 쏜다. 왜에게서 배운 법을 우리 군사에게 가르치라.” 도감에 모인 이들은 주린 백성이 대부분이었다.',
      '도감의 쌀을 어디에 쓸 것인가. 군사를 훈련할지, 삼수병을 받을지, 밭을 일굴지.'
    ],
    choices:[
      { text:'군사를 훈련한다', preview:'카드 2장 강화(고른다)', ops:[{op:'upgrade', n:2, choose:true}] },
      { text:'삼수병을 받는다', preview:'‘삼수병’ 2장', ops:[{op:'addCard', id:'samsu', n:2}] },
      { text:'밭을 일군다', preview:'군량 +50', ops:[{op:'ration', n:50}] }
    ],
    memo:'훈련도감을 세웠다 1593. 포수·사수·살수를 함께 길렀다.' },

  { id:'E17', key:'head_is_treasure', act:4, title:'네 머리가 보배다',
    text:[
      '서생포 왜성. 승려 장수 사명당이 가토의 진에 홀로 들어갔다. 가토가 물었다. “조선의 보배는 무엇인가.”',
      '사명당이 답했다. “조선에는 보배가 없다. 보배는 일본에 있다. 네 머리가 보배다.” 가토가 크게 웃었다 한다.',
      '회담에서 무엇을 얻어 올 것인가. 말인가, 정보인가, 양식인가.'
    ],
    choices:[
      { text:'사명당의 회담', preview:'‘회담’ 카드, 의심 −1', ops:[{op:'addCard', id:'parley'}, {op:'suspicion', n:-1}] },
      { text:'가토의 정보', preview:'5막 결전 적 체력 −15%', ops:[{op:'flag', key:'boss5HpPct', value:-0.15}] },
      { text:'양식을 받아 온다', preview:'군량 +30', ops:[{op:'ration', n:30}] }
    ],
    memo:'서생포 회담 1594.4. 사명당과 가토.' },

  { id:'E18', key:'monghak', act:4, title:'이몽학의 난',
    text:[
      '홍산. 이몽학이 “왜를 치러 간다”며 사람을 모아 관아를 쳤다. 난은 열흘을 못 넘기고 무너졌다.',
      '잡힌 자들이 입을 모아 말했다. “김덕령도 함께하기로 했다.” 김덕령은 의병장으로 이름이 높았다. 임금이 그를 잡아 올리라 했다.',
      '한 달 뒤 김덕령은 매를 맞다 옥에서 죽었다. 그대는 그를 변호할 것인가, 입을 다물 것인가, 반군을 칠 것인가.'
    ],
    choices:[
      { text:'김덕령을 변호한다', preview:'의심 +2, ‘결사’ 2장', ops:[{op:'suspicion', n:2}, {op:'addCard', id:'resolve', n:2}] },
      { text:'입을 다문다', preview:'기물 ‘감옥의 쇠사슬’(저주: 의심 +2, 매 턴 군령 +1)', ops:[{op:'relic', id:'chains'}] },
      { text:'반군을 친다', preview:'정예 전투(이몽학 반군) → 기물, 이기면 의심 −1', ops:[{op:'battle', enc:'monghak_elite', onWin:[{op:'suspicion', n:-1}]}] }
    ],
    memo:'이몽학의 난 1596.7 홍산. 김덕령이 옥에서 죽었다 1596.8.' },

  { id:'E19', key:'yoshira', act:4, title:'요시라의 계략',
    text:[
      '경상도. 고니시의 부하 요시라가 조선 장수의 진에 와서 말했다. “가토가 며칠 뒤 바다를 건넌다. 통제사가 나가면 잡을 수 있다.”',
      '조정이 출격을 명했다. 바다를 아는 이는 말했다. “적의 말을 믿고 수군을 내보내면 그물에 드는 것이다.”',
      '나갈 것인가, 거부할 것인가. 아니면 저들의 첩자를 되돌려 쓸 것인가.'
    ],
    choices:[
      { text:'출격한다', if:{hpPct:{gte:20}}, reason:'병력이 너무 적다.', preview:'즉시 정예 해전(안택선과 중선 둘), 시작 병력 −10 → 이기면 의심 −1', ops:[{op:'battle', enc:'yoshira_naval', hpDelta:-10, onWin:[{op:'suspicion', n:-1}]}] },
      { text:'출격하지 않는다', preview:'의심 +3', ops:[{op:'suspicion', n:3}] },
      { text:'첩자를 되돌려 쓴다', if:{hasCard:['counter_spy','scout_boat']}, reason:'덱에 ‘이간질’이나 ‘척후선’이 있어야 한다.', preview:'5막 결전 적 체력 −10%. 의심 그대로', ops:[{op:'flag', key:'boss5HpPct', value:-0.10}, {op:'fx', kind:'banner', key:'counterspy'}] }
    ],
    memo:'요시라의 말 1597.1. 이순신이 파직되는 발단이 되었다.' },  // ③은 계약 §13(의도 공개 → 체력 −10% + 배너)

  { id:'E20', key:'chilcheon', act:5, title:'칠천량',
    text:[
      '7월 16일 새벽, 칠천량. 조정의 독촉에 밀려 나간 함대가 밤새 왜선에 둘러싸였다. 원균이 죽고 이억기가 죽었다. 판옥선 백여 척이 불탔다.',
      '배설이 열두 척을 이끌고 빠져나왔다. 바다가 비었다. 배도, 사람도, 장계도 없다. 남은 것은 열두 척이라는 숫자뿐이다.',
      '임금이 붓을 들었다. “통제사를 다시 부르라.”'
    ],
    choices:[
      { text:'통제사를 다시 부른다', preview:'수군 카드 전부 잃음 → ‘열두 척’·‘필사즉생’ 덱에 → 이억기 전사 → 이순신 복귀', ops:[{op:'flag', key:'chilcheon', value:true}] }
    ],
    memo:'칠천량 1597.7.15~16. 원균과 이억기가 전사하고, 배설이 12척을 건졌다.' },  // 선택지 1개. 처리는 Run §6.6

  { id:'E21', key:'twelve_ships_left', act:5, title:'신에게는 아직 열두 척',
    text:[
      '회령포. 백의종군에서 돌아온 통제사가 남은 배를 세었다. 열두 척이었다.',
      '조정에서 글이 왔다. “수군이 약하니 배를 버리고 권율의 육군에 합치라.” 통제사가 답을 썼다. “신에게는 아직 열두 척의 배가 있사옵니다.”',
      '열두 척으로 무엇을 할 것인가.'
    ],
    variants:[
      { if:{flag:{chilcheon:false}}, patch:{ title:'수군 재건',
        text:[
          '회령포. 칠천량의 화를 면한 함대가 포구에 들었다. 배는 상했고 노꾼들은 지쳤다.',
          '조정은 수군을 의심하지 않았다. 그러나 왜의 대선단이 다시 남해를 덮고 있다.',
          '함대를 어떻게 다시 세울 것인가.'
        ],
        choices:[
          { text:'수군을 다시 세운다', preview:'군량 +30, 병력 +10', ops:[{op:'ration', n:30}, {op:'hp', n:10}] },
          { text:'열두 척의 결의', preview:'‘열두 척’ 1장(이미 있으면 강화)', ops:[{op:'cond', if:{hasCard:'twelve_ships'}, then:[{op:'upgrade', id:'twelve_ships'}], else:[{op:'addCard', id:'twelve_ships'}]}] },
          { text:'장계를 올린다', preview:'의심 −1', ops:[{op:'suspicion', n:-1}] }
        ] } }
    ],
    choices:[
      { text:'수군을 다시 세운다', preview:'‘열두 척’ 1장(이미 있으면 강화)', ops:[{op:'cond', if:{hasCard:'twelve_ships'}, then:[{op:'upgrade', id:'twelve_ships'}], else:[{op:'addCard', id:'twelve_ships'}]}] },
      { text:'수군 폐지 어명을 거부한다', preview:'의심 +2, 최대 병력 +10', ops:[{op:'suspicion', n:2}, {op:'hp', max:10}] },
      { text:'백성의 배를 모은다', preview:'군량 +30', ops:[{op:'ration', n:30}] }
    ],
    memo:'회령포 1597.8.18. 변형: 칠천량을 겪지 않았으면 ‘수군 재건’' },

  { id:'E22', key:'white_robe', act:5, title:'권율의 도원수부',
    text:[
      '정유년 봄, 전라도. 도원수 권율의 진이 남녘 길목에 섰다. 왜군이 다시 바다를 건넜다는 소식이 날마다 왔다.',
      '도원수가 그대의 군사를 둘러보았다. “싸움은 다시 온다. 훈련할 틈은 지금뿐이다.”',
      '도원수부에서 무엇을 얻을 것인가.'
    ],
    variants:[
      { if:{flag:{dismissed:true}}, patch:{ title:'백의종군',
        text:[
          '한성에서 풀려난 전 통제사가 흰옷을 입고 남으로 내려왔다. 벼슬도 군사도 없이, 도원수 권율의 진으로 가는 길이다.',
          '길가의 백성들이 나와 울었다. “통제사 어른, 어디로 가십니까.” 그는 답하지 않고 걸었다.',
          '그대의 군사가 그 길목에 있다. 흰옷의 사내를 따를 것인가.'
        ],
        choices:[
          { text:'통제사를 따른다', preview:'병력 +10', ops:[{op:'hp', n:10}] },
          { text:'도원수부의 군량을 받는다', preview:'군량 +20', ops:[{op:'ration', n:20}] },
          { text:'결사를 다짐한다', preview:'‘결사’ 1장', ops:[{op:'addCard', id:'resolve'}] }
        ] } }
    ],
    choices:[
      { text:'도원수의 훈련', preview:'카드 1장 강화(고른다)', ops:[{op:'upgrade', n:1, choose:true}] },
      { text:'도원수부의 군량을 받는다', preview:'군량 +20', ops:[{op:'ration', n:20}] },
      { text:'결사를 다짐한다', preview:'‘결사’ 1장', ops:[{op:'addCard', id:'resolve'}] }
    ],
    memo:'백의종군 1597.4.1 / 권율 도원수부. 변형: 파직되었으면 ‘백의종군’' },

  { id:'E23', key:'return_tongjesa', act:5, title:'통제사 복귀',
    text:[
      '8월 3일, 임금의 글이 내려왔다. “지난날의 일은 과인의 허물이다. 그대를 다시 삼도수군통제사로 삼노라.”',
      '흰옷의 사내가 다시 갑옷을 입었다. 남은 배와 남은 군사를 찾아 남쪽으로 내려갔다.',
      '이순신이 진중에 합류한다.'
    ],
    choices:[
      { text:'통제사를 맞는다', preview:'이순신 합류(주장·부장이 아니면 특별 부장 자리)', ops:[{op:'recruit', id:'yi', special:true}] }
    ],
    memo:'이순신 복직 1597.8.3.' },  // 5막 결산 사건. 선택지 1개. 이미 주장·부장이면 무시

  { id:'E24', key:'byeokpajin_night', act:6, title:'벽파진의 밤',
    text:[
      '벽파진. 울돌목 앞의 작은 포구에 열세 척이 매였다. 밤마다 왜선의 불빛이 어란포 쪽에서 가까워졌다.',
      '어란포에서 척후가 왔다. “왜선이 백 척을 넘습니다.” 백성들이 배를 끌고 와 진 뒤에 늘어섰다.',
      '울돌목의 밤을 어떻게 보낼 것인가.'
    ],
    choices:[
      { text:'군사를 쉬게 한다', preview:'병력 +20', ops:[{op:'hp', n:20}] },
      { text:'어란포 척후', preview:'결전 첫 손에 ‘척후선’ 2장', ops:[{op:'flag', key:'b6_scouts', value:true}] },
      { text:'백성의 배를 뒤에 세운다', preview:'결전 시작 진형 +10', ops:[{op:'flag', key:'b6_block', value:10}] }
    ],
    memo:'벽파진 1597.9.7~15, 어란포 8.28. 명량 전야.' },

  { id:'E25', key:'pilsa_jeuksaeng', act:6, title:'필사즉생',
    text:[
      '우수영. 통제사가 장수들을 모아 놓고 말했다. “병법에 이르기를, 죽고자 하면 살고 살고자 하면 죽는다 하였다.”',
      '“한 사람이 길목을 지키면 천 사람을 두렵게 할 수 있다. 내일 울돌목에서 싸운다.” 아무도 대답하지 않았으나 아무도 물러서지 않았다.',
      '전야의 결의를 어디에 둘 것인가.'
    ],
    choices:[
      { text:'필사즉생', preview:'‘필사즉생’ 1장(이순신이 주장이면 강화판)', ops:[{op:'cond', if:{leader:'yi'}, then:[{op:'addCard', id:'pilsa_jeuksaeng', up:true}], else:[{op:'addCard', id:'pilsa_jeuksaeng'}]}] },
      { text:'기세를 올린다', preview:'결전 동안 기세 +3', ops:[{op:'flag', key:'b6_momentum', value:3}] },
      { text:'장계를 올린다', preview:'의심 −2', ops:[{op:'suspicion', n:-2}] }
    ],
    memo:'명량 전야 1597.9.15 우수영.' },  // 6막 열5 조정 사건

  { id:'E26', key:'hideyoshi_dies', act:7, title:'히데요시가 죽다',
    text:[
      '왜의 우두머리 히데요시가 죽었다. 소식은 비밀에 부쳐졌으나 가을이 되자 남해안의 왜성마다 철수하는 배가 늘었다.',
      '순천 왜교성의 고니시가 길을 열어 달라 명군에 청했다. 명의 장수들은 뇌물을 받고 눈을 감으려 했다.',
      '돌아가는 적을 칠 것인가, 보낼 것인가, 순천을 먼저 칠 것인가.'
    ],
    choices:[
      { text:'철수하는 적을 친다', preview:'결전 2단계 적 체력 −20, 의심 +1', ops:[{op:'flag', key:'b7_p2Hp', value:-20}, {op:'suspicion', n:1}] },
      { text:'보낸다', preview:'군량 +40', ops:[{op:'ration', n:40}] },
      { text:'순천을 친다', preview:'전투(순천 왜교성, 공성) → 기물', ops:[{op:'battle', enc:'suncheon'}] }
    ],
    memo:'히데요시가 죽었다 1598.8.18. 순천 왜교성 9.20~10.7. 왜군이 물러가기 시작했다.' },

  { id:'E27', key:'chen_lin_wine', act:7, title:'진린의 술',
    text:[
      '고금도. 명 수군의 대장 진린의 배가 진 옆에 닻을 내렸다. 진린은 처음에 조선 수군을 깔보았으나 몇 번의 싸움 뒤 술을 들고 찾아왔다.',
      '“이 공을 함께 아뢰자. 황제께도, 그대 임금께도.” 진린이 잔을 내밀었다.',
      '잔을 받을 것인가, 공을 나눌 것인가, 거절할 것인가.'
    ],
    choices:[
      { text:'술을 받는다', preview:'결전 명 수군 카드 +1', ops:[{op:'flag', key:'b7_mingExtra', add:1}] },
      { text:'공을 나눈다', preview:'의심 −2', ops:[{op:'suspicion', n:-2}] },
      { text:'거절한다', preview:'군량 +20', ops:[{op:'ration', n:20}] }
    ],
    memo:'고금도 본영 1598.2. 진린의 명 수군이 합류했다.' },

  { id:'E28', key:'do_not_announce', act:7, title:'나의 죽음을 알리지 마라',
    text:[
