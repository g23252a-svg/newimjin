          { text:'거부한다', preview:'결말 ‘징비’로 가는 길(이순신 생환)', ops:[{op:'flag', key:'dokjeon', value:false}] },
          { text:'명군에 맡긴다', preview:'결전 명 수군 카드 +2, 점수 −100', ops:[{op:'flag', key:'b7_mingExtra', add:2}, {op:'score', n:-100}] }
        ] } }
    ],
    choices:[
      { text:'‘독전의 북’을 받는다', preview:'결전 첫 손에 ‘독전의 북’(모든 공격 +60%). 결전 뒤 이순신 전사 → 결말 ‘실록’', ops:[{op:'flag', key:'dokjeon', value:true}] },
      { text:'거부한다', preview:'결말 ‘징비’로 가는 길(이순신 생환)', ops:[{op:'flag', key:'dokjeon', value:false}] },
      { text:'명군에 맡긴다', preview:'결전 명 수군 카드 +2, 점수 −100', ops:[{op:'flag', key:'b7_mingExtra', add:2}, {op:'score', n:-100}] }
    ],
    memo:'노량 1598.11.19 전야, 고금도 11.18.' },  // 7막 열6 조정 사건. 변형: 권율 주장이면 ①은 이순신 부장 필요

  { id:'E29', key:'court', act:0, title:'조정',
    text:[
      '전하께 아뢰는 자리다. 싸움의 사정을 장계로 올리고, 쓸 만한 장수를 들이고, 명의 군사를 청할 수 있다.',
      '조정은 공을 기억하되 의심도 함께 기억한다. 올린 장계는 의심을 누그러뜨리고, 청한 군사는 군량을 먹는다.'
    ],
    choices:[],
    memo:'조정' }  // 마디 공통. Run이 court 프롬프트로 처리하므로 제목·본문만. 선택지 규칙은 EVENTS.court
  ];

  /* ---------------- 조정·군영 규칙 데이터 (수치는 두지 않는다 — Run이 BAL로 만든다) ---------------- */
  var court = {
    eventId:'E29',
    options:[
      { id:'report',  text:'장계 올리기', desc:'싸움의 전말을 전하께 아뢴다. 임금의 의심이 누그러진다.', always:true, bal:'COURT.report' },
      { id:'recruit', text:'장수 영입', desc:'이 막의 장수 후보 가운데 한 사람을 진중에 들인다. 자리가 찼으면 한 사람과 바꾼다.', reasonNone:'영입할 장수가 없다.' },
      { id:'request', text:'명군 요청', desc:'명의 군사를 청한다. 명군 카드 가운데 하나를 덱에 넣고 군량을 내준다.', minAct:3, bal:'COURT.requestCost', balPick:'COURT.requestPick', reasonAct:'명군은 아직 압록강 너머에 있다.', reasonRation:'내줄 군량이 모자란다.' }
    ],
    lines:{
      enter:'궁궐의 문이 열렸다. 무엇을 아뢸까?',
      after:{ report:'장계가 올라갔다. 전하께서 고개를 끄덕이셨다 한다.', recruit:'새 장수가 진중에 들어왔다. 북소리가 한 번 더 울렸다.', request:'압록강 너머에서 명의 군사가 건너왔다. 군량 창고가 조금 가벼워졌다.' },
      replace:'자리가 찼다. 누구를 내보낼까?'
    }
  };
  var camp = {
    options:[
      { id:'rest',  text:'휴식', desc:'천막을 치고 군사를 쉬게 한다. 병력이 돌아온다.', bal:'CAMP.restPct' },
      { id:'train', text:'훈련', desc:'카드 1장을 골라 강화한다.' },
      { id:'farm',  text:'농사', desc:'군사가 밭을 갈아 군량을 거둔다.', bal:'CAMP.farm' }
    ],
    lines:{
      enter:'천막이 섰다. 하루를 어떻게 쓸까?',
      after:{ rest:'군사들이 불가에서 잠들었다. 아침에 북소리가 가벼웠다.', train:'활시위를 당기는 소리가 밤늦도록 났다.', farm:'가을걷이가 끝났다. 수레에 쌀이 실렸다.' }
    }
  };

  /* ---------------- 색인 ---------------- */
  var byId = {}, byKey = {};
  for (var i = 0; i < list.length; i++) { byId[list[i].id] = list[i]; byKey[list[i].key] = list[i]; }
  function get(id) { var e = byId[id]; if (!e) throw new Error('EVENTS: 없는 id ' + id); return e; }

  /* ---------------- selfTest ---------------- */
  var KEYS = ['dongnae','sayaga','joryeong_or_tangeumdae','king_leaves','turtle_launch','red_general','ichi_pass','geumsan_twice','jincheonroe','busanpo_jeongun',
    'kim_simin_wound','cheongbyeong','byeokjegwan','combs','hanseong_recovered','hullyeondogam','head_is_treasure','monghak','yoshira','chilcheon',
    'twelve_ships_left','white_robe','return_tongjesa','byeokpajin_night','pilsa_jeuksaeng','hideyoshi_dies','chen_lin_wine','do_not_announce','court'];
  var OPS_COMMON = ['suspicion','ration','hp','addCard','removeCard','upgrade','relic','flag','leave','cond','fx','score'];
  var OPS_BATTLE = ['dmg','block','push','pull','draw','energy','status','stun','buff','exhaustHand','discard','exhaust','retrieve','mark','delay','stripBlock'];
  var OPS_RUN = ['battle','recruit','ending','offer'];
  var HOOKS = ['onBattleStart','onTurnStart','onTurnEnd','onCardPlayed','onCardDrawn','onDamageDealt','onDamageTaken','onDistanceChange','onEnemyDeath','onEnemySpawn','onWaveStart','onHpZero','onBattleEnd','onActStart','onAcquire'];
  var COND_KEYS = ['dist','distNot','hpPct','naval','siege','assault','field','turn','turnLte','hasWall','tide','wave','cardTag','cardType','cardPool','cardId','cardMarked',
    'enemyId','enemyTag','handCount','cardsPlayedThisTurn','deckTagCount','hasCard','hasRelic','hasDeputy','noDeputy','flag','leader','lane','act','actGte','ration','suspicion','slotsFree','oncePerBattle','oncePerTurn'];
  var ID_RE = /^[a-z][a-z0-9_]*$/;
  var DEPUTIES = ['gwon','yi','yi_eokgi','kim_simin','jeong_munbu','jo_heon','hwang_jin','yi_jeongam'];
  var RELICS = ['turtle_blueprint','jincheonroe_relic','hwacha_relic','nanjung_relic','jingbirok','tonga','hangwae_gun','obangnang','seoae_brush','chains','joryeong_stone','hansan_drum','jinju_drum','haengju_ash','jiksan_spear','myeongnyang_chain','tongjeyeong_flag'];
  var CHOOSE_OPS = ['discard','exhaust','retrieve','upgrade'];

  function has(arr, v) { return arr.indexOf(v) >= 0; }
  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function checkPlain(v, path, errors) {
    if (v === undefined || typeof v === 'function') { errors.push(path + ': JSON 왕복 불가 값(' + typeof v + ')'); return; }
    if (v === null || typeof v !== 'object') return;
    if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) checkPlain(v[i], path + '[' + i + ']', errors); return; }
    if (Object.getPrototypeOf(v) !== Object.prototype) { errors.push(path + ': 순수 객체가 아님'); return; }
    for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) checkPlain(v[k], path + '.' + k, errors);
  }
  function checkCond(c, path, errors) {
    if (!isObj(c)) { errors.push(path + ': cond가 객체가 아님'); return; }
    for (var k in c) if (!has(COND_KEYS, k)) errors.push(path + ': 모르는 cond 키 ' + k);
  }
  function refId(v, path, errors, refs, bucket) {
    if (typeof v !== 'string' || !ID_RE.test(v)) { errors.push(path + ': ID 형식 오류 ' + JSON.stringify(v)); return; }
    refs[bucket].push(v);
  }
  // ctx: 'run'(사건 선택지) | 'battle'(battle.handlers 안)
  function walkOps(ops, ctx, path, errors, refs, inCard) {
    if (!Array.isArray(ops)) { errors.push(path + ': ops가 배열이 아님'); return; }
    for (var i = 0; i < ops.length; i++) {
      var o = ops[i], p = path + '[' + i + ']';
      if (!isObj(o) || typeof o.op !== 'string') { errors.push(p + ': op 객체가 아님'); continue; }
      var allowed = ctx === 'run' ? OPS_COMMON.concat(OPS_RUN) : OPS_COMMON.concat(OPS_BATTLE);
      if (!has(allowed, o.op)) { errors.push(p + ': ' + ctx + ' 맥락에서 허용되지 않는 op ' + o.op); continue; }
      if (o.choose === true && (!inCard || !has(CHOOSE_OPS, o.op))) {
        if (!(ctx === 'run' && o.op === 'upgrade')) errors.push(p + ': choose:true는 카드 ops 안(또는 판 upgrade)에서만');
      }
      switch (o.op) {
        case 'cond':
          checkCond(o['if'], p + '.if', errors);
          walkOps(o.then, ctx, p + '.then', errors, refs, inCard);
          if (o['else'] !== undefined) walkOps(o['else'], ctx, p + '.else', errors, refs, inCard);
          break;
        case 'addCard': case 'removeCard':
          if (o.id !== undefined) refId(o.id, p + '.id', errors, refs, 'cards');
          if (o.pool !== undefined && typeof o.pool !== 'string') errors.push(p + '.pool: 문자열 아님');
          if (o.id === undefined && o.pool === undefined && o.op === 'addCard') errors.push(p + ': addCard에 id도 pool도 없음');
          break;
        case 'upgrade': if (o.id !== undefined) refId(o.id, p + '.id', errors, refs, 'cards'); break;
        case 'relic': refId(o.id, p + '.id', errors, refs, 'relics'); break;
        case 'recruit': case 'leave': refId(o.id, p + '.id', errors, refs, 'deputies'); break;
        case 'flag':
          if (typeof o.key !== 'string' || !o.key) errors.push(p + ': flag key 없음');
          if (o.value === undefined && o.add === undefined) errors.push(p + ': flag에 value도 add도 없음');
          break;
        case 'offer':
          if (o.ids !== undefined) { if (!Array.isArray(o.ids)) errors.push(p + '.ids: 배열 아님'); else for (var j = 0; j < o.ids.length; j++) refId(o.ids[j], p + '.ids[' + j + ']', errors, refs, 'cards'); }
          else if (typeof o.pool !== 'string') errors.push(p + ': offer에 pool도 ids도 없음');
          if (typeof o.n !== 'number' || typeof o.pick !== 'number' || o.pick > o.n) errors.push(p + ': offer n/pick 오류');
          break;
        case 'battle':
          refId(o.enc, p + '.enc', errors, refs, 'encs');
          if (o.onWin !== undefined) walkOps(o.onWin, 'run', p + '.onWin', errors, refs, false);
          if (o.handlers !== undefined) {
            if (!Array.isArray(o.handlers)) { errors.push(p + '.handlers: 배열 아님'); break; }
            for (var h = 0; h < o.handlers.length; h++) {
              var hd = o.handlers[h], hp = p + '.handlers[' + h + ']';
              if (!isObj(hd) || !has(HOOKS, hd.hook)) errors.push(hp + ': 모르는 훅 ' + (hd && hd.hook));
              if (hd && hd.cond !== undefined) checkCond(hd.cond, hp + '.cond', errors);
              if (hd) walkOps(hd.ops, 'battle', hp + '.ops', errors, refs, false);
            }
          }
          break;
        case 'suspicion': case 'ration': case 'score':
          if (typeof o.n !== 'number') errors.push(p + ': n이 숫자 아님');
          break;
        case 'hp':
          if (o.n === undefined && o.max === undefined && o.pct === undefined) errors.push(p + ': hp에 n/max/pct 없음');
          break;
        case 'fx': if (typeof o.kind !== 'string') errors.push(p + ': fx kind 없음'); break;
        case 'dmg': if (typeof o.n !== 'number' || typeof o.tag !== 'string') errors.push(p + ': dmg n/tag 오류'); break;
        default: break;
      }
    }
  }
  function checkChoice(c, path, errors, refs) {
    if (!isObj(c)) { errors.push(path + ': 선택지가 객체 아님'); return; }
    if (typeof c.text !== 'string' || !c.text) errors.push(path + ': text 없음');
    if (c.preview !== undefined && typeof c.preview !== 'string') errors.push(path + ': preview 문자열 아님');
    if (c['if'] !== undefined) checkCond(c['if'], path + '.if', errors);
    if (c.hidden !== undefined && (c.hidden !== true || c['if'] === undefined)) errors.push(path + ': hidden은 if와 함께 true만');
    if (c.reason !== undefined && (typeof c.reason !== 'string' || c['if'] === undefined)) errors.push(path + ': reason은 if와 함께 문자열만');
    walkOps(c.ops, 'run', path + '.ops', errors, refs, false);
  }
  function checkText(t, path, errors) {
    if (!Array.isArray(t) || t.length < 1 || t.length > 4) { errors.push(path + ': text는 문단 1~4개'); return; }
    for (var i = 0; i < t.length; i++) if (typeof t[i] !== 'string' || !t[i]) errors.push(path + '[' + i + ']: 빈 문단');
  }

  function selfTest() {
    var errors = [], refs = { cards:[], relics:[], deputies:[], encs:[] };
    if (list.length !== 29) errors.push('사건 수 ' + list.length + ' ≠ 29');
    var seenId = {}, seenKey = {};
    for (var i = 0; i < list.length; i++) {
      var e = list[i], p = 'E[' + i + ']';
      if (!isObj(e)) { errors.push(p + ': 객체 아님'); continue; }
      p = e.id || p;
      if (e.id !== 'E' + (i + 1)) errors.push(p + ': id 순서 오류(기대 E' + (i + 1) + ')');
      if (e.key !== KEYS[i]) errors.push(p + ': key 오류 ' + e.key + ' (기대 ' + KEYS[i] + ')');
      if (seenId[e.id]) errors.push(p + ': id 중복'); seenId[e.id] = true;
      if (seenKey[e.key]) errors.push(p + ': key 중복 ' + e.key); seenKey[e.key] = true;
      if (typeof e.act !== 'number' || e.act < 0 || e.act > 7) errors.push(p + ': act 범위 오류');
      if (typeof e.title !== 'string' || !e.title) errors.push(p + ': title 없음');
      if (typeof e.memo !== 'string') errors.push(p + ': memo 없음');
      checkText(e.text, p + '.text', errors);
      if (!Array.isArray(e.choices)) { errors.push(p + ': choices 배열 아님'); continue; }
      var want = e.id === 'E29' ? 0 : (e.id === 'E20' || e.id === 'E23') ? 1 : 3;
      if (want === 0 ? e.choices.length !== 0 : want === 1 ? e.choices.length !== 1 : e.choices.length < 3) errors.push(p + ': 선택지 수 ' + e.choices.length + ' (기대 ' + (want === 3 ? '3 이상' : want) + ')');
      for (var c = 0; c < e.choices.length; c++) checkChoice(e.choices[c], p + '.choices[' + c + ']', errors, refs);
      if (e.variants !== undefined) {
        if (!Array.isArray(e.variants)) errors.push(p + '.variants: 배열 아님');
        else for (var v = 0; v < e.variants.length; v++) {
          var va = e.variants[v], vp = p + '.variants[' + v + ']';
          if (!isObj(va) || !isObj(va.patch)) { errors.push(vp + ': {if, patch} 아님'); continue; }
          checkCond(va['if'], vp + '.if', errors);
          for (var k in va.patch) if (!has(['title','text','choices'], k)) errors.push(vp + '.patch: 모르는 키 ' + k);
          if (va.patch.title !== undefined && typeof va.patch.title !== 'string') errors.push(vp + '.patch.title: 문자열 아님');
          if (va.patch.text !== undefined) checkText(va.patch.text, vp + '.patch.text', errors);
          if (va.patch.choices !== undefined) {
            if (!Array.isArray(va.patch.choices) || va.patch.choices.length < 1) errors.push(vp + '.patch.choices: 배열(1개 이상) 아님');
            else for (var pc = 0; pc < va.patch.choices.length; pc++) checkChoice(va.patch.choices[pc], vp + '.patch.choices[' + pc + ']', errors, refs);
          }
        }
      }
      for (var ek in e) if (!has(['id','key','act','title','text','memo','variants','choices'], ek)) errors.push(p + ': 모르는 필드 ' + ek);
    }
    checkPlain(list, 'EVENTS.list', errors);
    checkPlain(court, 'EVENTS.court', errors);
    checkPlain(camp, 'EVENTS.camp', errors);
    try { if (JSON.stringify(JSON.parse(JSON.stringify(list))) !== JSON.stringify(list)) errors.push('EVENTS.list: JSON 왕복 불일치'); }
    catch (ex) { errors.push('EVENTS.list: JSON 왕복 예외 ' + ex.message); }
    // 참조 ID: 부장·기물은 계약 §3.4 목록과 대조. 카드·편성은 형식만(전역이 있으면 존재까지)
    var d, r, s;
    for (d = 0; d < refs.deputies.length; d++) if (!has(DEPUTIES, refs.deputies[d])) errors.push('모르는 부장 ID ' + refs.deputies[d]);
    for (r = 0; r < refs.relics.length; r++) if (!has(RELICS, refs.relics[r])) errors.push('모르는 기물 ID ' + refs.relics[r]);
    if (typeof CARDS !== 'undefined' && CARDS && CARDS.byId) for (s = 0; s < refs.cards.length; s++) if (!CARDS.byId[refs.cards[s]]) errors.push('CARDS에 없는 카드 ID ' + refs.cards[s]);
    if (typeof ENEMIES !== 'undefined' && ENEMIES && ENEMIES.encounters && ENEMIES.encounters.byId) for (s = 0; s < refs.encs.length; s++) if (!ENEMIES.encounters.byId[refs.encs[s]]) errors.push('ENEMIES에 없는 편성 ID ' + refs.encs[s]);
    if (typeof GENERALS !== 'undefined' && GENERALS && GENERALS.relics && GENERALS.relics.byId) for (s = 0; s < refs.relics.length; s++) if (!GENERALS.relics.byId[refs.relics[s]]) errors.push('GENERALS에 없는 기물 ID ' + refs.relics[s]);
    // court/camp 구조
    var ids = court.options.map(function (o) { return o.id; }).join(',');
    if (ids !== 'report,recruit,request') errors.push('EVENTS.court.options id 순서 오류: ' + ids);
    ids = camp.options.map(function (o) { return o.id; }).join(',');
    if (ids !== 'rest,train,farm') errors.push('EVENTS.camp.options id 순서 오류: ' + ids);
    if (!byId.E29 || court.eventId !== 'E29') errors.push('EVENTS.court.eventId는 E29');
    return { ok: errors.length === 0, errors: errors };
  }

  var api = { list: list, byId: byId, byKey: byKey, get: get, court: court, camp: camp, selfTest: selfTest };
  return api;
})();

</script>
<script>
/* ===== src/06_map.js ===== */
/* ===== 06_map.js — 7막 고정 지도: 49열·77마디(좌표·도·날짜·종류·연결)·지형 7 ===== */
// 계약서 §3.6 스키마·노드 ID 규칙(a{막}_{슬러그}, 2막은 a2s_/a2l_)·노드 지침을 그대로 옮겼다. 수치·콘텐츠는 DESIGN §5.1~5.7·§6.3.
// 「마디 49」는 열(列) 수다(7/8/8/6/7/6/7). 한 열에 마디가 둘 이상이면 하나를 고른다. 마디 객체는 77개.
// 지형 mods 는 계약 §3.6 본문(fort {} · port/strait {startDist:0} · waeseong {enemyGunPct})을 따른다 —

  /* ------------------------------------------------------------ 조립: 마디 정규화(키 전부 채움) · 막 cols · 좌표 */
  function mk(o){
    return { id:o.id, act:o.act, col:o.col, kind:o.kind, name:o.name, do:o.do, date:o.date,
      type:o.type || null, enc:o.enc || null, elite:!!o.elite, eventId:o.eventId || null, courtEvent:o.courtEvent || null,
      bossEnc:o.bossEnc || null, terrain:o.terrain || 'none', lane:o.lane || null, x:0, y:0, blurb:o.blurb,
      variants:o.variants || null, recruits:o.recruits || null, onWin:o.onWin || null, courtOps:o.courtOps || null,
      firstCourt:!!o.firstCourt };
  }
  function indexBy(list){ var m = {}; for (var i = 0; i < list.length; i++) m[list[i].id] = list[i]; return m; }
  function getter(name, by){ return function(id){ var o = by[id]; if (!o) throw new Error(name + ': 없는 id ' + id); return o; }; }

  var NODES = [], i;
  for (i = 0; i < RAW.length; i++) NODES.push(mk(RAW[i]));
  var nodeById = indexBy(NODES);
  var terrainById = indexBy(TERRAINS);

  var ACTS = [null];
  for (i = 0; i < ACT_DEFS.length; i++) {
    var d = ACT_DEFS[i];
    ACTS.push({ act:d.act, no:d.no, name:d.name, title:d.title, period:d.period, bg:d.bg, cols:[], lanes:d.lanes, endEvent:d.endEvent });
  }
  for (i = 0; i < NODES.length; i++) {
    var n = NODES[i], a = ACTS[n.act];
    while (a.cols.length < n.col) a.cols.push([]);
    a.cols[n.col - 1].push(n.id);
  }
  function layout(){
    for (var act = 1; act < ACTS.length; act++) {
      var a = ACTS[act];
      for (var c = 0; c < a.cols.length; c++) {
        var groups = a.lanes ? { sea:[], land:[] } : { mid:[] };
        for (var k = 0; k < a.cols[c].length; k++) { var nd = nodeById[a.cols[c][k]]; groups[a.lanes ? nd.lane : 'mid'].push(nd); }
        for (var g in groups) {
          var arr = groups[g], base = g === 'sea' ? LAYOUT.ySea : g === 'land' ? LAYOUT.yLand : LAYOUT.yMid;
          var spread = a.lanes ? LAYOUT.yLaneSpread : LAYOUT.ySpread;
          for (var j = 0; j < arr.length; j++) {
            arr[j].x = LAYOUT.x0 + c * LAYOUT.xGap;
            arr[j].y = Math.floor(base + (j - (arr.length - 1) / 2) * spread);
          }
        }
      }
    }
  }
  layout();

  /* ------------------------------------------------------------ 조회 */
  function laneFilter(ids, lane){ return ids.filter(function(id){ return nodeById[id].lane === lane; }); }
  // 같은 막 다음 열 전부(2막은 같은 lane 만). 마지막 열이면 []
  function next(nodeId, flags){
    var n = nodeById[nodeId]; if (!n) throw new Error('MAPDATA: 없는 id ' + nodeId);
    var a = ACTS[n.act];
    if (n.col >= a.cols.length) return [];
    var ids = a.cols[n.col].slice();
    return a.lanes ? laneFilter(ids, n.lane) : ids;
  }
  // 그 막 열1. 2막은 flags.lane2 가 정해져 있으면 그 길만, 아니면 두 길 모두(여기서 길을 고른다)
  function first(act, flags){
    var a = ACTS[act]; if (!a) throw new Error('MAPDATA: 없는 막 ' + act);
    var ids = a.cols[0].slice();
    var lane = flags && flags.lane2;
    if (a.lanes && (lane === 'sea' || lane === 'land')) ids = laneFilter(ids, lane);
    return ids;
  }
  function colIds(act, col, lane){ var ids = ACTS[act].cols[col - 1] || []; return lane ? laneFilter(ids, lane) : ids.slice(); }

  /* ------------------------------------------------------------ 자가 검사 */
  function walkOps(ops, where, errors){
    if (!ops) return;
    if (!Array.isArray(ops)) { errors.push(where + ': ops 가 배열이 아님'); return; }
    for (var k = 0; k < ops.length; k++) {
      var op = ops[k];
      if (!op || typeof op.op !== 'string' || RUN_OPS.indexOf(op.op) < 0) { errors.push(where + '[' + k + ']: 판 op 아님 ' + (op && op.op)); continue; }
      if (op.op === 'cond') { walkOps(op.then, where + '.then', errors); walkOps(op.else, where + '.else', errors); }
      if (op.op === 'battle') { walkOps(op.onWin, where + '.onWin', errors); if (op.enc && !ID_RE.test(op.enc)) errors.push(where + ': enc 형식 ' + op.enc); }
      if ((op.op === 'relic' || op.op === 'recruit' || op.op === 'leave') && !ID_RE.test(String(op.id))) errors.push(where + ': id 형식 ' + op.id);
    }
  }
  function selfTest(){
    var errors = [], seen = {}, k, j, nd;
    var COLS_EXPECT = [0, 7, 8, 8, 6, 7, 6, 7], total = 0;
    // 막·열 수
    if (ACTS.length !== 8) errors.push('막 수 ' + (ACTS.length - 1));
    for (k = 1; k < ACTS.length; k++) {
      var a = ACTS[k];
      if (a.act !== k) errors.push('acts[' + k + '].act 불일치');
      if (a.cols.length !== COLS_EXPECT[k]) errors.push(k + '막 열 수 ' + a.cols.length + ' ≠ ' + COLS_EXPECT[k]);
      total += a.cols.length;
      for (j = 0; j < a.cols.length; j++) {
        if (a.cols[j].length < 1) errors.push(k + '막 열' + (j + 1) + ' 비어 있음');
        if (a.lanes && (laneFilter(a.cols[j], 'sea').length < 1 || laneFilter(a.cols[j], 'land').length < 1)) errors.push(k + '막 열' + (j + 1) + ' lane 하나가 비어 있음');
      }
      if (!a.no || !a.name || !a.title || !a.period || !a.bg) errors.push(k + '막 제목·시기·bg 누락');
      if (a.endEvent) for (var ek in a.endEvent) if (!EV_RE.test(a.endEvent[ek])) errors.push(k + '막 endEvent 형식 ' + a.endEvent[ek]);
    }
    if (total !== 49) errors.push('열 합계 ' + total + ' ≠ 49');
    // 마디 하나씩
    for (k = 0; k < NODES.length; k++) {
      nd = NODES[k]; var w = nd.id;
      if (seen[nd.id]) errors.push(w + ': id 중복'); seen[nd.id] = true;
      var pre = nd.act === 2 ? 'a2' + (nd.lane === 'sea' ? 's' : 'l') + '_' : 'a' + nd.act + '_';
      if (!ID_RE.test(nd.id) || nd.id.indexOf(pre) !== 0) errors.push(w + ': id 규칙(' + pre + ') 위반');
      if (KINDS.indexOf(nd.kind) < 0) errors.push(w + ': kind ' + nd.kind);
      if (DOS.indexOf(nd.do) < 0) errors.push(w + ': do ' + nd.do);
      if (!DATE_RE.test(nd.date)) errors.push(w + ': 날짜 형식 ' + nd.date);
      if (!nd.name || !nd.blurb) errors.push(w + ': name·blurb 누락');
      if (!terrainById[nd.terrain]) errors.push(w + ': terrain ' + nd.terrain);
      if (nd.x < 0 || nd.x > LAYOUT.w || nd.y < 0 || nd.y > LAYOUT.h) errors.push(w + ': 좌표 밖 ' + nd.x + ',' + nd.y);
      if ((nd.act === 2) !== (nd.lane !== null)) errors.push(w + ': lane 은 2막에만');
      if (nd.lane !== null && nd.lane !== 'sea' && nd.lane !== 'land') errors.push(w + ': lane ' + nd.lane);
      if (nd.type !== null && TYPES.indexOf(nd.type) < 0) errors.push(w + ': type ' + nd.type);
      if (nd.enc !== null && !ID_RE.test(nd.enc)) errors.push(w + ': enc 형식 ' + nd.enc);
      if (nd.bossEnc !== null && !ID_RE.test(nd.bossEnc)) errors.push(w + ': bossEnc 형식 ' + nd.bossEnc);
      if (nd.eventId !== null && !EV_RE.test(nd.eventId)) errors.push(w + ': eventId 형식 ' + nd.eventId);
      if (nd.courtEvent !== null && !EV_RE.test(nd.courtEvent)) errors.push(w + ': courtEvent 형식 ' + nd.courtEvent);
      var isFight = nd.kind === 'fight' || nd.kind === 'elite';
      if (isFight && (!nd.type || !nd.enc)) errors.push(w + ': 전투 마디에 type·enc 필요');
      if ((nd.kind === 'elite') !== nd.elite) errors.push(w + ': elite 플래그와 kind 불일치');
      if (nd.kind === 'boss' && (!nd.bossEnc || !nd.type)) errors.push(w + ': 결전 마디에 bossEnc·type 필요');
      if (nd.kind === 'event' && !nd.eventId) errors.push(w + ': 사건 마디에 eventId 필요');
      if (nd.kind === 'court' && !Array.isArray(nd.recruits)) errors.push(w + ': 조정 마디에 recruits 배열 필요');
      if (nd.kind !== 'court' && (nd.courtEvent || nd.courtOps || nd.firstCourt)) errors.push(w + ': 조정 필드는 court 에만');
      if (nd.recruits) for (j = 0; j < nd.recruits.length; j++) if (!ID_RE.test(nd.recruits[j])) errors.push(w + ': recruits 형식 ' + nd.recruits[j]);
      walkOps(nd.onWin, w + '.onWin', errors);
      if (nd.courtOps) for (var ck in nd.courtOps) { if (['report','recruit','request'].indexOf(ck) < 0) errors.push(w + ': courtOps 키 ' + ck); walkOps(nd.courtOps[ck], w + '.courtOps.' + ck, errors); }
      if (nd.variants) for (j = 0; j < nd.variants.length; j++) {
        var v = nd.variants[j];
        if (!v.if || typeof v.if !== 'object' || !v.patch || typeof v.patch !== 'object') errors.push(w + ': variants[' + j + '] if·patch 필요');
        else { for (var pk in v.patch) if (!(pk in nd)) errors.push(w + ': variants patch 키 ' + pk + ' 는 마디 필드가 아님');
          if (v.patch.eventId && !EV_RE.test(v.patch.eventId)) errors.push(w + ': variants eventId 형식');
          if (v.patch.date && !DATE_RE.test(v.patch.date)) errors.push(w + ': variants 날짜 형식'); walkOps(v.patch.onWin, w + '.variants.onWin', errors); }
      }
      // 결전·어전회의 바로 앞 열은 조정
      if (nd.kind === 'boss' || nd.kind === 'council') {
        if (nd.col < 2) errors.push(w + ': 결전이 열1');
        else { var prev = colIds(nd.act, nd.col - 1, nd.lane); if (!prev.length) errors.push(w + ': 앞 열 없음');
          for (j = 0; j < prev.length; j++) if (nodeById[prev[j]].kind !== 'court') errors.push(w + ': 앞 열 ' + prev[j] + ' 가 court 아님'); }
      }
      // 연결: 2막은 lane 을 넘지 않는다. 마지막 열만 []
      var nx = next(nd.id, {});
      if (nd.col === ACTS[nd.act].cols.length) { if (nx.length) errors.push(w + ': 마지막 열인데 next 있음'); }
      else { if (!nx.length) errors.push(w + ': next 비어 있음'); for (j = 0; j < nx.length; j++) if (nd.lane !== nodeById[nx[j]].lane) errors.push(w + ': lane 을 넘는 연결 ' + nx[j]); }
    }
    // 지침 마디
    var must = { a1_busan:'fight', a1_hanseong:'court', a1_boss:'boss', a2s_hansan:'boss', a2l_jinju:'boss', a2l_gyeongju:'event', a3_uiju:'court', a3_haengju:'boss', a3_hanseong:'event',
      a4_council:'council', a5_busan_sea:'fight', a5_jiksan:'boss', a6_uldolmok:'boss', a7_noryang:'boss' };
    for (var mid in must) { if (!nodeById[mid]) errors.push('지침 마디 없음 ' + mid); else if (nodeById[mid].kind !== must[mid]) errors.push(mid + ': kind ' + must[mid] + ' 이어야 함'); }
    if (nodeById.a3_uiju && (!nodeById.a3_uiju.firstCourt || nodeById.a3_uiju.courtEvent !== 'E12')) errors.push('a3_uiju: firstCourt·E12');
    var ce = { a4_hanseong_court:'E19', a6_usuyeong_court:'E25', a7_gogeumdo_court:'E28' };
    for (var cid in ce) if (!nodeById[cid] || nodeById[cid].courtEvent !== ce[cid]) errors.push(cid + ': courtEvent ' + ce[cid]);

    // 이 패를 낸 뒤 다음 적 턴에 실제로 받을 피해(앞 적의 접근·진형 소모까지 반영). UI: 「받을 피해 27 → 12」
    out.incomingAfter = (c.phase === 'player') ? intentPreview(c).reduce(function (a, r) { return a + (r.dmg || 0); }, 0) : 0;
    return out;
  }

  /* ================================================================ 생성·결과 */
  function create(req) {
    Core.assert(req && Array.isArray(req.deck), 'Combat.create: req.deck 이 없다');
    var m = Core.clone(req.mods || {});
    var type = req.type || 'field';
    var st = {
      seed: req.seed, rng: Core.rngNew(req.seed), uidCounter: req.uidCounter || 0,
      act: req.act || 1, nodeId: req.nodeId || null, type: type, terrain: req.terrain || 'none', do: req.do || null,
      encId: req.encId || null, elite: !!req.elite, boss: !!req.boss,
      flags: Core.clone(req.flags || {}), flagsOut: {}, mods: m,
      turn: 1, phase: 'player', won: null, dist: 1, startDist: 1, dryRun: false, tide: null,
      player: { hp: req.hp, maxHp: req.maxHp || req.hp, energy: 0, energyMax: B.ENERGY, block: 0, wall: 0, status: {}, buffs: [], pending: [],
        leader: req.leader || null, deputies: (req.deputies || []).slice(), special: req.special || null },
      ration: req.ration || 0, suspicion: req.suspicion || 0, suspicionDelta: 0,
      draw: [], hand: [], discard: [], exhaust: [], playing: null, playForceExhaust: false,
      enemies: [], enemyWall: 0, enemyWall0: 0, spawned: {}, reinforce: null, enemySignal: 0, enemySignalNext: 0, noAdvanceLeft: 0,
      waves: null, wave: 1, handlers: [], mods_: [], delayed: [],
      cardsPlayedThisTurn: 0, drawHooksThisTurn: 0, choice: null,
      rescue: { used: false, disabled: false, pending: null, resume: null },
      generalsLost: [], deckChanges: [], relics: (req.relics || []).slice(), relicUp: Core.clone(req.relicUp || {}),
      expect: null, expectIdx: 0, log: [],
      stats: { turns: 0, dmgDealt: 0, dmgTaken: 0, cardsPlayed: {}, edictsPlayed: 0, distTurns: [0, 0, 0], pushes: 0,
        intentChecks: { ok: 0, bad: 0 }, enemiesKilled: 0, turnCapHit: false, wavesCleared: 0 },
      tutorial: m.tutorial || null
    };
    // 덱
    st.draw = req.deck.map(function (d) { return { uid: d.uid, id: d.id, up: !!d.up, generated: false, marked: false, tmpCost: null }; });
    Core.shuffle(st.rng, st.draw);
    // 거리·성벽
    var DEF_DIST = { field: 1, siege: 0, assault: 1, naval: 0 };
    st.dist = st.startDist = (m.startDist != null) ? m.startDist : (DEF_DIST.hasOwnProperty(type) ? DEF_DIST[type] : 1);
    st.player.wall = (m.wall != null) ? m.wall : (type === 'siege' ? B.SIEGE_WALL : 0);
    st.enemyWall = st.enemyWall0 = (m.enemyWall != null) ? m.enemyWall : (type === 'assault' ? B.ASSAULT_ENEMY_WALL : 0);
    if (m.startBlock) st.player.block = m.startBlock;
    if (m.momentum) st.player.status.momentum = m.momentum;
    st.noAdvanceLeft = m.noAdvanceTurns || 0;
    if (m.tide) st.tide = { phase: 'ebb', left: B.TIDE.period };
    // 적
    (req.enemies || []).forEach(function (e) {
      var inst = prepEnemy(st, Core.clone(e));
      st.enemies.push(inst);
      st.spawned[inst.id] = (st.spawned[inst.id] || 0) + 1;
    });
    if (req.waves && req.waves.length) {
      st.waves = Core.clone(req.waves);
      var w0 = st.waves[0];
      if (w0.mods) { for (var k in w0.mods) st.mods[k] = w0.mods[k]; }
      if (w0.reinforce) st.reinforce = { every: w0.reinforce.every, enemies: w0.reinforce.enemies.slice(), cap: w0.reinforce.cap, startTurn: null, timer: 0 };
    }
    if (req.reinforce) {
      var R = req.reinforce;
      st.reinforce = { every: m.reinforceEvery || R.every, enemies: R.enemies.slice(), cap: R.cap, startTurn: R.startTurn != null ? R.startTurn : null, timer: 0 };
    }
    st.rescue.disabled = !!st.mods.rescueDisabled;
    // 패시브·기물·편성 훅
    function addPassive(p, src) {
      if (!p) return;
      (p.handlers || []).forEach(function (h) { addHandler(st, h, src); });
      (p.mods || []).forEach(function (mm) { addMod(st, mm, src); });
    }
    if (req.leader && !m.wonGyun && GENERALS.leaders.byId[req.leader]) addPassive(GENERALS.leaders.get(req.leader).passive, { kind: 'leader', id: req.leader });
    st.player.deputies.forEach(function (id) { if (GENERALS.deputies.byId[id]) addPassive(GENERALS.deputies.get(id).passive, { kind: 'deputy', id: id }); });
    if (req.special && GENERALS.deputies.byId[req.special]) addPassive(GENERALS.deputies.get(req.special).passive, { kind: 'special', id: req.special });
    st.relics.forEach(function (id) {
      var r = GENERALS.relics.byId[id]; if (!r) return;
      var hs = (st.relicUp[id] && r.upHandlers) ? r.upHandlers : r.handlers;
      (hs || []).forEach(function (h) { addHandler(st, h, { kind: 'relic', id: id }); });
      (r.mods || []).forEach(function (mm) { addMod(st, mm, { kind: 'relic', id: id }); });
    });
    (req.handlers || []).forEach(function (h) { addHandler(st, h, { kind: 'encounter', id: req.encId || null }); });
    (m.dmgBonus || []).forEach(function (d) { addMod(st, { mod: 'dmgBonus', n: d.n, if: d.if || null }, { kind: 'req', id: 'dmgBonus' }); });
    if (m.wonGyun) addMod(st, { mod: 'atkPct', n: B.WON_GYUN_PCT }, { kind: 'req', id: 'wonGyun' });
    if (m.passivesOff) st.player.buffs.push({ id: 'passivesOff', n: 1, turns: null });
    // 시작
    fire(st, 'onBattleStart', {});
    (m.startHand || []).forEach(function (h) {
      var inst = mkInst(st, h.id, !!h.up, true);
      if (h.free) inst.tmpCost = 0;
      (st.hand.length < B.HAND_MAX ? st.hand : st.discard).push(inst);
    });
    if (m.extraDraw) st.player.pending.push({ kind: 'draw', n: m.extraDraw, id: null, turns: null });
    if (st.phase !== 'done') startTurn(st);
    return st;
  }
  function result(st) {
    var ships = 0;
    st.enemies.forEach(function (e) { if (!e.dead && e.tags.indexOf('ship') >= 0) ships++; });
    var stats = Core.clone(st.stats);
    stats.turns = st.turn; stats.shipsLeft = st.type === 'naval' ? ships : null;
    return {
      won: st.won === true, hp: Math.max(0, st.player.hp), maxHp: st.player.maxHp, ration: st.ration,
      suspicionDelta: st.suspicionDelta, turns: st.turn, flagsOut: Core.clone(st.flagsOut), deckChanges: Core.clone(st.deckChanges),
      generalsLost: st.generalsLost.slice(), rescued: st.rescue.used, stats: stats, log: st.log.slice(-30)
    };
  }
  function applyOps(st, ops, ctx) { return runSync(st, ops, ctx || {}); }

  /* ================================================================ 자가 검사 */
  function botStep(st, r) {
    if (st.phase === 'choose') { var idxs = []; for (var i = 0; i < Math.min(st.choice.n, st.choice.candidates.length); i++) idxs.push(i); return { f: 'choose', a: [idxs] }; }
    if (st.phase === 'rescue') return { f: 'chooseRescue', a: [st.rescue.pending[st.rescue.pending.length - 1]] };
    var mv = legalMoves(st);
    if (!mv.length || Core.rand(r) < 0.12) return { f: 'endTurn', a: [] };
    var m = Core.pick(r, mv);
    return { f: 'play', a: [m.handIdx, m.targets ? Core.pick(r, m.targets) : null] };
  }
  function apply(st, step) { return api[step.f].apply(null, [st].concat(step.a)); }
  function testReq(seed, encId, leader, deps, relics, act, flagMods) {
    var deck = CARDS.startDeck(leader).map(function (id, i) { return { uid: 'u' + (i + 1), id: id, up: i % 4 === 0 }; });
    ['pyeonjeon', 'jochong', 'discipline', 'regroup', 'turtle_ship', 'crane_wing', 'seven_hundred', 'rowers', 'jincheonroe', 'request_troops',
     'archer_ambush', 'scarecrow', 'counter_mound', 'hide', 'edict_advance', 'edict_blame', 'edict_envy', 'twelve_ships', 'pilsa_jeuksaeng']
      .forEach(function (id, i) { deck.push({ uid: 'u' + (100 + i), id: id, up: false }); });
    var b = ENEMIES.build(encId, act || 1, Core.rngNew(seed));
    var mods = b.mods || {}; if (flagMods) for (var k in flagMods) mods[k] = flagMods[k];
    return { seed: seed, uidCounter: 500, act: act || 1, nodeId: 'test', type: b.type, terrain: 'none', do: '경상', encId: encId, elite: b.elite, boss: b.boss,
      enemies: b.enemies, waves: b.waves, reinforce: b.reinforce, handlers: b.handlers, mods: mods,
      deck: deck, relics: relics || [], relicUp: {}, leader: leader, deputies: deps || [], special: null,
      hp: 60, maxHp: 80, ration: 40, suspicion: 2, flags: { mingDiscount: 0 } };
  }
  function selfTest() {
    var errors = [], i;
    function err(s) { errors.push(s); }
    if (typeof CARDS === 'undefined' || typeof ENEMIES === 'undefined' || typeof GENERALS === 'undefined') return { ok: false, errors: ['데이터 전역 없음'] };
    var mute = Core.bus.count('fx');
    var cases = [
      ['p1_b', 'yi', [], [], 1], ['tut_busan', 'gwon', ['yi_jeongam'], ['hwacha_relic'], 1], ['boss_konishi', 'yi', ['gwon', 'jo_heon'], ['jingbirok'], 1],
      ['boss_jinju1', 'gwon', ['kim_simin', 'hwang_jin'], ['jinju_drum', 'seoae_brush'], 2], ['boss_haengju', 'yi', ['gwon', 'hwang_jin'], ['haengju_ash'], 3],
      ['boss_myeongnyang', 'yi', ['yi_eokgi'], ['myeongnyang_chain', 'hansan_drum'], 6], ['boss_noryang', 'gwon', ['yi', 'jeong_munbu'], ['turtle_blueprint'], 7],
      ['boss_jiksan', 'yi', ['jeong_munbu'], ['chains'], 5], ['pyongyang', 'gwon', [], ['jincheonroe_relic'], 3], ['gyeonnaeryang', 'yi', [], [], 2],
      ['p2_land_d', 'gwon', ['jo_heon'], ['obangnang'], 2], ['ulsan', 'yi', ['gwon'], [], 7], ['boss_wakizaka', 'yi', ['yi_eokgi', 'gwon'], [], 2]
    ];
    var wins = 0, loses = 0, turnsTotal = 0;
    for (var s = 1; s <= 20; s++) {
      for (var c = 0; c < cases.length; c++) {
        var cs = cases[c], tag = cs[0] + '#' + s;
        try {
          var st = create(testReq(s * 31 + c, cs[0], cs[1], cs[2], cs[3], cs[4]));
          var r = Core.rngNew('bot' + s + c), steps = 0;
          while (st.phase !== 'done' && steps < 800) {
            if (steps === 25) {                                // 결정성: 복제본과 원본에 같은 수열을 넣는다
              var bcl = Core.clone(st), seq = [];
              for (var q = 0; q < 30 && st.phase !== 'done'; q++) { var stp = botStep(st, r); seq.push(stp); apply(st, stp); }
              for (q = 0; q < seq.length; q++) apply(bcl, seq[q]);
              if (JSON.stringify(st) !== JSON.stringify(bcl)) { err(tag + ': JSON 왕복 뒤 같은 입력이 다른 결과'); break; }
              steps += seq.length; continue;
            }
            var before = JSON.stringify(st);
            if (st.phase === 'player') { intentPreview(st); var mv = legalMoves(st); if (mv.length) preview(st, mv[0].handIdx, mv[0].targets ? mv[0].targets[0] : null); }
            if (JSON.stringify(st) !== before) { err(tag + ': 미리 보기가 원본을 바꿨다'); break; }
            var res = apply(st, botStep(st, r));
            if (res && res.ok === false && st.phase === 'player') { err(tag + ': 합법 수가 거부됨 ' + res.reason); break; }
            steps++;
          }
          if (st.phase !== 'done') err(tag + ': 800수 안에 끝나지 않음(turn ' + st.turn + ')');
          if (st.stats.intentChecks.bad > 0) err(tag + ': 의도≠실제 ' + st.stats.intentChecks.bad + '건');
          if (st.won) wins++; else loses++;
          turnsTotal += st.turn;
          var res2 = result(st);
          if (JSON.stringify(Core.clone(res2)) !== JSON.stringify(res2)) err(tag + ': 결과가 JSON 왕복 불가');
        } catch (e) { err(tag + ': 예외 ' + ((e && e.stack) || e).toString().split('\n').slice(0, 3).join(' | ')); }
        if (errors.length > 12) return { ok: false, errors: errors };
      }
    }
    if (Core.bus.count('fx') !== mute) err('fx 구독 수가 변했다');
    return { ok: errors.length === 0, errors: errors, wins: wins, loses: loses, avgTurns: Math.round(turnsTotal / (wins + loses) * 10) / 10 };
  }

  var api = {
    create: create, cardInfo: cardInfo, needsTarget: needsTarget, legalMoves: legalMoves, play: play, choose: choose,
    endTurn: endTurn, chooseRescue: chooseRescue, preview: preview, intentPreview: intentPreview, intentOf: intentOf,
    result: result, applyOps: applyOps, evalCond: evalCond, eff: eff, alive: alive, selfTest: selfTest
  };
  return api;
})();

</script>
<script>
/* ===== src/08_run.js ===== */
/* ===== 08_run.js — 판 상태기: 마디 진행·보상·장계 분배·의심 문턱·칠천량·어전회의·결말·점수·저장 (DOM 없음) ===== */
// 계약서 §6 이 정본. 구현 방식:
//  - G.queue 에는 화면 프롬프트({kind:'map'|'event'|…})와 내부 작업({kind:'_task', task, args})이 섞여 있다.
//    advance() 가 내부 작업을 차례로 실행하고, 처음 만나는 프롬프트를 G.prompt 로 세운다. 전부 JSON 이라 저장된다.
//  - 앞 답에 따라 뒤 내용이 정해지는 것(장계 분배 → 강화 장수, 전투 결과 → 보상)은 내부 작업이 그때 만든다.
//  - Run.applyOps 는 즉시 효과를 적용하고, 화면이 필요한 op(battle·offer·choose 강화·자리 찬 recruit)는 항목으로 모아 큐 앞에 넣는다.
//  - 전투 요청(req)은 battle 프롬프트가 설 때 만든다(그 순간의 덱·병력으로). 그때 G.rng 를 정확히 한 번 시드로 쓴다.
// TODO(통합): UI 는 Run.current() 의 kind 별 화면을 그리고 Run.answer(a) 로 답한다. battle 이면 UIBattle 이 Combat 을 돌린 뒤 {result}.
var Run = (function () { 'use strict';

  var B = Core.BAL;
  var G = null;
  var pend = null;                 // applyOps 가 모으는 후속 항목(호출 동안만)
  var COMBAT_OPS = { dmg: 1, block: 1, push: 1, pull: 1, draw: 1, energy: 1, status: 1, stun: 1, buff: 1, exhaustHand: 1, discard: 1, exhaust: 1, retrieve: 1, mark: 1, delay: 1, stripBlock: 1 };
  var PROMPT_KINDS = { map: 1, battle: 1, event: 1, shop: 1, camp: 1, court: 1, reward: 1, merit: 1, pickCard: 1, pickGeneral: 1, scroll: 1, actEnd: 1, council: 1, ending: 1 };

  /* ================================================================ 도우미 */
  function T() { return (typeof TXT !== 'undefined') ? TXT : null; }
  function task(name, args) { return { kind: '_task', task: name, args: args || {} }; }
  function front(items) { if (items && items.length) G.queue = items.concat(G.queue); }
  function clamp(v, a, b) { return Core.clamp(v, a, b); }
  function card(id) { return CARDS.get(id); }
  function opsText(ops) { var X = T(); try { return (X && X.opsText) ? X.opsText(ops || []) : ''; } catch (e) { return ''; } }
  function inList(v, x) { return Array.isArray(v) ? v.indexOf(x) >= 0 : v === x; }
  function range(o, x) {
    if (o === null || o === undefined) return true;
    if (typeof o === 'number') return x === o;
    if (o.lte != null && x > o.lte) return false;
    if (o.gte != null && x < o.gte) return false;
    return true;
  }
  function upgradable(c) { var d = card(c.id); return !c.up && d.plus && Object.keys(d.plus).length > 0; }
  function deputyName(id) { var d = GENERALS.deputies.byId[id]; return d ? d.name : id; }
  function actLog() {
    if (!G.actLog[G.act]) G.actLog[G.act] = { fights: [], suspTrace: [G.suspicion], gained: { cards: [], relics: [] }, choices: [], compare: [], dates: [] };
    return G.actLog[G.act];
  }
  function trace() { var l = actLog(); if (l.suspTrace[l.suspTrace.length - 1] !== G.suspicion) l.suspTrace.push(G.suspicion); }

  /* ================================================================ 조건 (판 맥락) */
  function evalCond(c) {
    if (!c) return true;
    for (var k in c) {
      if (!Object.prototype.hasOwnProperty.call(c, k)) continue;
      var v = c[k], ok;
      switch (k) {
        case 'leader': ok = inList(v, G.leader); break;
        case 'lane': ok = inList(v, G.flags.lane2); break;
        case 'act': ok = inList(v, G.act); break;
        case 'actGte': ok = G.act >= v; break;
        case 'ration': ok = range(v, G.ration); break;
        case 'suspicion': ok = range(v, G.suspicion); break;
        case 'hpPct': ok = range(v, Math.floor(G.hp * 100 / G.maxHp)); break;
        case 'slotsFree': ok = (G.deputies.length < B.DEPUTY_SLOTS) === !!v; break;
        case 'hasCard': ok = G.deck.some(function (d) { return d.id === v; }); break;
        case 'hasRelic': ok = G.relics.indexOf(v) >= 0; break;
        case 'hasDeputy': ok = G.deputies.indexOf(v) >= 0 || G.special === v; break;
        case 'noDeputy': ok = G.deputies.indexOf(v) < 0 && G.special !== v; break;
        case 'deckTagCount': ok = range(v, G.deck.filter(function (d) { return (card(d.id).tags || []).indexOf(v.tag) >= 0; }).length); break;
        case 'flag':
          ok = true;
          for (var fk in v) {
            var cur = G.flags[fk]; if (cur === undefined || cur === null) cur = false;
            if (v[fk] === false ? !!cur : cur !== v[fk]) { ok = false; break; }
          }
          break;
        default: ok = false;
      }
      if (!ok) return false;
    }
    return true;
  }

  /* ================================================================ 덱·부장·기물 */
  function addCard(id, up) {
    var c = { uid: Core.nextUid(G), id: id, up: !!up };
    G.deck.push(c);
    actLog().gained.cards.push(id);
    return c;
  }
  function removeUid(uid) { for (var i = 0; i < G.deck.length; i++) if (G.deck[i].uid === uid) { G.deck.splice(i, 1); return true; } return false; }
  function removeOneId(id) { for (var i = G.deck.length - 1; i >= 0; i--) if (G.deck[i].id === id) { G.deck.splice(i, 1); return true; } return false; }
  function ensureDeckMin() {
    var k = 0;
    while (G.deck.length < B.DECK_MIN && k < 40) { addCard(k % 2 === 0 ? 'bowstring' : 'spear_wall', false); k++; }
  }
  function edictCount() { return G.deck.filter(function (d) { return card(d.id).type === 'edict'; }).length; }
  function gainRelic(id, up) {
    if (!GENERALS.relics.byId[id]) return;
    if (up) G.relicUp[id] = true;
    if (G.relics.indexOf(id) >= 0) return;
    G.relics.push(id);
    actLog().gained.relics.push(id);
    var r = GENERALS.relics.get(id);
    if (r.onAcquire && r.onAcquire.length) applyOps(r.onAcquire, {});
  }
  function addDeputy(id) {
    G.deputies.push(id);
    var d = GENERALS.deputies.byId[id];
    if (d && d.card) addCard(d.card, false);
  }
  function leave(id, dead) {
    var i = G.deputies.indexOf(id);
    if (i < 0) return false;
    G.deputies.splice(i, 1);
    var d = GENERALS.deputies.byId[id];
    if (d && d.card) removeOneId(d.card);
    if (dead) { if (G.dead.indexOf(id) < 0) G.dead.push(id); }
    else if (G.away.indexOf(id) < 0) G.away.push(id);
    ensureDeckMin();
    return true;
  }
  function recruit(id, o) {
    o = o || {};
    if (!GENERALS.deputies.byId[id]) return;
    if (id === G.leader || G.deputies.indexOf(id) >= 0 || G.special === id || G.dead.indexOf(id) >= 0) return;
    if (o.special) { G.special = id; var d = GENERALS.deputies.get(id); if (d.card) addCard(d.card, false); return; }
    var ai = G.away.indexOf(id); if (ai >= 0) G.away.splice(ai, 1);
    var full = G.deputies.length >= B.DEPUTY_SLOTS;
    if (!full && !o.optional) { addDeputy(id); return; }
    var item = { kind: 'pickGeneral', reason: full ? 'replace' : 'optional', incoming: GENERALS.deputies.get(id),
      candidates: full ? G.deputies.map(function (x) { return { general: GENERALS.deputies.get(x) }; }) : [{ general: GENERALS.deputies.get(id) }] };
    if (pend) pend.push(item); else front([item]);
  }

  /* ================================================================ op (판 맥락) */
  function applyOps(ops, ctx) {
    ctx = ctx || {};
    var outer = pend === null;
    if (outer) pend = [];
    try {
      var queue = (ops || []).slice();
      while (queue.length) {
        var op = queue.shift();
        if (!op) continue;
        if (COMBAT_OPS[op.op]) throw new Error('Run: 전투 전용 op ‘' + op.op + '’를 판에서 만났다');
        applyOp(op, ctx, queue);
      }
    } finally {
      if (outer) { var items = pend; pend = null; front(items); }
    }
  }
  function applyOp(op, ctx, queue) {
    switch (op.op) {

          if (S.removeUsed) throw new Error('Run: 카드 버리기는 한 번뿐');
          var d = G.deck.filter(function (x) { return x.uid === a.remove; })[0]; if (!d) throw new Error('Run: 없는 카드');
          var price = card(d.id).type === 'edict' ? discounted(B.SHOP.removeEdict) : discounted(B.SHOP.remove);
          if (G.ration < price) throw new Error('Run: 군량 부족');
          G.ration -= price; removeUid(d.uid); S.removeUsed = true; ensureDeckMin();
        } else throw new Error('Run: 시장 답이 잘못됨');
        front([{ kind: 'shop' }]);
        break;
      }
      case 'camp': {
        var opt = p.options.filter(function (o) { return o.id === a.pick; })[0];
        if (!opt || !opt.enabled) throw new Error('Run: 고를 수 없는 군영 선택');
        if (a.pick === 'rest') applyOps([{ op: 'hp', pct: B.CAMP.restPct }], {});
        else if (a.pick === 'farm') G.ration += B.CAMP.farm;
        else if (a.pick === 'train') front([pickCardItem('train', 1, G.deck.filter(upgradable), false)]);
        break;
      }
      case 'court': {
        var nd = MAPDATA.nodes.byId[p.nodeId], co = (nd && nd.courtOps) || {};
        var o2 = p.options.filter(function (o) { return o.id === a.pick; })[0];
        if (!o2 || !o2.enabled) throw new Error('Run: 고를 수 없는 조정 선택');
        if (a.pick === 'report') applyOps([{ op: 'suspicion', n: B.COURT.report }].concat(co.report || []), {});
        else if (a.pick === 'recruit') {
          var id = a.id || (p.recruits[0] && p.recruits[0].general.id);
          if (!p.recruits.some(function (r) { return r.general.id === id; })) throw new Error('Run: 영입 후보가 아님 ' + id);
          applyOps([{ op: 'recruit', id: id }].concat(co.recruit || []), {});
        } else if (a.pick === 'request') {
          var cid = a.cardId || (p.mingCards[0] && p.mingCards[0].id);
          if (!p.mingCards.some(function (c) { return c.id === cid; })) throw new Error('Run: 명군 요청 후보가 아님 ' + cid);
          G.ration -= B.COURT.requestCost; addCard(cid, false);
          if (co.request) applyOps(co.request, {});
        }
        actLog().choices.push({ event: 'court', title: '조정', choice: o2.text, act: G.act });
        break;
      }
      case 'reward': {
        if (a.cardIdx === null || a.cardIdx === undefined) G.ration += B.RATION_SKIP;
        else {
          var rid = p.cardIds[a.cardIdx]; if (!rid) throw new Error('Run: 없는 보상 카드');
          addCard(rid, false); G.stats.cardsPicked[rid] = (G.stats.cardsPicked[rid] || 0) + 1;
        }
        break;
      }
      case 'merit': applyMerit(a.alloc || p.defaults); break;
      case 'pickCard': {
        var picks = (a.picks || []).filter(function (i, k, arr) { return i >= 0 && i < p.candidates.length && arr.indexOf(i) === k; }).slice(0, p.n);
        if (!p.canSkip && picks.length < Math.min(p.n, p.candidates.length)) {
          for (var q = 0; picks.length < Math.min(p.n, p.candidates.length) && q < p.candidates.length; q++) if (picks.indexOf(q) < 0) picks.push(q);

          var cd = p.candidates[i];

        addDeputy(inc);
        break;
      }

      case 'council': councilAnswer(a); break;
      case 'ending': G.done = true; G.prompt = null; clearSave(); return null;
      default: throw new Error('Run: 모르는 프롬프트 ' + p.kind);
    }

    advance();
    return G.prompt;
  }

  /* ================================================================ 시작·저장 */
  function newRun(leaderId, seed) {
    Core.assert(GENERALS.leaders.byId[leaderId], 'Run.newRun: 없는 주장 ' + leaderId);
    G = {
      ver: Core.VERSION, seed: seed, rng: Core.rngNew(seed), uidCounter: 0, leader: leaderId, act: 1, nodeId: null, col: 0, path: [],
      hp: B.LEADER_HP[leaderId], maxHp: B.LEADER_HP[leaderId], ration: B.RATION_START, suspicion: B.SUSP_START[leaderId] || 0,
      deck: [], relics: [], relicUp: {}, deputies: [], special: null, away: [], dead: [],
      flags: {}, thresholds: { 4: false, 7: false, 10: false }, scoreAdj: 0,
      stats: { nodes: 0, fights: 0, elites: 0, bosses: 0, turns: 0, cardsOffered: {}, cardsPicked: {}, cardsPlayed: {}, rescued: 0, perBoss: {},
        actReached: 1, edictsPlayed: 0, pushes: 0, distTurns: [0, 0, 0], intentOk: 0, intentBad: 0, turnCapHits: 0, lastBattle: null },
      actLog: {}, prompt: null, queue: [], done: false, ending: null,
      shop: null, council: null, lastBattle: null, lastResult: null
    };
    CARDS.startDeck(leaderId).forEach(function (id) { G.deck.push({ uid: Core.nextUid(G), id: id, up: false }); });
    G.queue = [task('actStart'), { kind: 'map' }];
    advance();
    return G;
  }
  function save() { if (G && !G.done) Core.save(Core.SAVE_KEY, G); }
  function load() {
    var o = Core.load(Core.SAVE_KEY);

    G = o; return true;
  }
  function hasSave() {
    var o = Core.load(Core.SAVE_KEY);
    if (!o || o.ver !== Core.VERSION || !o.prompt) return null;
    var nd = o.nodeId ? MAPDATA.nodes.byId[o.nodeId] : null;
    return { act: o.act, leader: o.leader, date: nd ? nd.date : null, hp: o.hp, maxHp: o.maxHp };
  }
  function clearSave() { Core.clear(Core.SAVE_KEY); }

  function current() { return G ? G.prompt : null; }
  function deck() { return G ? G.deck.map(function (d) { return { uid: d.uid, id: d.id, up: d.up, card: card(d.id) }; }) : []; }
  // 디버그: 그 막의 그 열 앞까지 건너뛴다(열 1이면 막 처음)
  function jump(act, col) {
    G.act = act; G.path = []; G.queue = []; G.shop = null; G.council = null;
    G.nodeId = null; G.col = 0;
    if (col > 1) { var ids = MAPDATA.colIds(act, col - 1, act === 2 ? (G.flags.lane2 || 'sea') : null); if (ids.length) { G.nodeId = ids[0]; G.col = col - 1; G.path = [ids[0]]; } }
    if (act === 2 && !G.flags.lane2) G.flags.lane2 = 'sea';
    actLog();
    G.prompt = null; G.queue = [{ kind: 'map' }]; advance();
    return G.prompt;
  }

  /* ================================================================ 자가 검사 */
  function autoAnswer(p, r) {
    switch (p.kind) {
      case 'map': return { nodeId: Core.pick(r, p.reachable) };
      case 'event': { var en = []; p.choices.forEach(function (c, i) { if (c.enabled) en.push(i); }); return { choice: Core.pick(r, en) }; }
      case 'shop': return { leave: true };
      case 'camp': { var o = p.options.filter(function (x) { return x.enabled; }); return { pick: Core.pick(r, o).id }; }
      case 'court': { var co = p.options.filter(function (x) { return x.enabled; }); var pk = Core.pick(r, co).id; return { pick: pk, id: p.recruits[0] ? p.recruits[0].general.id : null, cardId: p.mingCards ? p.mingCards[0].id : null }; }
      case 'reward': return { cardIdx: Core.rand(r) < 0.8 ? 0 : null };
      case 'merit': return { alloc: p.slots.length === 3 ? { leader: 4, king: 3, ming: 3 } : { leader: 4, king: 6, ming: 0 } };
      case 'pickCard': return { picks: [0] };
      case 'pickGeneral': return { id: p.candidates[0] ? p.candidates[0].general.id : null };
      case 'council': return p.page === 2 ? (p.defenses[0].enabled ? { defend: 'ration' } : { verdict: true }) : { next: true };
      default: return {};
    }
  }
  function selfTest() {
    var errors = [], kinds = {};
    try {
      for (var s = 1; s <= 6; s++) {
        var leader = s % 2 ? 'yi' : 'gwon';
        newRun(leader, 1000 + s);
        var r = Core.rngNew('rt' + s), n = 0;
        while (G && !G.done && n < 3000) {
          var p = current();
          if (!p) { errors.push('seed ' + s + ': 프롬프트 없음'); break; }
          kinds[p.kind] = (kinds[p.kind] || 0) + 1;
          if (n === 40) {                                         // 직렬화 왕복
            var snap = JSON.stringify(G);
            if (JSON.stringify(JSON.parse(snap)) !== snap) errors.push('seed ' + s + ': G 가 JSON 왕복 불가');
          }
          if (p.kind === 'battle') {                              // 가짜 결과: 대체로 이긴다, 가끔 진다
            var win = Core.rand(r) < 0.97;

              suspicionDelta: 0, turns: 5, flagsOut: {}, deckChanges: [], generalsLost: [], rescued: false, stats: { turns: 5 } } });
          } else answer(autoAnswer(p, r));
          n++;
          if (G.deck.length < B.DECK_MIN && !G.done) { errors.push('seed ' + s + ': 덱 하한 미달 ' + G.deck.length); break; }
        }
        if (n >= 3000) errors.push('seed ' + s + ': 3000 프롬프트 안에 끝나지 않음 (act ' + G.act + ')');
        if (errors.length > 8) break;
      }
      // 문턱 검사
      newRun('yi', 77);
      G.suspicion = 10; suspicionCheck();
      if (!G.deck.some(function (d) { return d.id === 'edict_advance'; })) errors.push('문턱 4: 진격하라가 없다');
      if (G.suspicion !== B.PRISON_RESET) errors.push('문턱 10: 의심이 7로 돌아가지 않았다');
      // 칠천량
      newRun('yi', 78); addCard('crane_wing'); addCard('turtle_ship'); G.deputies.push('yi_eokgi');
      applyOps([{ op: 'flag', key: 'chilcheon', value: true }], {});
      while (G.queue.length && G.queue[0].kind === '_task') runTask(G.queue.shift());
      if (G.deck.some(function (d) { return (card(d.id).tags || []).indexOf('navy') >= 0 && d.id !== 'twelve_ships'; })) errors.push('칠천량: 수군 카드가 남았다');
      if (G.deck.length < B.DECK_MIN) errors.push('칠천량: 덱 하한');
      if (G.deputies.indexOf('yi_eokgi') >= 0) errors.push('칠천량: 이억기가 남았다');
    } catch (e) { errors.push('예외: ' + ((e && e.stack) || e).toString().split('\n').slice(0, 4).join(' | ')); }
    ['map', 'battle', 'event', 'reward', 'merit', 'scroll', 'actEnd', 'court', 'camp', 'shop', 'council', 'ending'].forEach(function (k) {
      if (!kinds[k]) errors.push('한 번도 나오지 않은 화면: ' + k);
    });
    G = null;
    return { ok: errors.length === 0, errors: errors, kinds: kinds };

  return {
    newRun: newRun, state: state, current: current, answer: answer, save: save, load: load, hasSave: hasSave, clearSave: clearSave,
    deck: deck, score: score, applyOps: applyOps, previewOps: previewOps, buildReq: buildReq, suspicionCheck: suspicionCheck,
    afterNode: afterNode, ensureDeckMin: ensureDeckMin, evalCond: evalCond, jump: jump, setState: setState, nodeView: nodeView, selfTest: selfTest
  };
})();

</script>
<script>
/* ===== src/09_input.js ===== */
/* ===== 09_input.js — 즉시 모드 히트존 · 포인터(마우스/터치 통합) · 키 에지 · 회전 좌표 변환 ===== */

var Input = (function () { 'use strict';
  /* ------------------------------------------------------------------ 상수 */
  var K = { SLOP: 10, W: 1280, H: 720 };   // SLOP: 톡·길게 판정이 깨지는 이동(캔버스 px). W/H: Main 이 없을 때의 캔버스 크기

    Core.bus.emit('firstInput', {});
  }

    if (api.isTouch) return;
    api.isTouch = true;
    if (env.doc && env.doc.body && env.doc.body.classList) env.doc.body.classList.add('touch');

  }
  function feedMove(cx, cy, pid, touch) {

  /* ------------------------------------------------------------------ init: DOM 은 여기서만 만진다 */
  function init(canvasEl, wrapEl, viewRef) {

      var each = function (e, fn) { var L = e.changedTouches || []; for (var i = 0; i < L.length; i++) fn(L[i]); };
      cv.addEventListener('touchstart', function (e) { each(e, function (t) { feedDown(t.clientX, t.clientY, true, t.identifier); }); if (e.cancelable) e.preventDefault(); }, NP);
      win.addEventListener('touchmove', function (e) { each(e, function (t) { feedMove(t.clientX, t.clientY, t.identifier, true); }); if (e.cancelable) e.preventDefault(); }, NP);
      win.addEventListener('touchend', function (e) { each(e, function (t) { feedUp(t.clientX, t.clientY, t.identifier); }); });
      win.addEventListener('touchcancel', function (e) { each(e, function (t) { if (t.identifier === ptr.pid) feedCancel(); }); });
    }
    cv.addEventListener('wheel', function (e) {
      var d = e.deltaY || 0;
      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 400;   // 줄·쪽 단위를 px 로
      var c = toCanvas(e.clientX, e.clientY); cur.x = c.x; cur.y = c.y;
      feedWheel(d);
      if (e.cancelable) e.preventDefault();
    }, NP);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });   // 길게 누르기가 메뉴를 띄우지 않게
    win.addEventListener('keydown', function (e) { feedKey(keyCode(e), true, e); });
    win.addEventListener('keyup', function (e) { feedKey(keyCode(e), false, e); });
    win.addEventListener('blur', function () { down = {}; keyBuf = {}; feedCancel(); });
  }

  /* ------------------------------------------------------------------ 히트존 */
  function zone(s) {
    if (!s) return null;
    var z = { id: (s.id !== undefined && s.id !== null) ? String(s.id) : null,
      x: +s.x || 0, y: +s.y || 0, w: +s.w || 0, h: +s.h || 0,
      tap: s.tap || null, long: s.long || null, down: s.down || null, drag: s.drag || null, up: s.up || null,
      wheel: s.wheel || null, cursor: s.cursor || null, enabled: s.enabled !== false };
    if (!z.id && (z.drag || z.up)) {
      warnOnce('noid:' + z.x + ',' + z.y + ',' + z.w + ',' + z.h, 'zone: drag/up 을 쓰는 영역에는 id 가 필요하다 (' + z.x + ',' + z.y + ' ' + z.w + '×' + z.h + ')');
      z.drag = null; z.up = null;
    }
    if ((z.tap || z.long) && z.enabled && (z.w < Core.BAL.TAP_MIN || z.h < Core.BAL.TAP_MIN)) api.stats.small++;
    zones.push(z);
    api.stats.zones++;
    return z;
  }
  function inside(z, x, y) { return x >= z.x && y >= z.y && x < z.x + z.w && y < z.y + z.h; }
  function hitAt(x, y) {   // 가장 위(나중 등록) 영역. enabled:false 도 돌려준다(가리기용) — 호출 쪽이 enabled 를 본다
    for (var i = zones.length - 1; i >= 0; i--) if (inside(zones[i], x, y)) return zones[i];
    return null;
  }
  function byId(id) {
    for (var i = zones.length - 1; i >= 0; i--) if (zones[i].id === id && zones[i].enabled) return zones[i];
    return null;
  }
  function wheelAt(x, y) {   // 휠은 wheel 콜백이 있는 영역만 본다(위 영역이 가리지 않는다)
    for (var i = zones.length - 1; i >= 0; i--) if (zones[i].enabled && zones[i].wheel && inside(zones[i], x, y)) return zones[i];
    return null;
  }

  /* ------------------------------------------------------------------ 프레임 */
  function begin() {
    pressed = keyBuf; keyBuf = {};
    zones = []; api.stats.zones = 0; api.stats.small = 0;
    fr.justDown = false; fr.justUp = false; fr.cancel = false; fr.downPos = null; fr.upPos = null;
    for (var i = 0; i < evq.length; i++) {
      var e = evq[i];
      if (e.k === 'down') {
        ptr.down = true; ptr.downX = e.x; ptr.downY = e.y; ptr.downT = e.t; ptr.lastX = e.x; ptr.lastY = e.y;
        ptr.moved = false; ptr.longFired = false; ptr.downKey = null;
        fr.justDown = true; fr.downPos = { x: e.x, y: e.y };
      } else {
        ptr.down = false; fr.justUp = true; fr.upPos = { x: e.x, y: e.y };
        if (e.k === 'cancel') fr.cancel = true;   // 취소는 up 이되 tap 은 아니다
      }
    }
    evq.length = 0;
    ptr.x = cur.x; ptr.y = cur.y;
    if (fr.justUp && !ptr.down) { ptr.x = fr.upPos.x; ptr.y = fr.upPos.y; }
    fr.dx = ptr.x - ptr.lastX; fr.dy = ptr.y - ptr.lastY; ptr.lastX = ptr.x; ptr.lastY = ptr.y;
    if ((ptr.down || fr.justUp) && !ptr.moved) {
      var mx = ptr.x - ptr.downX, my = ptr.y - ptr.downY;
      if (mx * mx + my * my > K.SLOP * K.SLOP) ptr.moved = true;
    }
    fr.wheel = wheelBuf; wheelBuf = 0;
    p.x = ptr.x; p.y = ptr.y; p.down = ptr.down; p.justDown = fr.justDown; p.justUp = fr.justUp; p.moved = ptr.moved;
  }

  function end() {
    var z, now = clock();
    // 1. down — down 지점의 가장 위 영역. 그 id 가 이번 누름의 주인이 된다
    if (fr.justDown) {
      z = hitAt(fr.downPos.x, fr.downPos.y);
      ptr.downKey = (z && z.enabled) ? z.id : null;
      if (z && z.enabled && z.down) z.down(p);
    }
    // 2. drag — SLOP 을 넘은 뒤 움직인 프레임마다, down 영역과 같은 id 로 다시 등록된 영역에
    if (ptr.downKey && ptr.moved && (fr.dx || fr.dy) && (ptr.down || fr.justUp)) {
      z = byId(ptr.downKey);
      if (z && z.drag) z.drag(p, fr.dx, fr.dy);
    }
    // 3. long — 움직이지 않고 LONG_PRESS_MS. 1회. 그 뒤 tap 은 없다
    if (ptr.down && !ptr.moved && !ptr.longFired && now - ptr.downT >= Core.BAL.LONG_PRESS_MS) {
      ptr.longFired = true;
      z = ptr.downKey ? byId(ptr.downKey) : hitAt(ptr.x, ptr.y);
      if (z && z.enabled && z.long) z.long(p);
    }
    // 4. up → tap
    if (fr.justUp) {
      if (ptr.downKey) { z = byId(ptr.downKey); if (z && z.up) z.up(p); }
      if (!fr.cancel && !ptr.moved && !ptr.longFired) {
        z = hitAt(fr.upPos.x, fr.upPos.y);
        if (z && z.enabled && z.tap) z.tap(p);
      }
      ptr.downKey = null;
    }
    // 5. wheel
    if (fr.wheel) {
      z = wheelAt(ptr.x, ptr.y);
      if (z) { z.wheel(fr.wheel); api.wheel = 0; } else api.wheel = fr.wheel;
    } else api.wheel = 0;
    // 6. hover·커서 (마우스일 때만)
    var hz = ptr.touch ? null : hitAt(ptr.x, ptr.y);
    hoverId = (hz && hz.enabled && hz.id) ? hz.id : null;
    var cursor = 'default';
    if (hz && hz.enabled) cursor = hz.cursor || ((hz.tap || hz.down || hz.drag) ? 'pointer' : 'default');
    if (env.cv && env.cv.style && cursor !== curCursor) { curCursor = cursor; env.cv.style.cursor = cursor; }
  }

  /* ------------------------------------------------------------------ 키 */
  function key(code) { return !!pressed[code]; }
  function keyDown(code) { return !!down[code]; }
  function consumeKey(code) { var h = !!pressed[code]; pressed[code] = false; return h; }
  function hover(zoneId) { return hoverId !== null && hoverId === String(zoneId); }

  function reset() {
    zones = []; evq.length = 0; wheelBuf = 0; keyBuf = {}; pressed = {}; down = {};
    cur.x = cur.y = 0; hoverId = null; api.wheel = 0; pinned = null;
    ptr.x = ptr.y = ptr.downX = ptr.downY = ptr.downT = ptr.lastX = ptr.lastY = 0;
    ptr.down = false; ptr.pid = null; ptr.moved = false; ptr.longFired = false; ptr.downKey = null;
    fr.justDown = fr.justUp = fr.cancel = false; fr.downPos = fr.upPos = null; fr.dx = fr.dy = fr.wheel = 0;
    p.x = p.y = 0; p.down = p.justDown = p.justUp = p.moved = false;
  }

  /* ------------------------------------------------------------------ selfTest: 가짜 이벤트로 tap/long/drag/가림/키/휠/회전 변환 검증 (DOM 불필요) */
  function selfTest() {
    var errors = [], saved = { env: env, clock: clock, firstDone: firstDone, touch: ptr.touch, isTouch: api.isTouch, cursor: curCursor };
    var T = 0, log = [];
    function check(c, m) { if (!c) errors.push(m); }
    function near(a, b) { return Math.abs(a - b) < 1e-6; }
    function frame(t, reg) { T = t; begin(); if (reg) reg(); end(); }
    function Z(id, extra) {
      var o = { id: id, x: 100, y: 100, w: 100, h: 100, tap: function () { log.push('tap:' + id); } };
      for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) o[k] = extra[k];
      return o;
    }
    clock = function () { return T; };
    env = { win: null, doc: null, cv: { style: {} }, wrap: null, view: { scale: 1, rot: 0 }, cw: 1280, ch: 720 };   // 창 1280×720·배율 1 → 화면 = 캔버스
    reset(); firstDone = false; ptr.touch = false; api.isTouch = false; curCursor = '';
    try {
      // 1. 좌표 변환 — 가로
      var c = toCanvas(100, 200);
      check(near(c.x, 100) && near(c.y, 200), 'toCanvas 가로 배율 1: ' + JSON.stringify(c));
      env.view.scale = 0.5; c = toCanvas(690, 385);
      check(near(c.x, 740) && near(c.y, 410), 'toCanvas 가로 배율 0.5: ' + JSON.stringify(c));
      // 2. 좌표 변환 — 세로 폰 90° (창 360×640, 배율 0.5)
      env.cw = 360; env.ch = 640; env.view = { scale: 0.5, rot: 90 };
      c = toCanvas(180, 320); check(near(c.x, 640) && near(c.y, 360), 'toCanvas 회전 중심: ' + JSON.stringify(c));
      c = toCanvas(360, 640); check(near(c.x, 1280) && near(c.y, 0), 'toCanvas 회전 화면 우하 → 캔버스 우상: ' + JSON.stringify(c));
      c = toCanvas(0, 0); check(near(c.x, 0) && near(c.y, 720), 'toCanvas 회전 화면 좌상 → 캔버스 좌하: ' + JSON.stringify(c));
      env.cw = 1280; env.ch = 720; env.view = { scale: 1, rot: 0 };
      // 3. firstInput 1회
      var nFirst = 0, un = Core.bus.on('firstInput', function () { nFirst++; });
      // 4. tap: down → 다음 프레임 down 콜백 → up → tap 1회, 그 뒤 재발화 없음
      var downN = 0, regA = function () { zone(Z('a', { down: function () { downN++; } })); };
      frame(0, regA);
      check(feedDown(150, 150, false, 'm') === true, 'feedDown 첫 포인터 거부');
      frame(16, regA);
      check(p.justDown && p.down && downN === 1, 'down 콜백/justDown: ' + JSON.stringify(p) + ' downN=' + downN);
      feedUp(152, 151, 'm');
      frame(32, regA);
      check(p.justUp && !p.down && log.join() === 'tap:a', 'tap 판정: ' + log.join() + ' ' + JSON.stringify(p));
      frame(48, regA);
      check(log.length === 1 && !p.justUp && !p.justDown, 'tap 재발화/에지 정리');
      // 5. long: 400ms 뒤 1회, 그 뒤 tap 없음, up 은 온다
      log = []; var upN = 0;
      var regL = function () { zone(Z('l', { long: function () { log.push('long'); }, up: function () { upN++; } })); };
      T = 100; feedDown(150, 150, false, 'm');   // down 시각 100
      frame(100, regL); frame(300, regL); frame(499, regL);
      check(log.length === 0, 'long 이 너무 일찍 발화: ' + log.join());
      frame(500, regL); frame(600, regL);
      check(log.join() === 'long', 'long 1회 발화: ' + log.join());
      feedUp(150, 150, 'm'); frame(616, regL);
      check(log.join() === 'long' && upN === 1, 'long 뒤 tap 억제/up 전달: ' + log.join() + ' upN=' + upN);
      // 6. 움직이면 long·tap 취소
      log = []; feedDown(150, 150, false, 'm'); frame(700, regL);
      feedMove(180, 150, 'm'); frame(716, regL); frame(1200, regL);
      feedUp(180, 150, 'm'); frame(1216, regL);
      check(log.length === 0 && p.moved, '이동 뒤 long/tap 취소 실패: ' + log.join());
      // 7. drag: 프레임마다 dx/dy, 합이 총 이동, up 전달, tap 없음
      log = []; upN = 0; var sx = 0, sy = 0, upAt = null;
      var regD = function () { zone(Z('d', { drag: function (q, dx, dy) { sx += dx; sy += dy; }, up: function (q) { upN++; upAt = { x: q.x, y: q.y }; } })); };
      feedDown(150, 150, false, 'm'); frame(1300, regD);
      feedMove(170, 160, 'm'); frame(1316, regD);
      feedMove(190, 160, 'm'); frame(1332, regD);
      feedUp(200, 170, 'm'); frame(1348, regD);
      check(sx === 50 && sy === 20, 'drag 누적 (50,20) ≠ (' + sx + ',' + sy + ')');
      check(upN === 1 && upAt && upAt.x === 200 && upAt.y === 170 && log.length === 0, 'drag 뒤 up/tap: upN=' + upN + ' ' + JSON.stringify(upAt) + ' ' + log.join());
      // 8. 가림: 위에 enabled:false → 아래 tap 없음. 위가 enabled 면 위만
      log = [];
      var regO1 = function () { zone(Z('under')); zone(Z('cover', { enabled: false })); };
      feedDown(150, 150, false, 'm'); frame(1400, regO1); feedUp(150, 150, 'm'); frame(1416, regO1);
      check(log.length === 0, '비활성 영역이 가리지 못함: ' + log.join());
      var regO2 = function () { zone(Z('under')); zone(Z('over')); };
      feedDown(150, 150, false, 'm'); frame(1500, regO2); feedUp(150, 150, 'm'); frame(1516, regO2);
      check(log.join() === 'tap:over', '위 영역만 받아야 함: ' + log.join());
      // 9. 취소: up 은 오되 tap 은 없다
      log = []; upN = 0;
      feedDown(150, 150, false, 'm'); frame(1600, regD); feedCancel(); frame(1616, regD);
      check(upN === 1 && log.length === 0 && !p.down, 'cancel 처리: upN=' + upN + ' ' + log.join());
      // 10. 멀티터치: 두 번째 손가락 무시, isTouch 켜짐
      check(feedDown(150, 150, true, 1) === true && feedDown(500, 500, true, 2) === false, '두 번째 손가락이 거부되지 않음');
      frame(1700, regA);
      check(ptr.downX === 150 && p.down && api.isTouch === true, '멀티터치 뒤 상태: ' + JSON.stringify(p) + ' isTouch=' + api.isTouch);
      feedUp(500, 500, 2); frame(1716, regA); check(p.down, '다른 손가락의 up 이 첫 손가락을 떼었다');
      feedUp(150, 150, 1); frame(1732, regA); check(!p.down, '첫 손가락 up 실패');
      ptr.touch = false;
      // 11. 키: 에지·상태·consume·preventDefault
      var pd = 0, ev = { code: 'Space', preventDefault: function () { pd++; } };
      feedKey('Space', true, ev); feedKey('Space', true, ev);   // repeat
      feedKey('KeyE', true, { preventDefault: function () { pd += 100; } });
      check(pd === 2, 'Space preventDefault 횟수 ' + pd);
      begin();
      check(key('Space') && keyDown('Space') && key('KeyE'), '키 에지/상태');
      check(consumeKey('Space') === true && !key('Space') && keyDown('Space'), 'consumeKey');
      end(); begin();
      check(!key('KeyE') && keyDown('KeyE'), '다음 프레임 에지 정리');
      feedKey('KeyE', false, {}); feedKey('Space', false, {}); begin();
      check(!keyDown('KeyE') && !keyDown('Space'), 'keyup');
      end();
      check(keyCode({ key: ' ' }) === 'Space' && keyCode({ key: '1' }) === 'Digit1' && keyCode({ key: 'e' }) === 'KeyE' && keyCode({ code: 'Tab' }) === 'Tab', 'keyCode 보정');
      // 12. 휠: 영역이 먹으면 Input.wheel 0, 아니면 남는다
      var got = 0;
      feedMove(150, 150, 'm'); feedWheel(3);
      frame(1800, function () { zone(Z('w', { wheel: function (d) { got += d; } })); zone(Z('top')); });   // 위 영역이 wheel 을 가리지 않는다
      check(got === 3 && api.wheel === 0, '휠 영역 전달: got=' + got + ' wheel=' + api.wheel);
      feedWheel(-2); frame(1816, regA);
      check(api.wheel === -2, '휠 잔여: ' + api.wheel);
      frame(1832, regA); check(api.wheel === 0, '휠 잔여 정리');
      // 13. hover·커서(마우스)
      feedMove(150, 150, 'm'); frame(1900, regA);
      check(hover('a') && env.cv.style.cursor === 'pointer', 'hover/cursor 위: ' + hoverId + ' ' + env.cv.style.cursor);
      feedMove(50, 50, 'm'); frame(1916, regA);
      check(!hover('a') && env.cv.style.cursor === 'default', 'hover/cursor 밖: ' + hoverId + ' ' + env.cv.style.cursor);
      // 14. id 없는 drag/up 은 경고 뒤 무시, 작은 영역 집계
      warned['noid:0,0,20,20'] = true;   // 검사 출력에 경고를 섞지 않는다
      begin(); var zz = zone({ x: 0, y: 0, w: 20, h: 20, tap: function () {}, up: function () {} }); end();
      check(zz.up === null && api.stats.small === 1, 'id 없는 up 무시/작은 영역 집계: ' + api.stats.small);
      check(nFirst === 1, 'firstInput 발화 수 ' + nFirst);
      un();
    } catch (e) {
      errors.push('예외: ' + ((e && e.stack) || e));
    }
    env = saved.env; clock = saved.clock; firstDone = saved.firstDone; curCursor = saved.cursor;
    reset(); ptr.touch = saved.touch; api.isTouch = saved.isTouch;
    return { ok: errors.length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ api */
  var api = {
    init: init, begin: begin, end: end, zone: zone,
    p: p, key: key, keyDown: keyDown, consumeKey: consumeKey,
    wheel: 0, isTouch: false, toCanvas: toCanvas, hover: hover,
    debugPoint: function (x, y) { pinned = x == null ? null : { x: x, y: y }; if (pinned) { cur.x = x; cur.y = y; ptr.touch = false; } },   // QA: 마우스를 캔버스 (x,y)에 고정(사진용 hover), 인자 없으면 푼다
    stats: { zones: 0, small: 0 },
    selfTest: selfTest
  };
  return api;
})();

</script>
<script>
/* ===== src/10_audio.js ===== */
/* ===== 10_audio.js — WebAudio 합성 효과음 25종 + 계면조 음악 3곡(지도·전투·결말). 외부 파일 0 ===== */
// TODO(통합): Main.start 는 bus 'firstInput' 에서 Audio_.init() 을 부르고(여기서도 구독해 두었다 — 두 번 불러도 무해), 씬마다 Audio_.music('map'|'battle'|'ending'|null) 을 부른다(§7.1). init 전에 부른 music 은 기억했다가 init 때 시작한다.
// TODO(통합): Main.setSetting('volume'|'mute') → Audio_.setVolume(v) / Audio_.mute(b). init 때 Main.settings 가 있으면 volume·mute 를 먼저 읽는다.
// TODO(통합): UI 단추는 UIScreens/UIBattle 이 Audio_.sfx('button') 을, 두루마리 펼침은 sfx('scroll') 을 직접 부른다. 전투 소리는 전부 bus 'fx' 로 여기서 매핑한다(§5.9 전부). sfx('move', {dir:-1|1}) 두 번째 인자는 선택.
// TODO(통합): fx enemyDeath 의 격침/백병 구분은 ENEMIES.get(id).tags 의 'ship' 으로 한다. ENEMIES 가 없으면 melee.
// TODO(통합): 헤드리스(AudioContext 없음)에서는 init 이 조용히 비활성, 모든 호출이 no-op 이며 타이머도 만들지 않는다. selfTest 는 ctx 없이 돈다.
var Audio_ = (function () { 'use strict';

  var CFG = { MASTER: 0.8, SFX_GAIN: 1.0, MUSIC_GAIN: 0.55, LOOKAHEAD: 0.45, TICK_MS: 100, THROTTLE: 0.03, NOISE_SEC: 2, HUSH: 0.45, FADE: 0.15 };
  // 계면조 5음: 황종 E♭ · 태주 F · 중려 A♭ · 임종 B♭ · 남려 C. 3옥타브(E♭3)부터 세 옥타브, 도수 0~14
  var SCALE = [155.56, 174.61, 207.65, 233.08, 261.63];
  var FINALS = [0, 3, 5, 8, 10, 13];   // 마침음: 황종·임종(각 옥타브)
  var PHRASE = 24;                     // 악구 = 12박 장단 두 바퀴
  var SFX_NAMES = ['card', 'shot', 'melee', 'gun', 'fire', 'sink', 'drum', 'horn', 'banner', 'suspicion', 'scroll', 'button', 'move',
    'win', 'lose', 'load', 'tide', 'hwacha', 'turtle', 'parley', 'hit', 'block', 'draw', 'rescue', 'spawn'];

  var ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null, noiseOff = 0;

  }

    start: start, update: update, draw: draw, stop: stop, debugEnd: debugEnd,
    debugAct: function (fn) { if (S) return act(function () { return fn(S.st); }); },

<script>
/* ===== src/12_ui_screens.js ===== */
/* ===== 12_ui_screens.js — 제목·주장 선택·설정·덱 보기 + 판 프롬프트 화면 13종 (전역 UIScreens) ===== */
// 계약서 §7.4. 화면은 Run.current() 프롬프트를 그리고, 고른 것을 Run.answer(a) 로 넘긴다.

  var W = 1280, H = 720, B = Core.BAL;

  function answer(a) {

  }
  var RELIC_ICON = { turtle_blueprint: 'turtle', jincheonroe_relic: 'bomb', hwacha_relic: 'cart', nanjung_relic: 'scroll', jingbirok: 'scroll', tonga: 'arrow', hangwae_gun: 'gun',
    obangnang: 'coin', seoae_brush: 'letter', chains: 'chain', joryeong_stone: 'mountain', hansan_drum: 'drum', jinju_drum: 'drum', haengju_ash: 'smoke', jiksan_spear: 'spear',

  function relicBadge(c, id, x, y, r) {

  /* ================================================================ 배경 */

  function board(key, sea) {

    var sg = c.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, '#62a8d2'); sg.addColorStop(1, '#2f74a6');
    c.fillStyle = sg; c.fillRect(0, 0, W, H);
    function blob(cx, cy, rx, ry, seed) {
      var rr2 = Core.rngNew(seed); c.beginPath();
      for (var a = 0; a <= 36; a++) { var t = a / 36 * Math.PI * 2, k = 0.82 + Core.rand(rr2) * 0.28; c.lineTo(cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k); }

      blob(cx, cy, rx, ry, seed); var lg = c.createLinearGradient(0, cy - ry, 0, cy + ry); lg.addColorStop(0, '#a8cf82'); lg.addColorStop(1, '#7aa85a'); c.fillStyle = lg; c.fill();

    else if (sea === 'strait') { land(640, 150, 760, 210, key + 'a'); land(640, 690, 760, 170, key + 'b'); }

      land(640, 30, 760, 70, key + 'n'); land(640, 660, 820, 250, key + 's');
      [[250, 300], [560, 330], [900, 320], [1080, 250]].forEach(function (q, i) { land(q[0], q[1], 48 + i * 6, 26, key + 'i' + i); });
    }
    else {
      c.fillStyle = '#8fbc6a'; c.fillRect(0, 0, W, H);
      var rv = Core.rngNew(key + 'river'), ry = 130 + Core.rand(rv) * 80;   // 강 하나가 판을 가로지른다
      c.lineCap = 'round'; c.lineJoin = 'round';
      [[34, '#e8d7a0'], [22, '#4f93c4'], [8, 'rgba(255,255,255,.18)']].forEach(function (st) {
        c.strokeStyle = st[1]; c.lineWidth = st[0]; c.beginPath(); c.moveTo(-20, ry);
        for (var xx = 0; xx <= W + 40; xx += 80) c.lineTo(xx, ry + Math.sin(xx / 170 + 1.3) * 60 + xx * 0.32);

    function isLand(x, y) { try { var d = c.getImageData(Math.max(0, Math.min(W - 1, x | 0)), Math.max(0, Math.min(H - 1, y | 0)), 1, 1).data; return d[1] > d[2] + 20; } catch (e) { return true; } }
    for (var k = 0; k < 90; k++) { var x = Core.rand(r) * W, y = Core.rand(r) * H; if (isLand(x, y)) continue; c.beginPath(); c.arc(x, y, 8, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
    // 산과 숲 (땅 위에만 대충 — 바다 위에 겹쳐도 섬처럼 보인다)
    for (var m = 0; m < 26; m++) {
      var mx = Core.rand(r) * W, my = 80 + Core.rand(r) * (H - 140), s = 0.8 + Core.rand(r) * 0.9;
      if (!isLand(mx - 24 * s, my + 12 * s) || !isLand(mx + 26 * s, my + 12 * s) || !isLand(mx, my - 18 * s)) continue;
      c.save(); c.translate(mx, my); c.scale(s, s);
      c.beginPath(); c.moveTo(-22, 12); c.lineTo(-4, -18); c.lineTo(6, -4); c.lineTo(12, -12); c.lineTo(26, 12); c.closePath(); c.fillStyle = '#6f8f5a'; c.fill();
      c.beginPath(); c.moveTo(-9, -6); c.lineTo(-4, -18); c.lineTo(1, -8); c.closePath(); c.fillStyle = '#f2f2ea'; c.fill();
      c.restore();
    }
    for (var tr = 0; tr < 70; tr++) { var tx = Core.rand(r) * W, ty = 60 + Core.rand(r) * (H - 120); if (!isLand(tx, ty)) continue; c.fillStyle = 'rgba(60,110,50,.75)'; c.beginPath(); c.arc(tx, ty, 6 + Core.rand(r) * 4, 0, 7); c.fill(); }
    var vg = c.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 860); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,30,40,.45)');

    bgCache[key] = cv;
    return cv;
  }
  function mapBg(c, act) {

  }
  function darkBg(c) {
    var grd = c.createRadialGradient(W / 2, H * 0.4, 100, W / 2, H / 2, 900); grd.addColorStop(0, '#4a3424'); grd.addColorStop(1, '#140e09');
    c.fillStyle = grd; c.fillRect(0, 0, W, H);

  function backdrop(c, act) { mapBg(c, act); c.fillStyle = 'rgba(16,10,6,.58)'; c.fillRect(0, 0, W, H); }
  function titleScene() {

    var c = cv.getContext('2d'), r = Core.rngNew('title');
    var sky = c.createLinearGradient(0, 0, 0, 470); sky.addColorStop(0, '#2a2a5a'); sky.addColorStop(0.45, '#c8584a'); sky.addColorStop(1, '#ffc46a');

    var sun = c.createRadialGradient(W / 2, 420, 60, W / 2, 420, 420); sun.addColorStop(0, 'rgba(255,220,140,.55)'); sun.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = sun; c.fillRect(0, 0, W, 470);

  /* ================================================================ 판 머리띠 */

  var W = 1280, H = 720;

  function loadSettings() {

  }
  function setSetting(k, v) {
