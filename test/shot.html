<!DOCTYPE html>
<html lang="ko" data-slug="jingbi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0a08">
<title>징비 — 일곱 해의 패</title>
<style>
  html,body{margin:0;padding:0;background:#0b0a08;height:100%;overflow:hidden;
    font-family:"Nanum Myeongjo","Batang","AppleMyungjo","Malgun Gothic",serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:50% 50%;}
  canvas{display:block;image-rendering:auto;box-shadow:0 0 60px rgba(0,0,0,.9);background:#0b0a08;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<script src="../src/00_core.js"></script>
<script src="../src/01_text.js"></script>
<script src="../src/02_cards.js"></script>
<script src="../src/03_enemies.js"></script>
<script src="../src/04_generals.js"></script>
<script src="../src/05_events.js"></script>
<script src="../src/06_map.js"></script>
<script src="../src/07_combat.js"></script>
<script src="../src/08_run.js"></script>
<script src="../src/09_input.js"></script>
<script src="../src/10_audio.js"></script>
<script src="../src/10b_art.js"></script>
<script src="../src/11_ui_battle.js"></script>
<script src="../src/12_ui_screens.js"></script>
<script src="../src/13_main.js"></script>
<script>
Main.start();
(function(){
  var J = Main.debug;
  function cur(){ return Run.current(); }
  function skipScrolls(n){ for (var i=0;i<(n||6);i++){ var p=cur(); if (p && p.kind==='scroll') J.answer({}); else break; } }
  function enter(kind, type, actFrom){
    for (var a=(actFrom||1); a<=7; a++){ var cols = MAPDATA.acts[a].cols.length;
      for (var c=1; c<=cols; c++){ J.goto(a, c); skipScrolls(); var p=cur(); if(!p||p.kind!=='map') continue;
        for (var k=0;k<p.reachable.length;k++){ var n=MAPDATA.nodes.byId[p.reachable[k]];
          if (n.kind===kind && (!type || n.type===type)) { J.answer({nodeId:n.id}); return n.id; } } } }
    throw new Error('no node '+kind);
  }
  function go(nodeId){ var n=MAPDATA.nodes.byId[nodeId]; if(!n) throw new Error('no node '+nodeId);
    J.goto(n.act, n.col); skipScrolls(); var p=cur(); if(!p||p.kind!=='map'||p.reachable.indexOf(nodeId)<0) throw new Error('not reachable '+nodeId); J.answer({nodeId:nodeId}); return nodeId; }
  function key(code){ dispatchEvent(new KeyboardEvent('keydown',{code:code,key:code})); J.tick(1,16); dispatchEvent(new KeyboardEvent('keyup',{code:code,key:code})); J.tick(2,16); }
  window.SH = { J:J, cur:cur, enter:enter, go:go, key:key, skipScrolls:skipScrolls, tick:function(n,dt){ return J.tick(n||30, dt||33); } };
  try { var code = decodeURIComponent(location.hash.slice(1)); if (code) eval(code); SH.tick(40, 33); document.title = 'OK ' + Main.scene + ' ' + ((cur()||{}).kind||''); }
  catch (e) { document.title = 'ERR ' + e.message; Main.report(e); SH.tick(2, 16); }
})();
</script>
</body>
</html>
